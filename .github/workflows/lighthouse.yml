name: Lighthouse Quality Gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @lhci/cli@0.15.x serve
      - run: |
          serve . -l 4173 >/tmp/serve.log 2>&1 &
          sleep 3
          lhci autorun
