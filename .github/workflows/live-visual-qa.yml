name: Live visual QA

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/live-visual-qa.mjs"
      - ".github/workflows/live-visual-qa.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: npx --yes playwright@1.58.1 install --with-deps chromium
      - name: Capture production pages
        id: capture
        continue-on-error: true
        env:
          SITE_URL: https://mahmoud-salama.vercel.app
        run: npx --yes -p playwright@1.58.1 node tests/live-visual-qa.mjs
      - name: Upload screenshots and report
        uses: actions/upload-artifact@v4
        with:
          name: live-visual-qa
          path: artifacts/visual-qa
          if-no-files-found: error
      - name: Enforce visual QA
        if: steps.capture.outcome == 'failure'
        run: exit 1
