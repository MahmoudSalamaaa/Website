e.","/architecture-map.html"],["ai rag llm governance","AI","Verified scoped experience includes RAG, LLMOps and AI Governance. These are not presented as deep-specialist claims.","/technologies.html"],["oman gcc","Oman delivery","Oman experience includes leadership of a 20-person development team, 15+ government/enterprise platforms and the National Educational Portal at approximately 1M users.","/experience.html"],["appm africa procurement","APPM","APPM was delivered end-to-end by an in-house team under Mahmoud's leadership and designed to support pooled procurement across all 55 AU Member States. This does not claim active use by all 55 countries.","/flagship-cases.html"],["award itida yashfeen pharmaconex","Recognition","Yashfeen is an ITIDA-winning project; Keyframe achieved three ITIDA wins. MedIQ/transformation programme received Pharmaconex Awards 2026 — Excellence in Digital Transformation.","/evidence.html"]];const q=document.querySelector("#q"),a=document.querySelector("#a");function go(){let s=q.value.toLowerCase().trim();if(!s){a.innerHTML="";return}let words=s.split(/\s+/),m=K.map(x=>[x,words.filter(w=>x[0].includes(w)).length]).filter(x=>x[1]).sort((x,y)=>y[1]-x[1]);a.innerHTML=m.length?m.slice(0,4).map(([x])=>'<article class="a"><div class="tag">SUPPORTED BY APPROVED EVIDENCE</div><h2>'+x[1]+'</h2><p>'+x[2]+'</p><a href="'+x[3]+'">Open supporting route →</a></article>').join(""):'<article class="a"><div class="tag">NOT EVIDENCED HERE</div><p>I do not have approved public evidence in this index to answer that. Try the Evidence Library instead of inferring a claim.</p><a href="/evidence.html">Evidence Library →</a></article>'}q.oninput=go;</script><script src="/assets/global-footer.js"></script></body></html>
