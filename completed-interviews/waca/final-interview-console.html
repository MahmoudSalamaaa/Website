<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSF WaCA ISM — Final Audited Interview Console</title><style>body{font-family:Inter,Segoe UI,system-ui,sans-serif;margin:0;background:#f7f9fc;color:#172033}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:#fff;border:1px solid #dce3ed;border-radius:22px;padding:24px;box-shadow:0 10px 30px #20305012}.home{display:inline-block;text-decoration:none;color:#3156a3;font-weight:800;margin-bottom:12px}.note{margin-top:14px;background:#eef6ff;border:1px solid #c8ddf5;padding:13px;border-radius:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.toolbar button{padding:11px 13px;border-radius:10px;border:1px solid #cfd8e5;background:#fff;font:inherit}.toolbar input{flex:1;min-width:260px}.toolbar button{font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid #dce3ed;border-radius:17px;padding:18px}.meta{display:flex;justify-content:space-between;gap:8px;color:#657086;font-size:.8rem}.q{font-weight:900;font-size:1.05rem;margin:9px 0}.trigger{background:#f2f5f9;border-radius:9px;padding:8px;font-size:.83rem;font-weight:700}.answer{white-space:pre-line;line-height:1.55;margin-top:12px}.evidence,.boundary{margin-top:10px;padding:9px;border-radius:9px;font-size:.82rem}.evidence{background:#effaf2;border:1px solid #c8ebd0}.boundary{background:#fff5f3;border:1px solid #f0ccc5}.copy{margin-top:12px;padding:8px 11px;border:0;border-radius:9px;background:#244c96;color:#fff;font-weight:800;cursor:pointer}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><section class="hero"><a class="home" href="/waca/">← WaCA Home</a><h1>Final Audited Interview Console</h1><p>MSF WaCA · Information System Manager · evidence-first preparation.</p><div class="note"><b>Rule:</b> Answer directly → use verified evidence → state the boundary → stop. Never invent WaCA architecture, historical metrics, tools or hands-on responsibilities.</div></section><div class="toolbar"><input id="s" placeholder="Search: DR, AWS, offline, MFA, integration, UniField…"><select id="cat"><option value="">All categories</option></select><button id="compact">Compact</button></div><main id="grid" class="grid"></main></div><script>
const D=[
['Background','⭐⭐⭐','Tell us about yourself.','NOW → UPA → Oman → Engineering → WaCA',`I’m an Information Systems and Digital Transformation leader with more than 18 years of experience.\n\nCurrently, I head Information Systems and Digital Transformation at Egypt’s Unified Procurement Authority, leading a 54-person technology organization across enterprise applications, integration, infrastructure and security oversight, technical support and digital transformation.\n\nI joined UPA in 2020, initially leading Systems, Applications and Technical Support, and my responsibilities progressively expanded into my current enterprise leadership role.\n\nBefore UPA, I spent more than four years in Oman as a Development Team Leader and Senior Full-Stack Developer, working on government platforms including a national educational portal serving around one million users.\n\nEarlier in my career, I progressed from hands-on software engineering into technical leadership.\n\nToday, I bring together engineering foundations, international government technology experience, healthcare technology, enterprise information systems and senior technology leadership. That combination is what makes this opportunity particularly relevant to me.`,'18+ years · UPA since 2020 · 54-person organization · Oman · ~1M-user portal','Current cloud/infrastructure/security = leadership and governance, not daily administration.'],
['Motivation','⭐⭐⭐','Why MSF WaCA?','Healthcare → Operational impact → Field reality → Adapt',`MSF WaCA combines healthcare, technology and direct operational impact. My current work already involves mission-critical healthcare-related information systems at national scale, but WaCA adds a field dimension where technology reliability directly affects humanitarian operations.\n\nI can bring experience in continuity, enterprise systems, integration, security governance and large-scale user support, while adapting those disciplines to MSF’s field realities rather than assuming that my current operating model can simply be copied.`,'Mission-critical healthcare systems · continuity · integration · security governance · national-scale support','Do not claim prior humanitarian employment.'],
['Motivation','⭐⭐⭐','Why move from your current senior position?','Scope → Impact → Mission, not title',`I evaluate opportunities by scope and impact, not title alone. This role combines enterprise systems, security, cloud, continuity, global collaboration and field operations. Together with MSF’s humanitarian mission, that makes it a meaningful professional step for me.`,'Current enterprise leadership + international/government background','Do not frame the move as title-driven.'],
['Role','⭐⭐⭐','What is your understanding of this role?','Security → Availability → Lifecycle → DR → Vendors → Integration',`I see the Information System Manager as responsible for the health and lifecycle of WaCA’s enterprise systems. That includes security, availability, performance, backup and disaster recovery, application lifecycle, integrations, licensing, vendors and documentation. It also means coordinating effectively with Support, Security, SITS, business owners and field teams.`,'WaCA role themes across systems, security, DR, lifecycle, vendors, integrations and documentation','Do not collapse the role into help desk/support management.'],
['Leadership','⭐⭐⭐','What would you do in your first 90 days?','Understand → Baseline → Prioritize → Improve → Roadmap',`First, I would understand before changing. I would map critical systems, owners, dependencies, contracts, recurring incidents and field needs. Then I would establish a baseline across availability, security, recovery, lifecycle and support risks. By day 90, I would agree on a prioritized roadmap with clear ownership, measurable improvements and a small number of realistic quick wins.`,'Transferable governance model: ownership, criticality, dependencies, risks, roadmap','Do not promise architecture changes before learning WaCA’s environment.'],
['Incident','⭐⭐⭐','How would you handle a major system incident?','Impact → Severity → Owner → Communicate → Restore → RCA',`First, I confirm business impact and severity, establish clear incident ownership and communicate. Then I restore the safest critical service or approved workaround. After stabilization, I validate the service, perform root-cause analysis and track corrective actions to closure.`,'Major-incident participation and service-operations oversight','Do not invent outage timelines or metrics.'],
['DR','⭐⭐⭐','Explain RTO and RPO.','RTO = TIME · RPO = DATA',`Recovery Time Objective is the maximum acceptable time to restore a service. Recovery Point Objective is the maximum acceptable amount of data loss measured in time. I derive both from business impact and system criticality, then design recovery controls around those targets.`,'DR governance + successful MedIQ failover','Do not invent MedIQ RTO/RPO numbers.'],
['DR','⭐⭐⭐','How do you approach Backup and Disaster Recovery?','Criticality → RTO/RPO → Backup → Failover → TEST',`I start with system criticality, dependencies, RTO and RPO, then design the backup, redundancy and recovery controls needed to meet those objectives. Most importantly, I test recovery rather than relying on successful backup jobs.\n\nA concrete example is MedIQ: we implemented an alternate disaster-recovery data-center arrangement and successfully executed an actual failover, with MedIQ operating from the alternate environment. That reinforces a principle I would bring to MSF: backup success is not recovery assurance.`,'MedIQ alternate DR data center + actual successful failover + service operated from alternate environment','No unverified RTO/RPO values.'],
['MSF Apps','⭐⭐⭐','What do you know about UniField?','Finance + Supply → Availability → Backup → Patch → Integrity → Support',`I understand UniField is an important MSF information system integrating finance and supply processes. From an Information Systems perspective, I would focus on availability, access control, backup and recovery, patching, data integrity, interfaces, supportability and escalation. I would first learn WaCA’s actual configuration and dependencies before proposing changes.`,'Transferable evidence: procurement/supply systems, continuity and integration','Do not assume WaCA topology, offline behavior, versions or ownership.'],
['MSF Apps','⭐⭐','What do you know about eHealth?','Infrastructure → Connectivity → Security → Evidence → Escalation',`I understand eHealth is another important MSF application environment. From the Information Systems side, I would focus on infrastructure and connectivity, secure configuration, documented troubleshooting and correct escalation. For a clinical system, I would avoid unsupported changes and work through the defined application support process.`,'Healthcare systems + infrastructure/connectivity/security/escalation governance','Do not assume exact WaCA eHealth topology.'],
['SITS','⭐⭐⭐','How would you work with SITS?','Catalogue → Ownership → Reuse → Gap → Collaborate',`I would first understand the SITS service catalogue, ownership boundaries and escalation paths. Where SITS already provides an appropriate shared capability, I would use it rather than create unnecessary local duplication. Where WaCA has a genuine operational gap, I would document the requirement and work with SITS toward the appropriate solution.`,'Cross-team/shared-stakeholder coordination','Treat SITS as shared IT capability/services, not as an application.'],
['AWS','⭐⭐⭐','Explain the AWS Shared Responsibility Model.','OF cloud / IN cloud → IAM → Data → Config → Logs → Patch',`AWS is responsible for security of the cloud, while the customer remains responsible for security in the cloud, with the exact boundary depending on the service being used. From the customer side, I would focus on identity and access, data protection, secure configuration, logging and monitoring, application security and patching where applicable.`,'AWS was an actual recruitment/interview topic','Do not imply WaCA runs AWS or overclaim hands-on AWS administration.'],
['AWS','⭐⭐⭐','How would you approach AWS security and monitoring?','IAM → Logs → Monitor → Alert → Respond',`I want logging to be centralized, protected, searchable and actionable. I would monitor relevant account, infrastructure and application activity and create alerts around meaningful risks. Logs need clear ownership, appropriate retention and a defined incident-response process.`,'IAM/RBAC/least privilege + MedIQ OTP MFA + logging/monitoring governance','Do not claim specific AWS services were used in your current environment.'],
['AWS','⭐⭐⭐','How would you design AWS Disaster Recovery?','RTO/RPO → Architecture → Backup → AZ → Wider DR → TEST',`I would start with business-defined RTO and RPO. Then I would select the architecture needed to meet those objectives, including backup protection and appropriate redundancy. For critical workloads, that could include multiple Availability Zones and, where business impact justifies it, a broader disaster-recovery architecture. Most importantly, I would test recovery.`,'Strong transferable evidence: successful MedIQ alternate-site failover','Do not imply MedIQ DR was on AWS.'],
['Microsoft','⭐⭐⭐','How would you manage Microsoft 365, Azure and privileged access?','MFA → Least privilege → RBAC → Separate admin → Review',`I use an identity-first approach. I would apply MFA, least privilege, role-based access control, separate administrative accounts, secure configuration, logging and regular access reviews. Privileged access should be limited, auditable and time-bound where possible.\n\nMy current responsibility is primarily at leadership and governance level rather than daily cloud administration. I oversee teams responsible for Azure and hybrid environments and stay technically close enough to review designs, understand incidents and make accountable decisions.`,'Azure/hybrid oversight + identity governance + OTP MFA rollout','Leadership/governance, not daily Azure administration.'],
['Windows','⭐⭐','How would you manage Windows Server environments?','Inventory → Criticality → Patch → Privilege → Monitor → Recover',`I would start with a clear inventory, ownership and criticality classification. My operational baseline would include secure configuration, patch management, identity and privileged access controls, monitoring, backup and tested recovery. For critical servers, I also want dependencies and recovery procedures documented. My current role is oversight and governance rather than daily server administration.`,'Infrastructure oversight + earlier hands-on web/application engineering','Do not present yourself as the daily Windows Server administrator.'],
['MDM','⭐⭐⭐','How would you manage MDM in field environments?','Enroll → Encrypt → Lock → Compliance → Apps → Wipe',`I would use Mobile Device Management to enforce a practical baseline around enrollment, encryption, screen lock, compliance, controlled applications and remote wipe where appropriate. The controls must also work under real field connectivity and operational constraints. I prefer controlled, documented exceptions over weakening the baseline for everyone. My current responsibility is governance and oversight rather than daily MDM administration.`,'MedIQ Mobile gives real mobile/field operational context','Do not claim hands-on Intune/MDM administration unless verified.'],
['Integration','⭐⭐⭐','Tell us about a complex integration you led.','Need → Architecture → Data → Mapping → Security → UAT → Go-live → Reconcile',`One strong example is the integration between UPA’s national procurement platform and the Strategic Medical Warehouses system. I led the UPA side end-to-end, from requirements and integration architecture through master-data harmonization, mappings, security, UAT, go-live and production reconciliation. It was a bi-directional enterprise integration covering procurement-request and financial workflows. The external warehouse platform was SAP-based, but my responsibility was enterprise integration rather than SAP configuration. The key lesson was that enterprise integration is not only about APIs; it is about ownership, data governance, controls and reconciliation.`,'Bi-directional Strategic Medical Warehouses integration · master data · UAT · production reconciliation','SAP-based external platform; do not claim SAP configuration expertise.'],
['Lifecycle','⭐⭐','How do you manage application lifecycle?','Owner → Version → Dependency → Risk → Maintain/Upgrade/Replace/Retire',`Every critical application needs a clear owner, criticality classification and lifecycle plan. I monitor versions, dependencies, security exposure, vendor support, integrations and technical debt. Based on operational value and risk, the decision should be explicit: maintain, upgrade, consolidate, replace or retire.`,'MedIQ ecosystem governance + releases + architecture/change control','Keep lifecycle decisions explicit and evidence-based.'],
['Leadership','⭐⭐⭐','How do you lead technical teams / How hands-on are you?','Clarity → Ownership → Trust → Accountability → Technical depth',`I currently lead a 54-person technology organization with seven direct reports. At that scale, my role is to create clear ownership and decision boundaries rather than personally control every technical task. I no longer perform every engineering task myself, but I stay technically close to critical work: I review architecture, integration, security and recovery decisions, participate in major incidents and go deep enough to challenge technical proposals and make accountable decisions. Earlier in my career I was hands-on, including as a Senior Full-Stack Developer and Development Team Leader in Oman.`,'54-person organization · 7 direct reports · Oman hands-on engineering · ~1M-user portal','Do not imply you still personally perform every engineering/admin task.'],
['Field','⭐⭐⭐','How would you handle poor field connectivity?','Critical process → Offline/Degraded → Fallback → Sync → Reconcile',`I first identify what must continue during the outage. I favor simple, resilient solutions with supported offline or degraded operation where appropriate, a safe fallback, and controlled synchronization and reconciliation when connectivity returns. I do have directly relevant experience in MedIQ Mobile inventory workflows, where the architecture supports offline-first local transaction capture during connectivity loss and synchronization after reconnection. I would still validate the supported behavior of each MSF application before transferring that pattern.`,'MedIQ Mobile Offline-First architecture · local capture · synchronization after reconnection · delta synchronization','Do not assume UniField/eHealth use the same offline architecture.'],
['Security','⭐⭐⭐','How do you balance security with an urgent operational need?','Need → Risk → Minimum access → Approve → Monitor → Expire',`I treat both the operational need and the security exposure as real risks. I understand the urgency, assess the threat and choose the safest temporary control with minimum necessary access. Any exception should have a clear owner, approval, monitoring and an expiry or review point. A concrete security-rollout example from my environment is the implementation and rollout of OTP-based MFA across MedIQ; I would not relabel that as a historical exception case unless the specific exception is verified.`,'MedIQ OTP-based MFA implementation and rollout','Do not invent a past temporary-security-exception incident.'],
['Adoption','⭐⭐','How do you drive training and adoption at scale?','Role-based → Practical → Support → Feedback → Improve',`At UPA, adoption is an operating responsibility at national scale. The MedIQ ecosystem serves more than 38,000 users across more than 11,000 healthcare facilities and over 2,000 suppliers. My organization includes an approximately 20-person technical support/customer-service operation, and my scope includes training, onboarding, adoption, documentation and escalation to specialist teams. I segment users by role and critical task, use practical guidance and support feedback, and treat recurring user errors as signals to improve training, process or system design.`,'38,000+ users · 11,000+ facilities · 2,000+ suppliers · ~20 support/customer-service operation','Use canonical scale; do not substitute older 39k/12k figures.'],
['Vendor','⭐⭐','How do you manage vendors, licenses and support contracts?','Inventory → Renewal → SLA → Performance → Escalation → Exit',`From the Information Systems side, I maintain visibility of applications, licenses, owners, renewal dates, support status, dependencies, utilization and contractual SLAs. Before renewal or procurement, I challenge whether the capability is still required, whether shared services already cover the need and what the operational and exit risks are. For vendors, I want measurable SLAs, clear escalation, recurring service reviews, corrective actions and knowledge-transfer expectations.`,'Direct coordination with implementation/integration teams; UPA-side testing, readiness, go-live and production support','Do not claim personally negotiated every enterprise commercial agreement.']
];
const cats=[...new Set(D.map(x=>x[0]))];const cat=document.getElementById('cat');cats.forEach(c=>cat.insertAdjacentHTML('beforeend',`<option>${c}</option>`));let compact=false;function render(){let q=document.getElementById('s').value.toLowerCase(),c=cat.value;let rows=D.filter(x=>(!c||x[0]===c)&&x.join(' ').toLowerCase().includes(q));document.getElementById('grid').innerHTML=rows.map(x=>`<article class="card"><div class="meta"><span>${x[0]}</span><span>${x[1]}</span></div><div class="q">${x[2]}</div><div class="trigger">${x[3]}</div><div class="answer">${compact?x[4].split('\n\n')[0]:x[4]}</div>${compact?'':`<div class="evidence"><b>REAL EVIDENCE:</b> ${x[5]}</div><div class="boundary"><b>BOUNDARY:</b> ${x[6]}</div>`}<button class="copy" data-a="${encodeURIComponent(x[4])}">Copy answer</button></article>`).join('');document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(decodeURIComponent(b.dataset.a));b.textContent='Copied ✓'})}document.getElementById('s').oninput=render;cat.onchange=render;document.getElementById('compact').onclick=()=>{compact=!compact;render()};render();</script></body></html>
