<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Explorer | Mahmoud Salama</title><link rel="stylesheet" href="/assets/global-footer.css"><style>body{margin:0;font-family:Inter,system-ui;background:#071923;color:#e9f2f3}.wrap{width:min(1100px,92vw);margin:auto;padding:70px 0}h1{font-size:clamp(3rem,8vw,6rem);letter-spacing:-.06em;line-height:.9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.node{background:#102a37;border:1px solid #254553;border-radius:22px;padding:20px}.proof{display:inline-block;background:#dff7f3;color:#075e59;border-radius:999px;padding:7px 10px;margin:4px;font-size:.8rem;font-weight:800}.node a{color:#78ddd5;font-weight:800;margin-right:12px}</style></head><body><main class="wrap"><p><b>CLAIM → PROJECT → PROOF → ROUTE</b></p><h1>Evidence<br>Explorer.</h1><div id="g" class="grid"></div></main><script>fetch("/data/evidence-graph.json").then(r=>r.json()).then(d=>{document.querySelector("#g").innerHTML=d.nodes.map(n=>'<article class="node"><h2>'+n.label+'</h2><div>'+n.proof.map(p=>'<span class="proof">'+p+'</span>').join("")+'</div><p>'+n.routes.map((r,i)=>'<a href="'+r+'">Evidence '+(i+1)+' →</a>').join("")+'</p></article>').join("")+'<article class="node"><h2>Explicit boundaries</h2>'+d.boundaries.map(x=>'<p>• '+x+'</p>').join("")+'</article>'})</script><script src="/assets/global-footer.js"></script></body></html>
