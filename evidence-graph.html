<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Graph — Mahmoud Salama</title><meta name="description" content="Trace executive claims to projects, evidence routes and outcomes."><link rel="manifest" href="/site.webmanifest"><link rel="stylesheet" href="/assets/site-command.css"><style>body{margin:0;background:#f6f8f7;color:#10263b;font:16px/1.6 system-ui}.w{width:min(1120px,calc(100% - 32px));margin:auto;padding:54px 0}h1{font-size:clamp(38px,6vw,70px);line-height:1;margin:0 0 12px}.lead{max-width:760px;color:#526675}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:30px}.card{background:#fff;border:1px solid #dce4e2;border-radius:22px;padding:22px}.card h2{margin-top:0}.proof{padding-left:20px}.routes{display:flex;flex-wrap:wrap;gap:8px}.routes a{padding:8px 11px;border-radius:999px;background:#eaf5f3;color:#0c5e59;text-decoration:none;font-weight:750}.bounds{margin-top:28px;background:#10263b;color:#fff;border-radius:22px;padding:22px}.bounds li{margin:8px 0}</style></head><body><main class="w"><a href="/">← Home</a><h1>Evidence Graph</h1><p class="lead">A traceable view of leadership claims: what the claim is, where the work sits, what proof is available, and where to inspect the deeper evidence.</p><div id="graph" class="grid"></div><section class="bounds"><h2>Claim boundaries</h2><ul id="bounds"></ul></section></main><script>fetch('/data/evidence-graph.json').then(r=>r.json()).then(d=>{document.querySelector('#graph').innerHTML=d.nodes.map(n=>'<article class="card"><h2>'+n.label+'</h2><ul class="proof">'+n.proof.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="routes">'+n.routes.map(x=>'<a href="'+x+'">Inspect evidence →</a>').join('')+'</div></article>').join('');document.querySelector('#bounds').innerHTML=d.boundaries.map(x=>'<li>'+x+'</li>').join('')})</script><script src="/assets/site-command.js" defer></script></body></html>
