name: Brand Quality Guard
on:
  pull_request:
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect main site and card from additive-package regressions
        run: python executive-capital/brand-guard/brand_guard.py executive-capital
