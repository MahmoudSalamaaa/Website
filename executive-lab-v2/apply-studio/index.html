<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Application Microsite Studio | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Company-specific persuasion asset</span><h1>Application Microsite Studio</h1><p class="lead">Generate a private, noindex application microsite that connects a specific role to the strongest evidence and a concise first-90-days approach.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Company</label><input id="company"></div><div class="field"><label>Role</label><input id="role"></div><div class="field" style="grid-column:1/-1"><label>Job description</label><textarea id="jd"></textarea></div></div><div class="actions"><button class="btn primary" id="gen">Generate microsite</button><button class="btn" id="download">Download HTML</button></div></div></section><section class="section"><div class="shell"><div id="preview" class="panel"><p class="muted">Generated page will appear here. The output includes noindex metadata by default.</p></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');
let html='';Promise.all([fetch('../data/evidence.json').then(r=>r.json()),fetch('../data/roles.json').then(r=>r.json())]).then(([ev,roles])=>{function build(){const company=document.getElementById('company').value||'Target Company';const role=document.getElementById('role').value||'Target Role';const jd=document.getElementById('jd').value;const matches=ECP2.matchEvidence(jd,ev).slice(0,4);const route=ECP2.cvRoute(jd,roles);html=`<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahmoud Salama → ${ECP2.esc(company)} | ${ECP2.esc(role)}</title><style>body{font:15px/1.6 Arial;margin:0;background:#f4f7fa;color:#14293c}.w{width:min(900px,calc(100% - 30px));margin:auto}.h{padding:60px 0}.c{background:#fff;border:1px solid #d7e3ec;border-radius:16px;padding:20px;margin:12px 0}h1{font-size:48px;line-height:1;margin:8px 0}.b{font-weight:800;color:#078fa9}</style></head><body><main class="w"><section class="h"><div class="b">Confidential candidate brief · noindex</div><h1>Why Mahmoud for ${ECP2.esc(role)}</h1><p>Prepared specifically for ${ECP2.esc(company)} using evidence-backed experience.</p></section>${matches.map(x=>`<section class="c"><div class="b">Relevant proof</div><h2>${ECP2.esc(x.title)}</h2><p>${ECP2.esc(x.summary)}</p><p><b>${x.metrics.map(ECP2.esc).join(' · ')}</b></p></section>`).join('')}<section class="c"><h2>Closest CV route</h2><p>${ECP2.esc(route?.title||route?.id||'Executive technology CV')}</p></section><section class="c"><h2>30/60/90 approach</h2><p><b>30:</b> understand outcomes, stakeholders, risk and current operating model.</p><p><b>60:</b> align target architecture, governance and prioritized delivery plan.</p><p><b>90:</b> deliver visible improvements with measurable executive KPIs.</p></section></main></body></html>`;document.getElementById('preview').innerHTML=`<h2>${ECP2.esc(company)} · ${ECP2.esc(role)}</h2>${matches.map(x=>`<div class="result"><b>${ECP2.esc(x.title)}</b><br><span class="muted">${ECP2.esc(x.summary)}</span></div>`).join('')}`;return html}document.getElementById('gen').onclick=build;document.getElementById('download').onclick=()=>{if(!html)build();ECP2.download(`Mahmoud-Salama-${(document.getElementById('company').value||'application').replace(/[^a-z0-9]+/gi,'-')}.html`,html,'text/html')}});
</script></body></html>
