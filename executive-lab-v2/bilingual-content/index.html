<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Bilingual Thought Leadership Studio | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">English + Arabic authority</span><h1>Bilingual Thought Leadership Studio</h1><p class="lead">Structure one evidence-backed idea into separate English and Arabic narratives without reducing the Arabic version to a literal translation.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Core insight</label><textarea id="insight" placeholder="Example: Digital transformation fails when adoption is treated as a post-launch activity."></textarea></div><div class="field"><label>Evidence / example</label><textarea id="proof" placeholder="Add an evidence-backed project example..."></textarea></div></div><div class="actions"><button class="btn primary" id="gen">Build bilingual framework</button></div></div></section><section class="section"><div class="shell"><div id="out" class="grid two"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');gen.onclick=()=>{const i=insight.value||'State one defensible executive insight.',p=proof.value||'Connect it to a verified project or metric.';out.innerHTML=`<article class="card"><span class="kicker">English thought-leadership structure</span><h2>${ECP2.esc(i)}</h2><p><b>Why it matters:</b> explain the executive consequence.</p><p><b>Evidence:</b> ${ECP2.esc(p)}</p><p><b>Framework:</b> Context → Decision → Governance → Outcome → Lesson.</p><p><b>CTA:</b> Invite peers to compare approaches, not to “engage with the post.”</p></article><article class="card" dir="rtl"><span class="kicker">هيكل المحتوى العربي</span><h2>الفكرة الرئيسية</h2><p>${ECP2.esc(i)}</p><p><b>الدليل:</b> ${ECP2.esc(p)}</p><p><b>الهيكل:</b> السياق ← القرار ← الحوكمة ← النتيجة ← الدرس المستفاد.</p><p class="muted">هذه أداة هيكلة وليست ترجمة آلية؛ اكتب النسخة العربية بصياغة مناسبة للجمهور العربي.</p></article>`};</script></body></html>
