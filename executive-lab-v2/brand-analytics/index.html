<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Personal Brand Analytics | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Trace where recruiter attention comes from</span><h1>Personal Brand Analytics</h1><p class="lead">Generate consistent UTM links for LinkedIn, CVs, email and outreach, then compare which channels actually send people to your evidence assets.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Destination URL</label><input id="url" value="https://mahmoud-salama.vercel.app/recruiter/"></div><div class="field"><label>Source</label><input id="source" value="linkedin"></div><div class="field"><label>Medium</label><input id="medium" value="profile"></div><div class="field"><label>Campaign</label><input id="campaign" value="executive-brand"></div></div><div class="actions"><button class="btn primary" id="build">Build tracked link</button><button class="btn" id="log">Log visit/conversion manually</button></div></div></section><section class="section"><div class="shell"><div id="out" class="panel"></div><div id="stats" class="section"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');function link(){const u=new URL(url.value);u.searchParams.set('utm_source',source.value);u.searchParams.set('utm_medium',medium.value);u.searchParams.set('utm_campaign',campaign.value);out.innerHTML=`<p class="mono">${ECP2.esc(u.toString())}</p>`;return u.toString()}build.onclick=link;log.onclick=()=>{const rows=ECP2.store('brand-events',[]);rows.push({source:source.value,medium:medium.value,campaign:campaign.value,date:new Date().toISOString()});ECP2.save('brand-events',rows);draw()};function draw(){const rows=ECP2.store('brand-events',[]);const g={};rows.forEach(r=>g[r.source]=(g[r.source]||0)+1);stats.innerHTML=`<div class="grid">${Object.entries(g).map(([k,v])=>`<div class="card"><span class="kicker">Source</span><h3>${ECP2.esc(k)}</h3><div class="metric">${v}</div><p>manual logged events</p></div>`).join('')||'<div class="callout">Use UTM links with your analytics platform; this page also supports a simple manual event log.</div>'}</div>`}link();draw();</script></body></html>
