<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="theme-color" content="#071827"><title>Executive Decision Memo Library | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">How I think, not just what I did</span><h1>Executive Decision Memo Library</h1><p class="lead">A compact library of technology-leadership decision positions that demonstrates architecture, governance and executive judgment.</p></div></section><section class="section"><div class="shell"><div id="memos" class="grid two"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');fetch('../data/decision-memos.json').then(r=>r.json()).then(rows=>{document.getElementById('memos').innerHTML=rows.map((m,i)=>`<article class="card"><span class="kicker">Decision memo ${i+1}</span><h2>${ECP2.esc(m.title)}</h2><p><b>Position:</b> ${ECP2.esc(m.decision)}</p><h3>Questions I would force into the decision</h3><ul>${m.questions.map(q=>`<li>${ECP2.esc(q)}</li>`).join('')}</ul><p class="muted"><b>Evidence basis:</b> ${ECP2.esc(m.evidence)}</p></article>`).join('')});</script></body></html>
