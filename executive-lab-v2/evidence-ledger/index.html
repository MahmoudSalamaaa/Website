<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Evidence Provenance Ledger | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Trace every important claim</span><h1>Evidence Provenance Ledger</h1><p class="lead">A recruiter- and AI-friendly ledger that traces narrative claims and metrics back to a project and source location.</p></div></section><section class="section"><div class="shell"><div class="toolbar"><input id="q" placeholder="Filter claims or capabilities" style="padding:10px;border:1px solid #cbd9e3;border-radius:9px;min-width:280px"><button class="btn small" id="export">Export JSON</button></div><div id="table"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');fetch('../data/evidence.json').then(r=>r.json()).then(rows=>{const ledger=rows.flatMap(e=>[{claim:e.summary,type:'Narrative claim',project:e.title,source:e.source,confidence:'Verified evidence bank'},...e.metrics.map(m=>({claim:m,type:'Metric',project:e.title,source:e.source,confidence:'Verified evidence bank'}))]);function draw(){const f=q.value.toLowerCase();const x=ledger.filter(r=>Object.values(r).join(' ').toLowerCase().includes(f));table.innerHTML=`<table><thead><tr><th>Claim</th><th>Type</th><th>Project</th><th>Source</th><th>Confidence</th></tr></thead><tbody>${x.map(r=>`<tr><td>${ECP2.esc(r.claim)}</td><td>${r.type}</td><td>${ECP2.esc(r.project)}</td><td class="mono tiny">${ECP2.esc(r.source)}</td><td><span class="badge good">${r.confidence}</span></td></tr>`).join('')}</tbody></table>`}q.oninput=draw;export.onclick=()=>ECP2.download('mahmoud-evidence-ledger.json',JSON.stringify(ledger,null,2),'application/json');draw()});</script></body></html>
