<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Career Funnel Analytics | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Measure what actually converts</span><h1>Career Funnel Analytics</h1><p class="lead">Track the application funnel and compare sources, roles, markets and CV variants instead of optimizing for application volume.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Role family</label><input id="role"></div><div class="field"><label>Country</label><input id="country"></div><div class="field"><label>Source</label><select id="source"><option>LinkedIn</option><option>Official portal</option><option>Email outreach</option><option>Referral</option><option>Recruiter</option></select></div><div class="field"><label>CV</label><input id="cv" placeholder="CTO / EA / DT / BA..."></div><div class="field"><label>Stage</label><select id="stage"><option>Applied</option><option>Recruiter response</option><option>Screening</option><option>Interview</option><option>Final</option><option>Offer</option></select></div></div><div class="actions"><button class="btn primary" id="add">Add funnel event</button><button class="btn" id="export">Export data</button></div></div></section><section class="section"><div class="shell"><div id="dash"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');let rows=ECP2.store('funnel',[]);const ord=['Applied','Recruiter response','Screening','Interview','Final','Offer'];function draw(){const c=Object.fromEntries(ord.map(s=>[s,rows.filter(r=>r.stage===s).length]));const applied=c.Applied||1;dash.innerHTML=`<div class="grid four">${ord.map(s=>`<article class="card"><span class="kicker">${s}</span><div class="metric">${c[s]}</div><p>${s==='Applied'?'baseline':Math.round(c[s]/applied*100)+'% of applications'}</p></article>`).join('')}</div><div class="card"><h3>Where results come from</h3><table><thead><tr><th>Source</th><th>Events</th><th>Interview+</th></tr></thead><tbody>${[...new Set(rows.map(r=>r.source))].map(s=>{const x=rows.filter(r=>r.source===s);const hi=x.filter(r=>['Interview','Final','Offer'].includes(r.stage)).length;return `<tr><td>${ECP2.esc(s)}</td><td>${x.length}</td><td>${hi}</td></tr>`}).join('')}</tbody></table></div>`}add.onclick=()=>{rows.push({role:role.value,country:country.value,source:source.value,cv:cv.value,stage:stage.value,date:new Date().toISOString()});ECP2.save('funnel',rows);draw()};export.onclick=()=>ECP2.download('career-funnel.json',JSON.stringify(rows,null,2),'application/json');draw();</script></body></html>
