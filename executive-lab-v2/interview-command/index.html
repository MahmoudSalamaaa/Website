<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Interview Command Center | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Role-specific preparation workspace</span><h1>Interview Command Center</h1><p class="lead">Turn a JD into a compact interview pack: evidence to lead with, stories to rehearse, likely probes, executive questions and closing positioning.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Company</label><input id="company"></div><div class="field"><label>Role</label><input id="role"></div><div class="field" style="grid-column:1/-1"><label>Job description</label><textarea id="jd"></textarea></div></div><div class="actions"><button class="btn primary" id="gen">Build interview pack</button><button class="btn" onclick="window.print()">Print / PDF</button></div></div></section><section class="section"><div class="shell"><div id="pack"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');Promise.all([fetch('../data/evidence.json').then(r=>r.json()),fetch('../data/stories.json').then(r=>r.json())]).then(([ev,stories])=>{gen.onclick=()=>{const txt=jd.value;const m=ECP2.matchEvidence(txt,ev).slice(0,4);const storyScores=stories.map(s=>({...s,score:s.tags.filter(t=>txt.toLowerCase().includes(t)).length})).sort((a,b)=>b.score-a.score).slice(0,4);const objections=['Why this role now?','What exactly did you own versus influence?','How do you measure transformation value?','How do you govern vendors and cross-functional dependencies?','What would you do in the first 90 days?'];pack.innerHTML=`<div class="card"><span class="kicker">Interview brief</span><h2>${ECP2.esc(company.value||'Target Company')} · ${ECP2.esc(role.value||'Target Role')}</h2><p><b>Closing positioning:</b> Technology and digital transformation executive combining architecture, public-sector scale, GCC delivery, data and enterprise integration.</p></div><div class="grid two"><article class="card"><h3>Evidence to lead with</h3>${m.map(x=>`<p><b>${ECP2.esc(x.title)}</b><br><span class="muted">${ECP2.esc(x.metrics.join(' · '))}</span></p>`).join('')}</article><article class="card"><h3>Stories to rehearse</h3>${storyScores.map(s=>`<p><b>${ECP2.esc(s.title)}</b><br><span class="muted">${ECP2.esc(s.result)}</span></p>`).join('')}</article></div><div class="grid two"><article class="card"><h3>Likely objections / probes</h3><ol>${objections.map(x=>`<li>${x}</li>`).join('')}</ol></article><article class="card"><h3>Questions to ask them</h3><ol><li>Which technology outcomes must materially change in the first 12 months?</li><li>Where is decision ownership currently unclear?</li><li>Which platforms or capabilities create the most operational risk?</li><li>How will success be measured by the executive team?</li></ol></article></div>`}});</script></body></html>
