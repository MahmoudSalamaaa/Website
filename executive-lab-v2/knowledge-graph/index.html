<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="theme-color" content="#071827"><title>Mahmoud Knowledge Graph | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Person → capability → project → evidence</span><h1>Mahmoud Knowledge Graph</h1><p class="lead">A machine-readable and human-readable map connecting executive positioning to projects, capabilities, metrics and source pages.</p></div></section><section class="section"><div class="shell"><div id="graph" class="panel"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');fetch('../data/evidence.json').then(r=>r.json()).then(ev=>{const caps=[...new Set(ev.flatMap(e=>e.capabilities))];graph.innerHTML=`<div class="graph"><span class="node primary">Mahmoud Salama</span>${['Technology Strategy','Digital Transformation','Enterprise Architecture','Data Platforms','GCC / Oman','Public Sector'].map(x=>`<span class="node">${x}</span>`).join('')}</div><h2 style="margin-top:24px">Evidence graph</h2>${ev.map(e=>`<div class="card" style="margin:8px 0"><b>${ECP2.esc(e.title)}</b><div class="chips">${e.capabilities.slice(0,8).map(c=>`<span class="chip">${ECP2.esc(c)}</span>`).join('')}</div><p class="tiny mono">source ${ECP2.esc(e.source)}</p></div>`).join('')}<script type="application/ld+json">${JSON.stringify({"@context":"https://schema.org","@type":"Person","name":"Mahmoud Salama","jobTitle":"Technology & Digital Transformation Executive | Enterprise Architect","url":"https://mahmoud-salama.vercel.app/"})}<\/script>`});</script></body></html>
