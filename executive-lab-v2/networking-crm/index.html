<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Networking CRM | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Local-first relationship intelligence</span><h1>Networking CRM</h1><p class="lead">Track professional relationships, company links, strength, last contact and next action. Data stays in this browser unless you export it.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Company</label><input id="company"></div><div class="field"><label>Relationship</label><select id="rel"><option>Cold</option><option>Warm</option><option>Former colleague</option><option>Decision maker</option><option>Recruiter</option></select></div><div class="field"><label>Strength (1-5)</label><input id="strength" type="number" min="1" max="5" value="3"></div><div class="field"><label>Last contact</label><input id="last" type="date"></div><div class="field"><label>Next action</label><input id="next"></div></div><div class="actions"><button class="btn primary" id="add">Add contact</button><button class="btn" id="export">Export JSON</button></div></div></section><section class="section"><div class="shell"><div id="list"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');let rows=ECP2.store('contacts',[]);function draw(){list.innerHTML=`<table><thead><tr><th>Name</th><th>Company</th><th>Relationship</th><th>Strength</th><th>Last</th><th>Next</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${ECP2.esc(r.name)}</td><td>${ECP2.esc(r.company)}</td><td>${ECP2.esc(r.rel)}</td><td>${r.strength}/5</td><td>${r.last||'—'}</td><td>${ECP2.esc(r.next||'')}</td><td><button class="btn small" data-i="${i}">Delete</button></td></tr>`).join('')}</tbody></table>`;list.querySelectorAll('button').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.i,1);ECP2.save('contacts',rows);draw()})}add.onclick=()=>{if(!name.value.trim())return;rows.push({name:name.value,company:company.value,rel:rel.value,strength:+strength.value,last:last.value,next:next.value});ECP2.save('contacts',rows);name.value='';draw()};export.onclick=()=>ECP2.download('networking-crm.json',JSON.stringify(rows,null,2),'application/json');draw();</script></body></html>
