<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Offer Decision Engine | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">MCDA for competing offers</span><h1>Offer Decision Engine</h1><p class="lead">Compare offers using explicit weights across compensation, mandate, trajectory, stability, benefits and family/location fit.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Offer name</label><input id="name" placeholder="Company · Role"></div><div class="field"><label>Total compensation · weight 25%</label><input class="crit" data-w="25" data-name="Total compensation" type="number" min="0" max="100" value="70"></div><div class="field"><label>Role scope / title · weight 15%</label><input class="crit" data-w="15" data-name="Role scope / title" type="number" min="0" max="100" value="70"></div><div class="field"><label>Career trajectory · weight 15%</label><input class="crit" data-w="15" data-name="Career trajectory" type="number" min="0" max="100" value="70"></div><div class="field"><label>Company stability / brand · weight 10%</label><input class="crit" data-w="10" data-name="Company stability / brand" type="number" min="0" max="100" value="70"></div><div class="field"><label>Location / family fit · weight 10%</label><input class="crit" data-w="10" data-name="Location / family fit" type="number" min="0" max="100" value="70"></div><div class="field"><label>Benefits / housing / schooling · weight 10%</label><input class="crit" data-w="10" data-name="Benefits / housing / schooling" type="number" min="0" max="100" value="70"></div><div class="field"><label>Technology mandate · weight 10%</label><input class="crit" data-w="10" data-name="Technology mandate" type="number" min="0" max="100" value="70"></div><div class="field"><label>Work-life sustainability · weight 5%</label><input class="crit" data-w="5" data-name="Work-life sustainability" type="number" min="0" max="100" value="70"></div></div><div class="actions"><button class="btn primary" id="add">Score offer</button></div></div></section><section class="section"><div class="shell"><div id="out"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');let offers=[];add.onclick=()=>{let score=0;document.querySelectorAll('.crit').forEach(x=>score+=+x.value*(+x.dataset.w/100));offers.push({name:name.value||'Offer',score:Math.round(score)});out.innerHTML=`<div class="grid two">${offers.sort((a,b)=>b.score-a.score).map(o=>`<article class="card"><h3>${ECP2.esc(o.name)}</h3><div class="metric">${o.score}/100</div></article>`).join('')}</div>`};</script></body></html>
