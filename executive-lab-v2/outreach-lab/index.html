<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Outreach Experiment Lab | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">A/B test your networking messages</span><h1>Outreach Experiment Lab</h1><p class="lead">Track message variant, channel and outcome to learn which positioning produces replies, referrals and interviews.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Experiment name</label><input id="exp"></div><div class="field"><label>Variant</label><select id="variant"><option>Short executive</option><option>Evidence-first</option><option>Referral request</option><option>GCC/Oman angle</option><option>Public-sector angle</option></select></div><div class="field"><label>Channel</label><select id="channel"><option>LinkedIn</option><option>Email</option><option>WhatsApp</option></select></div><div class="field"><label>Outcome</label><select id="outcome"><option>Sent</option><option>Viewed</option><option>Replied</option><option>Referral</option><option>Interview</option></select></div></div><div class="actions"><button class="btn primary" id="add">Log result</button></div></div></section><section class="section"><div class="shell"><div id="stats"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');let rows=ECP2.store('outreach',[]);function draw(){const by={};rows.forEach(r=>{by[r.variant]??={sent:0,replied:0,interview:0};by[r.variant].sent++;if(['Replied','Referral','Interview'].includes(r.outcome))by[r.variant].replied++;if(r.outcome==='Interview')by[r.variant].interview++});stats.innerHTML=`<div class="grid">${Object.entries(by).map(([k,v])=>`<article class="card"><span class="kicker">${ECP2.esc(k)}</span><div class="metric">${v.sent?Math.round(v.replied/v.sent*100):0}%</div><p>response conversion · ${v.interview} interview(s) from ${v.sent} logged contacts</p></article>`).join('')||'<div class="callout">Log outreach results to compare message variants.</div>'}</div>`}add.onclick=()=>{rows.push({exp:exp.value,variant:variant.value,channel:channel.value,outcome:outcome.value,date:new Date().toISOString()});ECP2.save('outreach',rows);draw()};draw();</script></body></html>
