<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="theme-color" content="#071827"><title>Synthetic Inventory Forecast Demo | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Public portfolio demo</span><h1>Synthetic Inventory Forecast Demo</h1><p class="lead">A simple demand, safety-stock and reorder-point demonstration for portfolio purposes—not a production forecasting model.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Average daily demand</label><input id="demand" type="number" value="320"></div><div class="field"><label>Lead time days</label><input id="lead" type="number" value="14"></div><div class="field"><label>Safety-stock days</label><input id="safety" type="number" value="7"></div><div class="field"><label>Current stock</label><input id="stock" type="number" value="7200"></div></div><div class="actions"><button class="btn primary" id="calc">Calculate</button></div></div></section><section class="section"><div class="shell"><div id="out" class="grid three"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');calc.onclick=()=>{const d=+demand.value,l=+lead.value,s=+safety.value,st=+stock.value;const reorder=d*(l+s);const days=st/d;const qty=Math.max(0,reorder-st);out.innerHTML=`<div class="card"><span class="kicker">Reorder point</span><div class="metric">${ECP2.money(reorder)}</div></div><div class="card"><span class="kicker">Days on hand</span><div class="metric">${days.toFixed(1)}</div></div><div class="card"><span class="kicker">Suggested order now</span><div class="metric">${ECP2.money(qty)}</div></div>`};calc.click();</script></body></html>
