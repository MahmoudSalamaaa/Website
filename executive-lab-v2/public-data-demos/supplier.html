<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="theme-color" content="#071827"><title>Synthetic Supplier Performance Scorecard | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Public portfolio demo</span><h1>Synthetic Supplier Performance Scorecard</h1><p class="lead">A transparent weighted supplier-performance model using synthetic inputs.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>OTIF %</label><input id="otif" type="number" value="92"></div><div class="field"><label>Quality acceptance %</label><input id="quality" type="number" value="97"></div><div class="field"><label>Issue closure %</label><input id="issues" type="number" value="88"></div><div class="field"><label>Commercial score %</label><input id="commercial" type="number" value="82"></div></div><div class="actions"><button class="btn primary" id="score">Calculate supplier score</button></div></div></section><section class="section"><div class="shell"><div id="out" class="panel"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');score.onclick=()=>{const s=Math.round(+otif.value*.4 + +quality.value*.3 + +issues.value*.2 + +commercial.value*.1);out.innerHTML=`<div class="metric">${s}/100</div><p>Weighted: OTIF 40% · quality 30% · issue closure 20% · commercial 10%.</p><span class="badge ${s>=90?'good':s>=75?'warn':'bad'}">${s>=90?'Strategic performer':s>=75?'Manage actively':'Recovery plan required'}</span>`};score.click();</script></body></html>
