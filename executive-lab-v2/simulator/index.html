<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="theme-color" content="#071827"><title>What Would Mahmoud Do? | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Executive response simulator</span><h1>What Would Mahmoud Do?</h1><p class="lead">Choose a realistic technology-leadership problem and see the first-48-hours, first-30-days and KPI response pattern.</p></div></section><section class="section"><div class="shell"><div class="field"><label>Choose a leadership challenge</label><select id="sel"></select></div><div class="actions"><button class="btn primary" id="run">Show response</button></div></div></section><section class="section"><div class="shell"><div id="out"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');fetch('../data/challenges.json').then(r=>r.json()).then(rows=>{sel.innerHTML=rows.map((x,i)=>`<option value="${i}">${ECP2.esc(x.title)}</option>`).join('');function render(){const x=rows[+sel.value];out.innerHTML=`<div class="grid two"><article class="card"><span class="kicker">First 48 hours</span><ol>${x.first48.map(i=>`<li>${ECP2.esc(i)}</li>`).join('')}</ol></article><article class="card"><span class="kicker">First 30 days</span><ol>${x.d30.map(i=>`<li>${ECP2.esc(i)}</li>`).join('')}</ol></article></div><div class="card"><span class="kicker">Executive KPIs</span><div class="chips">${x.kpis.map(k=>`<span class="chip">${ECP2.esc(k)}</span>`).join('')}</div></div>`}run.onclick=render;render()});</script></body></html>
