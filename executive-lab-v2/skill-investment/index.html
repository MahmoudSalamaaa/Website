<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Career Skill Investment Engine | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Job demand → learning priorities</span><h1>Career Skill Investment Engine</h1><p class="lead">Paste a batch of target JDs, count recurring skill demand and compare it with the current evidence bank before deciding what to learn next.</p></div></section><section class="section"><div class="shell"><div class="field"><label>Paste multiple target JDs</label><textarea id="jds" placeholder="Paste several job descriptions separated by blank lines..."></textarea></div><div class="actions"><button class="btn primary" id="run">Rank skill investment</button></div></div></section><section class="section"><div class="shell"><div id="out"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');fetch('../data/evidence.json').then(r=>r.json()).then(ev=>{run.onclick=()=>{const txt=jds.value.toLowerCase();const skills=['aws','azure','cloud','cybersecurity','itil','togaf','pmp','prince2','devops','ci/cd','kubernetes','enterprise architecture','digital transformation','data governance','power bi','postgresql','dynamics 365','ai governance','business analysis','change management','vendor management'];const have=new Set(ev.flatMap(e=>e.capabilities.map(x=>x.toLowerCase())));const rows=skills.map(s=>({s,count:(txt.match(new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length,evidence:[...have].some(h=>h.includes(s)||s.includes(h))})).filter(x=>x.count).sort((a,b)=>b.count-a.count);out.innerHTML=`<table><thead><tr><th>Skill</th><th>Demand mentions</th><th>Evidence today</th><th>Investment recommendation</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${ECP2.esc(r.s)}</b></td><td>${r.count}</td><td><span class="badge ${r.evidence?'good':'warn'}">${r.evidence?'Evidence found':'Gap / verify'}</span></td><td>${r.evidence?'Deepen proof and content before adding another certification.':'High-value learning candidate if it appears repeatedly in target roles.'}</td></tr>`).join('')}</tbody></table>`}});</script></body></html>
