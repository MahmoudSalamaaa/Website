<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="theme-color" content="#071827"><title>Public Speaking Studio | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Turn experience into a speaking proposition</span><h1>Public Speaking Studio</h1><p class="lead">Generate a concise talk abstract, audience promise and takeaway structure from your strongest executive themes.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Topic</label><select id="topic"><option>Architecting national digital platforms</option><option>Digital transformation beyond software</option><option>Data governance in public-sector ecosystems</option><option>Technology leadership across Egypt and Oman</option><option>Enterprise integration without chaos</option><option>Responsible AI governance for public organizations</option></select></div><div class="field"><label>Audience</label><input id="aud" value="Technology and digital-transformation leaders"></div></div><div class="actions"><button class="btn primary" id="gen">Generate speaker brief</button></div></div></section><section class="section"><div class="shell"><div id="out" class="panel"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');gen.onclick=()=>{const t=topic.value,a=aud.value;out.innerHTML=`<span class="kicker">Talk abstract</span><h2>${ECP2.esc(t)}</h2><p>This session is designed for ${ECP2.esc(a)} and focuses on practical decision patterns from large-scale public-sector and enterprise technology delivery. It moves from operating context to governance, architecture, adoption and measurable outcomes.</p><h3>Three takeaways</h3><ol><li>How to connect architecture decisions to executive outcomes.</li><li>How to govern delivery across multiple stakeholders, vendors and platforms.</li><li>How to make adoption, data and operational readiness part of transformation design.</li></ol><p><b>Speaker:</b> Mahmoud Salama · Technology & Digital Transformation Executive | Enterprise Architect</p>`};gen.click();</script></body></html>
