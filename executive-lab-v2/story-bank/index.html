<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Executive Story Bank | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Interview evidence, structured</span><h1>Executive Story Bank</h1><p class="lead">A reusable bank of leadership stories with situation, action, result and explicit evidence linkage.</p></div></section><section class="section"><div class="shell"><div class="toolbar"><input id="q" placeholder="Filter: leadership, Oman, data..." style="padding:10px;border:1px solid #cbd9e3;border-radius:9px"><button class="btn" onclick="window.print()">Print stories</button></div><div id="stories" class="grid two"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');fetch('../data/stories.json').then(r=>r.json()).then(rows=>{function draw(){const f=q.value.toLowerCase();const x=rows.filter(s=>JSON.stringify(s).toLowerCase().includes(f));stories.innerHTML=x.map(s=>`<article class="card"><span class="kicker">${s.tags.map(ECP2.esc).join(' · ')}</span><h2>${ECP2.esc(s.title)}</h2><p><b>Situation</b><br>${ECP2.esc(s.situation)}</p><p><b>Action</b><br>${ECP2.esc(s.action)}</p><p><b>Result</b><br>${ECP2.esc(s.result)}</p><div class="chip">Evidence: ${ECP2.esc(s.evidence)}</div></article>`).join('')}q.oninput=draw;draw()});</script></body></html>
