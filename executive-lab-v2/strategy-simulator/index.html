<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Career Strategy Simulator | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Compare markets and role families</span><h1>Career Strategy Simulator</h1><p class="lead">Use a transparent weighted model to compare career strategies such as CTO vs Enterprise Architect, Oman vs UAE, or government vs private sector.</p></div></section><section class="section"><div class="shell"><div class="form-grid"><div class="field"><label>Strategy name</label><input id="name" placeholder="Oman Enterprise Architect"></div><div class="field"><label>Role fit (0-100)</label><input id="fit" type="number" value="85"></div><div class="field"><label>Response evidence (0-100)</label><input id="resp" type="number" value="60"></div><div class="field"><label>Compensation potential (0-100)</label><input id="comp" type="number" value="75"></div><div class="field"><label>Relocation / lifestyle fit (0-100)</label><input id="rel" type="number" value="80"></div><div class="field"><label>Competition advantage (0-100)</label><input id="adv" type="number" value="70"></div></div><div class="actions"><button class="btn primary" id="add">Add strategy</button></div></div></section><section class="section"><div class="shell"><div id="out"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');let rows=[];function draw(){out.innerHTML=`<div class="grid two">${rows.sort((a,b)=>b.score-a.score).map(r=>`<article class="card"><span class="kicker">Weighted career strategy</span><h3>${ECP2.esc(r.name)}</h3><div class="metric">${r.score}/100</div><p>Fit 30% · response evidence 25% · compensation 15% · mobility 15% · advantage 15%</p></article>`).join('')}</div>`}add.onclick=()=>{const score=Math.round(+fit.value*.30 + +resp.value*.25 + +comp.value*.15 + +rel.value*.15 + +adv.value*.15);rows.push({name:name.value||'Strategy',score});draw()};</script></body></html>
