<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Warm Introduction Mapper | Mahmoud Salama</title><link rel="stylesheet" href="../assets/v2.css"><script src="../assets/v2.js"></script></head><body><div id="nav"></div><main><section class="hero"><div class="shell"><span class="eyebrow">Prioritize relationship paths</span><h1>Warm Introduction Mapper</h1><p class="lead">Use the local Networking CRM to rank the warmest routes into a target company instead of defaulting to cold applications.</p></div></section><section class="section"><div class="shell"><div class="field"><label>Target company</label><input id="target" placeholder="e.g. Qatar Airways"></div><div class="actions"><button class="btn primary" id="map">Find warmest paths</button></div></div></section><section class="section"><div class="shell"><div id="out"></div></div></section></main><div id="foot"></div><script>document.getElementById('nav').innerHTML=ECP2.nav('..');document.getElementById('foot').innerHTML=ECP2.footer('..');map.onclick=()=>{const rows=ECP2.store('contacts',[]);const t=target.value.toLowerCase();const scored=rows.map(r=>({...r,score:(r.company.toLowerCase().includes(t)?5:0)+r.strength+({"Decision maker":5,"Former colleague":4,"Warm":3,"Recruiter":3,"Cold":0}[r.rel]||1)})).sort((a,b)=>b.score-a.score);out.innerHTML=scored.length?`<div class="grid two">${scored.slice(0,8).map(r=>`<article class="card"><span class="kicker">Path score ${r.score}</span><h3>${ECP2.esc(r.name)}</h3><p>${ECP2.esc(r.company)} · ${ECP2.esc(r.rel)} · strength ${r.strength}/5</p><p><b>Suggested action:</b> ${r.company.toLowerCase().includes(t)?'Ask for role/team context or a direct introduction.':'Ask whether they know someone inside the target company or sector.'}</p></article>`).join('')}</div>`:`<div class="callout">No contacts yet. Add them in Networking CRM first.</div>`};</script></body></html>
