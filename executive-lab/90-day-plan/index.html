<!doctype html><html lang="en" data-base=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private 30/60/90-day executive plan generator for targeted technology roles."><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>90-Day Executive Plan Generator | Mahmoud Salama</title><link rel="stylesheet" href="../assets/lab.css"></head><body>
<section class="hero"><div class="shell"><span class="eyebrow">Interview Asset Generator</span><h1>30 / 60 / 90-Day Executive Plan</h1><p class="lead">Generate a disciplined first-90-days structure for interview discussion. Customize it to the company and validate assumptions before sharing.</p></div></section><section class="section"><div class="shell split"><div class="panel"><div class="field"><label>Target role</label><select id="role"><option>CTO / CIO / IT Director</option><option>Digital Transformation Director</option><option>Enterprise / Solution Architect</option><option>Software / Application Development Manager</option><option>Lead / Senior Business Analyst</option></select></div><div class="field"><label>Company / organization</label><input id="company" placeholder="Organization name"></div><div class="field"><label>Known priorities / challenges</label><textarea id="ch" placeholder="Paste 3–8 priorities from the JD or interview..."></textarea></div><div class="actions"><button class="btn primary" id="g">Generate</button></div></div><aside class="panel" id="o"><p class="muted">Your plan will appear here.</p></aside></div></section><script type="module">import{nav,footer,esc}from'../assets/lab.js';document.body.insertAdjacentHTML('afterbegin',nav('..'));document.body.insertAdjacentHTML('beforeend',footer('..'));document.querySelector('#g').onclick=()=>{let r=esc(document.querySelector('#role').value),c=esc(document.querySelector('#company').value||'the organization'),ch=esc(document.querySelector('#ch').value||'the priorities discussed in the role profile');let phases=[['Days 1–30 · Discover & Align',`Confirm mandate, stakeholders, decision rights and current-state evidence at ${c}. Establish baselines for ${ch}. Review architecture, portfolio, service health, data, risks, vendors and delivery dependencies.`],['Days 31–60 · Stabilize & Design',`Agree priority outcomes and governance cadence. Define target-state decisions, measurable benefits, risk treatments, ownership and near-term delivery sequence appropriate to the ${r} mandate.`],['Days 61–90 · Deliver & Institutionalize',`Launch/accelerate the highest-value initiatives, remove priority blockers, establish operational ownership and publish an evidence-based roadmap with KPIs, dependencies and executive decisions required.`]];document.querySelector('#o').innerHTML=`<span class="eyebrow">${r} · ${c}</span><h2>First 90 Days</h2>${phases.map(([h,p])=>`<article class="card"><h3>${h}</h3><p>${p}</p></article>`).join('')}<div class="actions"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><p class="notice">Interview artifact: validate company-specific assumptions before sharing externally.</p>`};</script></body></html>
