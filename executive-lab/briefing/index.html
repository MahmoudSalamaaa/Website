<!doctype html><html lang="en" data-base=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private print-ready executive briefing generator for targeted interviews and networking."><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Executive Briefing Generator | Mahmoud Salama</title><link rel="stylesheet" href="../assets/lab.css"></head><body>
<section class="hero"><div class="shell"><span class="eyebrow">Executive Sales Asset</span><h1>Briefing Generator</h1><p class="lead">Create a compact evidence-led interview brief. Keep it factual and tailor only the framing, never the underlying evidence.</p></div></section><section class="section"><div class="shell split"><div class="panel"><div class="field"><label>Target organization</label><input id="org" placeholder="Organization"></div><div class="field"><label>Target role</label><select id="role"></select></div><div class="field"><label>Priority problem to solve</label><textarea id="prob" placeholder="e.g. modernize fragmented applications while improving governance and delivery reliability"></textarea></div><div class="actions"><button class="btn primary" id="make">Build brief</button></div></div><aside class="panel" id="out"><p class="muted">Your brief will appear here.</p></aside></div></section><script type="module">import{nav,footer,loadData,proofCard,esc}from'../assets/lab.js';document.body.insertAdjacentHTML('afterbegin',nav('..'));document.body.insertAdjacentHTML('beforeend',footer('..'));const{roles,evidence}=await loadData();document.querySelector('#role').innerHTML=Object.entries(roles).filter(([k])=>k!=='oman').map(([k,r])=>`<option value="${k}">${r.title}</option>`).join('');document.querySelector('#make').onclick=()=>{let key=document.querySelector('#role').value,r=roles[key],org=esc(document.querySelector('#org').value||'Target Organization'),prob=esc(document.querySelector('#prob').value||'the priority technology and transformation challenges in the role');let ev=r.evidence.map(id=>evidence.find(x=>x.id===id));document.querySelector('#out').innerHTML=`<span class="eyebrow">Executive Brief · ${org}</span><h2>${esc(r.title)}</h2><p><b>Mandate hypothesis:</b> ${prob}</p><h3>Why Mahmoud</h3><p>18+ years across technology strategy, digital transformation, enterprise architecture, applications, integration, data and governance across Egypt and the GCC.</p><h3>Closest evidence</h3>${ev.map(proofCard).join('')}<h3>First conversation</h3><p>I would start by clarifying outcomes, decision rights, current-state constraints, delivery/operational risks and the evidence needed to prioritize the first 90 days.</p><div class="actions"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div>`};</script></body></html>
