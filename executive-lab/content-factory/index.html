<!doctype html><html lang="en" data-base=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private content planning engine turning executive technology topics into multi-format thought-leadership structures."><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Executive Content Factory | Mahmoud Salama</title><link rel="stylesheet" href="../assets/lab.css"></head><body>
<section class="hero"><div class="shell"><span class="eyebrow">Thought Leadership Engine</span><h1>Executive Content Factory</h1><p class="lead">Turn one evidence-backed topic into a structured article, LinkedIn post, carousel and bilingual micro-post outline. It produces structure, not fabricated expertise.</p></div></section><section class="section"><div class="shell split"><div class="panel"><div class="field"><label>Topic</label><input id="topic" placeholder="e.g. Why digital transformation fails after go-live"></div><div class="field"><label>Evidence anchor</label><select id="e"></select></div><div class="field"><label>Audience</label><select id="aud"><option>CTO / CIO</option><option>Digital Transformation Leaders</option><option>Enterprise Architects</option><option>Public Sector Executives</option><option>Hiring Managers</option></select></div><div class="actions"><button class="btn primary" id="make">Generate package</button></div></div><aside class="panel"><pre class="output" id="out">Choose a topic and evidence anchor.</pre></aside></div></section><script type="module">import{nav,footer,loadData}from'../assets/lab.js';document.body.insertAdjacentHTML('afterbegin',nav('..'));document.body.insertAdjacentHTML('beforeend',footer('..'));const{evidence}=await loadData();document.querySelector('#e').innerHTML=evidence.map((x,i)=>`<option value="${i}">${x.title}</option>`).join('');document.querySelector('#make').onclick=()=>{let t=document.querySelector('#topic').value||'Executive technology leadership',a=document.querySelector('#aud').value,e=evidence[+document.querySelector('#e').value];let s=`ARTICLE\nTitle: ${t}\nAudience: ${a}\n1. The problem executives actually face\n2. Why the obvious technology answer is incomplete\n3. Decision framework: strategy → architecture → delivery → adoption → operations\n4. Evidence anchor: ${e.title} — ${e.summary}\n5. What leaders should measure\n6. Three practical actions\n\nLINKEDIN POST\nHook: A transformation does not fail only because of technology. It fails when ownership, architecture, delivery and adoption separate.\nProof: ${e.metrics.join(' · ')}\nClose: What would you measure 90 days after go-live?\n\nCAROUSEL (7 slides)\n1. ${t}\n2. The common failure pattern\n3. The hidden governance problem\n4. Architecture decision\n5. Delivery & adoption\n6. Evidence: ${e.title}\n7. Executive checklist\n\nBILINGUAL MICRO-POST\nEN: One executive lesson from ${e.title}: institutional capability matters more than project completion.\nAR: درس تنفيذي من التجربة: بناء القدرة المؤسسية أهم من مجرد إنهاء المشروع.`;document.querySelector('#out').textContent=s};</script></body></html>
