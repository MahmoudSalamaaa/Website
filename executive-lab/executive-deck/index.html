<!doctype html><html lang="en" data-base=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private 8-slide executive presentation generator for interview and networking conversations."><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Executive Deck Generator | Mahmoud Salama</title><link rel="stylesheet" href="../assets/lab.css"></head><body>
<style>.deck{display:grid;gap:16px}.slide{min-height:430px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;display:flex;flex-direction:column;justify-content:center}.slide h2{font-size:38px}.slide .num{font-size:11px;font-weight:900;color:var(--cyan);letter-spacing:.14em}@media print{.slide{page-break-after:always;border:0;min-height:90vh}}</style><section class="hero"><div class="shell"><span class="eyebrow">Interview / Networking Asset</span><h1>Executive Deck Generator</h1><p class="lead">Generate an eight-slide evidence-first narrative and print to PDF. The deck is intentionally concise so it can support, not replace, a conversation.</p><div class="form-grid no-print"><div class="field"><label>Target organization</label><input id="org" placeholder="Organization"></div><div class="field"><label>Target role</label><input id="role" value="Technology & Digital Transformation Leadership"></div></div><div class="actions no-print"><button class="btn primary" id="make">Generate deck</button></div></div></section><section class="section"><div class="shell"><div id="deck" class="deck"></div></div></section><script type="module">import{nav,footer,loadData,esc}from'../assets/lab.js';document.body.insertAdjacentHTML('afterbegin',nav('..'));document.body.insertAdjacentHTML('beforeend',footer('..'));const{evidence}=await loadData();function slide(n,t,b){return `<article class="slide"><span class="num">SLIDE ${n}</span><h2>${t}</h2>${b}</article>`}document.querySelector('#make').onclick=()=>{let org=esc(document.querySelector('#org').value||'Target Organization'),role=esc(document.querySelector('#role').value);let med=evidence.find(e=>e.id==='mediq'),dw=evidence.find(e=>e.id==='warehouse'),om=evidence.find(e=>e.id==='oman'),ld=evidence.find(e=>e.id==='leadership');document.querySelector('#deck').innerHTML=slide(1,'Mahmoud Salama',`<p class="lead">${role} · Executive conversation for ${org}</p><div class="chips"><span class="chip">18+ years</span><span class="chip">Egypt & GCC</span><span class="chip">Enterprise Architecture</span><span class="chip">Digital Transformation</span></div>`)+slide(2,'Leadership scale',`<div class="grid two"><div class="card"><div class="metric">EGP 150M+</div><p>technology portfolio</p></div><div class="card"><div class="metric">40+</div><p>professionals</p></div></div>`)+slide(3,med.title,`<p>${esc(med.summary)}</p><div class="chips">${med.metrics.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`)+slide(4,dw.title,`<p>${esc(dw.summary)}</p><div class="chips">${dw.metrics.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`)+slide(5,om.title,`<p>${esc(om.summary)}</p><div class="chips">${om.metrics.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`)+slide(6,'How I lead technology',`<p class="lead">Strategy → Portfolio → Architecture → Delivery → Data → Adoption → Operations → Benefits</p>`)+slide(7,'First 90 days',`<div class="grid"><div class="card"><h3>1–30</h3><p>Discover, baseline, align.</p></div><div class="card"><h3>31–60</h3><p>Prioritize, stabilize, design.</p></div><div class="card"><h3>61–90</h3><p>Deliver, institutionalize, measure.</p></div></div>`)+slide(8,'Conversation',`<p class="lead">What are the three technology decisions that would most change ${org}'s outcomes in the next 12 months?</p><div class="actions"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div>`)};document.querySelector('#make').click();</script></body></html>
