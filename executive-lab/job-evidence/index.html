<!doctype html><html lang="en" data-base=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private job-description analyzer mapping requirements to verified evidence and closest frozen CV."><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Job Description → Evidence Matrix | Mahmoud Salama</title><link rel="stylesheet" href="../assets/lab.css"></head><body>
<section class="hero"><div class="shell"><span class="eyebrow">Private Career Tool</span><h1>JD → Evidence Matrix</h1><p class="lead">Paste a job description. The tool finds direct capability matches in the verified evidence bank and identifies the closest role-specific CV. No text is sent to a server.</p></div></section><section class="section"><div class="shell"><div class="field"><label>Job description</label><textarea id="jd" placeholder="Paste the full job description here..."></textarea></div><div class="actions"><button class="btn primary" id="an">Analyze</button></div><div id="out"></div></div></section><script type="module">import{nav,footer,loadData,evidenceMatch,cvRoute,esc}from'../assets/lab.js';document.body.insertAdjacentHTML('afterbegin',nav('..'));document.body.insertAdjacentHTML('beforeend',footer('..'));const{evidence,roles}=await loadData();document.querySelector('#an').onclick=()=>{let t=document.querySelector('#jd').value,m=evidenceMatch(t,evidence),r=cvRoute(t,roles),cap=[...new Set(m.flatMap(x=>x.hit))];let score=Math.min(100,Math.round((cap.length/12)*100));document.querySelector('#out').innerHTML=`<section class="section"><div class="grid two"><div class="card"><span class="kicker">Evidence coverage</span><div class="metric">${score}%</div><p>${cap.length} directly matched capability phrases found in the JD.</p></div><div class="card"><span class="kicker">Closest CV route</span><h3>${esc(r?.title||'Manual review')}</h3><p>${r?.hits?.length?esc(r.hits.join(', ')):'No strong role-family signal detected.'}</p></div></div><h2 style="margin-top:24px">Evidence matrix</h2><table><thead><tr><th>Evidence</th><th>Matched capabilities</th><th>Proof metrics</th></tr></thead><tbody>${m.map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class="muted">${esc(x.org)}</span></td><td>${x.hit.map(h=>`<span class="chip">${esc(h)}</span>`).join(' ')}</td><td>${x.metrics.map(esc).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="3">No direct evidence matches. Review manually rather than manufacturing fit.</td></tr>'}</tbody></table></section>`};</script></body></html>
