<!doctype html><html lang="en" data-base=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private local career analytics for application outcomes, role conversion and recurring skill demand."><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071827"><title>Career Market Intelligence | Mahmoud Salama</title><link rel="stylesheet" href="../assets/lab.css"></head><body>
<section class="hero"><div class="shell"><span class="eyebrow">Private Career Analytics</span><h1>Career Market Intelligence</h1><p class="lead">A lightweight browser-local dashboard. Add applications and track outcomes without sending data anywhere. Use it to identify which role families, regions and channels convert better.</p></div></section><section class="section"><div class="shell split"><div class="panel"><h2>Add application</h2><div class="form-grid"><div class="field"><label>Role family</label><select id="role"><option>CTO / IT Director</option><option>Digital Transformation</option><option>Enterprise Architect</option><option>Software Development Manager</option><option>Business Analyst</option></select></div><div class="field"><label>Region</label><select id="reg"><option>Egypt</option><option>Oman</option><option>UAE</option><option>KSA</option><option>Qatar</option><option>Kuwait</option><option>Africa</option><option>Remote</option></select></div><div class="field"><label>Source</label><select id="src"><option>Company portal</option><option>LinkedIn</option><option>Email outreach</option><option>Recruiter</option><option>Referral</option></select></div><div class="field"><label>Status</label><select id="status"><option>Applied</option><option>Screening</option><option>Interview</option><option>Final</option><option>Offer</option><option>Rejected</option></select></div></div><div class="actions"><button class="btn primary" id="add">Add</button><button class="btn" id="clear">Clear local data</button></div></div><aside class="panel"><h2>Snapshot</h2><div id="stats"></div></aside></div></section><section class="section"><div class="shell"><h2>Application log</h2><div id="table"></div></div></section><script type="module">import{nav,footer,esc}from'../assets/lab.js';document.body.insertAdjacentHTML('afterbegin',nav('..'));document.body.insertAdjacentHTML('beforeend',footer('..'));const key='msCareerIntelV1';let data=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){let active=data.filter(x=>!['Rejected'].includes(x.status)).length,inter=data.filter(x=>['Interview','Final','Offer'].includes(x.status)).length,offers=data.filter(x=>x.status==='Offer').length;document.querySelector('#stats').innerHTML=`<div class="grid two"><div class="card"><div class="metric">${data.length}</div><p>applications</p></div><div class="card"><div class="metric">${inter}</div><p>interview-stage+</p></div><div class="card"><div class="metric">${offers}</div><p>offers</p></div><div class="card"><div class="metric">${data.length?Math.round(inter/data.length*100):0}%</div><p>interview conversion</p></div></div>`;document.querySelector('#table').innerHTML=`<table><thead><tr><th>Role</th><th>Region</th><th>Source</th><th>Status</th></tr></thead><tbody>${data.slice().reverse().map(x=>`<tr><td>${esc(x.role)}</td><td>${esc(x.reg)}</td><td>${esc(x.src)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`}document.querySelector('#add').onclick=()=>{data.push({role:document.querySelector('#role').value,reg:document.querySelector('#reg').value,src:document.querySelector('#src').value,status:document.querySelector('#status').value,at:new Date().toISOString()});save()};document.querySelector('#clear').onclick=()=>{if(confirm('Clear locally stored application data?')){data=[];save()}};render();</script></body></html>
