<!doctype html><html lang="en" data-base=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive skills-to-evidence graph linking executive capabilities to verified case studies."><meta name="robots" content="index,follow,max-image-preview:large"><meta name="theme-color" content="#071827"><title>Skills Evidence Graph | Mahmoud Salama</title><link rel="stylesheet" href="../assets/lab.css"></head><body>
<section class="hero"><div class="shell"><span class="eyebrow">Skills-first proof</span><h1>Skills Evidence Graph</h1><p class="lead">Instead of self-rated skill bars, select a capability and inspect the projects, scope and metrics that support it.</p></div></section><section class="section"><div class="shell split"><div class="panel"><div id="skillchips" class="chips"></div></div><aside class="panel sticky-card"><h2 id="st">Choose a skill</h2><div id="proofs"></div></aside></div></section><script type="module">import{nav,footer,loadData,proofCard,esc}from'../assets/lab.js';document.body.insertAdjacentHTML('afterbegin',nav('..'));document.body.insertAdjacentHTML('beforeend',footer('..'));const{evidence}=await loadData();let skills=[...new Set(evidence.flatMap(e=>e.capabilities))].sort();document.querySelector('#skillchips').innerHTML=skills.map(s=>`<button class="tab" data-s="${esc(s)}">${esc(s)}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('active',x===b));let s=b.dataset.s;document.querySelector('#st').textContent=s;let hits=evidence.filter(e=>e.capabilities.includes(s));document.querySelector('#proofs').innerHTML=hits.map(proofCard).join('')});document.querySelector('[data-s="enterprise architecture"]')?.click();</script></body></html>
