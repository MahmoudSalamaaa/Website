<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Mahmoud Salama executive mark</title>
<desc id="desc">MS monogram with orbit rings representing technology, architecture and connected systems.</desc>
<defs>
  <linearGradient id="bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
    <stop stop-color="#122A48"/>
    <stop offset=".58" stop-color="#091626"/>
    <stop offset="1" stop-color="#07101D"/>
  </linearGradient>
  <linearGradient id="cyan" x1="20" y1="18" x2="100" y2="108" gradientUnits="userSpaceOnUse">
    <stop stop-color="#75ECFF"/>
