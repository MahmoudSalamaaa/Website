<circle cx="31" cy="47" r="4.6" fill="#19D7FF"/>
<circle cx="95" cy="39" r="4.3" fill="#D8B86A"/>
<circle cx="92" cy="92" r="3.8" fill="#75ECFF"/>
<circle cx="64" cy="64" r="25" fill="#0A1A2E" stroke="#FFFFFF" stroke-opacity=".10"/>
<text x="64" y="72" text-anchor="middle" fill="#F7FCFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing="-1">MS</text>
