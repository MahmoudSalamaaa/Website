    <stop offset="1" stop-color="#C89938"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
