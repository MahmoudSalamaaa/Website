<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EY | Interview Cheat Sheet</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#18263d;font-family:Tahoma,Segoe UI,Arial,sans-serif}header{background:#17253b;color:white;padding:19px 18px}header .wrap{max-width:1080px;margin:auto}h1{font-size:23px;margin:0 0 7px}header p{margin:0;color:#dbe5f3;font-size:13px;line-height:1.7}main{max-width:1080px;margin:auto;padding:14px}.intro{font-size:13px;color:#52647a;margin:4px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid #dbe2ec;border-right:4px solid #e8be27;border-radius:12px;padding:16px;box-shadow:0 2px 9px #17253b08}.num{color:#64748b;font-size:12px;font-weight:bold}.question{direction:ltr;text-align:left;font-size:17px;line-height:1.45;margin:8px 0 12px;color:#15243b}.answer{font-size:15px;line-height:1.95;margin:0;color:#233247}.keywords{direction:ltr;text-align:left;font-size:11px;color:#6a788b;margin-top:12px;border-top:1px solid #eef1f6;padding-top:9px}.english{display:none;direction:ltr;text-align:left;font-size:14px;line-height:1.75;background:#f7f9fc;border-radius:8px;padding:12px;margin-top:12px}.english.show{display:block}.toggle{border:1px solid #cdd7e5;border-radius:7px;background:#fff;color:#243d61;font-size:12px;padding:7px 11px;margin-top:12px;cursor:pointer}.toggle:focus-visible{outline:3px solid #d7ae18}@media(max-width:730px){.grid{grid-template-columns:1fr}.card{padding:14px}.answer{font-size:15px}h1{font-size:20px}}@media print{header{background:#fff;color:#000;border-bottom:2px solid #333}header p{color:#333}.card{break-inside:avoid;box-shadow:none}.toggle,.english{display:none!important}body{background:#fff}}</style></head><body><header><div class="wrap"><h1>EY — ورقة غش المقابلة</h1><p>أهم 12 سؤالًا · إجابات عربية مباشرة مختصرة · السؤال بالإنجليزية · الإجابة الإنجليزية اختيارية</p></div></header><main><p class="intro">اقرأ السؤال ثم الإجابة العربية مباشرة. اضغط «English» فقط إذا أردت مراجعة صياغة النطق.</p><div class="grid" id="grid"></div></main><script>const data=[["Tell me about yourself","18 years · Leadership · MedIQ","I have over 18 years of experience in IT leadership, enterprise systems, and digital transformation. At Egypt’s Unified Procurement Authority, I lead a team of more than 54 people, with nine direct reports, and oversee an annual IT budget of around EGP 150 million. I have led major healthcare technology initiatives, including MedIQ. My strength is connecting business goals with architecture, governance, and delivery. I want to bring that practical experience to EY’s clients.","أنا قائد تكنولوجيا وتحول رقمي بخبرة أكثر من 18 سنة في الحكومة والرعاية الصحية والخليج. حاليًا أقود إدارة نظم المعلومات والتحول الرقمي في هيئة الشراء الموحد، بفريق يتجاوز 54 متخصصًا و9 مديرين مباشرين، وميزانية تقنية نحو 150 مليون جنيه سنويًا. قدت مبادرات كبيرة مثل MedIQ، وأتميز بربط احتياجات الأعمال بالمعمارية والتنفيذ والحوكمة."],["What is Enterprise Architecture?","Business · Four domains · Value","Enterprise Architecture connects business strategy with technology decisions. I assess business capabilities, data, applications, and technology, then define a target state and a practical roadmap. The objective is not to produce diagrams; it is to reduce complexity, manage risk, and deliver measurable business value.","معمارية المؤسسة هي ربط استراتيجية الجهة بأنظمتها وبياناتها وتقنياتها. أدرس أربعة جوانب: الأعمال والبيانات والتطبيقات والبنية التقنية، ثم أحدد الوضع المستهدف وخارطة الانتقال. الهدف تقليل التعقيد والمخاطر وتحقيق نتائج أعمال قابلة للقياس."],["How would you run an EA engagement?","Assess · Design · Roadmap","I start with business objectives and stakeholder interviews. Then I assess the current state, including applications, data, integrations, infrastructure, and risks. I define the target architecture, analyse gaps, prioritise transition initiatives, and establish decision governance. I make sure every roadmap item has an owner and measurable outcome.","أبدأ بفهم أهداف الجهة ومقابلة أصحاب المصلحة، ثم أحلل الوضع الحالي للأنظمة والبيانات والتكاملات والمخاطر. بعد ذلك أصمم الوضع المستهدف، وأحدد الفجوات والأولويات وخارطة الانتقال، مع حوكمة واضحة ومسؤول عن كل مبادرة ومؤشر لقياس نجاحها."],["Explain TOGAF ADM and your experience","ADM · Tailoring · Governance","TOGAF ADM provides a structured, iterative method for developing enterprise architecture. It covers the preliminary setup, architecture vision, business, information systems and technology architectures, opportunities, migration planning, implementation governance, and change management, with requirements managed throughout. I apply these principles pragmatically in transformation programmes; I do not claim a formal TOGAF certification.","TOGAF إطار لتنظيم معمارية المؤسسة، وADM منهجية دورية تبدأ بالتهيئة والرؤية، ثم معمارية الأعمال والبيانات والتطبيقات والتكنولوجيا، يليها تحديد فرص التنفيذ وخطة الانتقال وحوكمة التطبيق وإدارة التغيير. إدارة المتطلبات مستمرة في جميع المراحل. أطبق هذا التسلسل عمليًا بحسب احتياجات المؤسسة، دون أن أزعم امتلاك شهادة TOGAF."],["Tell me about MedIQ and its business impact","Problem · Delivery · Results","MedIQ is a major healthcare technology transformation initiative at UPA. My role has been to lead technology delivery and architecture governance across complex procurement and supply-chain workflows. The programme achieved an 80% reduction in order cycle time, a 60% reduction in delivery cycle time, and a 70% reduction in manual work. For me, these outcomes show why architecture must be linked to operational results.","MedIQ من أهم مبادرات التحول الصحي التي قدتها في هيئة الشراء الموحد. توليت قيادة التنفيذ التقني وحوكمة المعمارية لعمليات المشتريات وسلاسل الإمداد. حققنا خفضًا بنحو 80% في دورة الطلبات، و60% في دورة التسليم، و70% في العمل اليدوي. الأهم عندي أن تُترجم القرارات التقنية إلى أثر تشغيلي واضح."],["How do you integrate MedIQ with SAP?","Contracts · Reliability · Reconciliation","I start by defining which system owns each data element, the integration contract, field mappings, validation, and security controls. I then consider transaction identifiers, failure handling, monitoring, and reconciliation between the systems. In our enterprise environment, MedIQ and SAP integration supports procurement and financial workflows. My focus is reliable end-to-end business processing, not simply moving data between applications.","في تكامل MedIQ مع SAP أبدأ بتحديد النظام المسؤول عن كل بيان، ثم عقود التكامل وخرائط الحقول والتحقق من البيانات والصلاحيات. أهتم أيضًا بمعرّفات المعاملات ومعالجة الأخطاء والمراقبة والمطابقة بين النظامين؛ لأن نجاح التكامل يعني سلامة دورة المشتريات والعمليات المالية، وليس مجرد نقل البيانات."],["REST vs SOAP; API Gateway vs ESB?","Protocol · Access · Integration","REST is an architectural style, commonly using HTTP and JSON; SOAP is an XML-based messaging protocol with formal contracts such as WSDL. An API Gateway controls API access, authentication, routing, and traffic policies. An ESB, or Enterprise Service Bus, supports enterprise integration, including message routing, transformation, and protocol mediation. I choose based on existing systems, security, and operational complexity, not fashion.","REST أسلوب لبناء واجهات تكامل، ويستخدم غالبًا HTTP وJSON، بينما SOAP بروتوكول رسائل يعتمد على XML وعقود رسمية مثل WSDL. أما API Gateway فيدير الوصول والأمان وتوجيه الطلبات، وESB اختصار Enterprise Service Bus، وهو وسيط يربط الأنظمة ويحوّل البيانات والبروتوكولات. أختار حسب احتياجات الأنظمة والأمان والتعقيد."],["What if SAP is down or a transaction is duplicated?","Retry · Idempotency · Recovery","I first define the business requirement: does the user need an immediate response, or can processing be asynchronous? For temporary failures, I use controlled retries and monitoring; where suitable, a queue can buffer work. Unique transaction IDs and idempotency prevent duplicate business transactions. Failed messages need a recovery path and reconciliation so both systems reach a consistent business state.","إذا تعطل SAP أحدد أولًا هل العملية تحتاج ردًا فوريًا أم يمكن تنفيذها لاحقًا. أستخدم إعادة المحاولة بضوابط، والمراقبة، وطابور رسائل عند الحاجة. وأمنع التكرار باستخدام رقم معاملة فريد وIdempotency، مع آلية لاستعادة المعاملات الفاشلة ومطابقة البيانات بين النظامين."],["Microservices or modular monolith?","Boundaries · Teams · Trade-offs","I do not automatically choose microservices. A modular monolith can be simpler when the domain and team are tightly coupled. Microservices make sense when there are clear business boundaries, independent deployment or scaling needs, and teams capable of handling distributed-system complexity. I consider cost, observability, security, and data consistency before deciding.","لا أختار Microservices تلقائيًا. إذا كانت الوظائف مترابطة والفريق محدودًا فقد يكون Modular Monolith أبسط. أختار Microservices عندما توجد حدود أعمال واضحة وحاجة لنشر أو توسع مستقل، بشرط قدرة الفريق على إدارة المراقبة والأمان والأعطال واتساق البيانات."],["How do you modernise a legacy platform?","Assess · Strangler · Continuity","I assess business criticality, dependencies, technical risks, and data ownership first. Then I compare options such as retaining, refactoring, replacing, or retiring components. Where appropriate, I use incremental migration and the Strangler Pattern to reduce cutover risk. Every migration step needs testing, rollback criteria, and data reconciliation.","أبدأ بتقييم أهمية النظام القديم وتبعياته ومخاطره وملكية بياناته. بعدها أقرر ما الذي سيبقى أو يُطوَّر أو يُستبدل أو يُلغى. أفضل الانتقال التدريجي، مثل Strangler Pattern عندما يناسب الحالة، مع اختبارات وخطة تراجع ومطابقة بيانات لتجنب تعطيل العمل."],["How do you handle architecture governance and stakeholder conflict?","Options · Risk · Decision","I establish clear principles, decision ownership, design reviews, and exception handling. When stakeholders disagree, I listen to the business priority, present options with cost, risk, and delivery trade-offs, and recommend a decision. I document the rationale and use the agreed escalation route when necessary. Governance should protect the organisation without slowing every decision.","أحدد مبادئ معمارية وصلاحيات اتخاذ القرار وآلية لمراجعة التصميم والاستثناءات. عند الخلاف أفهم أولوية الأعمال، ثم أعرض البدائل مع التكلفة والمخاطر والمدة وأوصي بحل واضح. أوثق القرار وأصعّد عند الحاجة. الحوكمة تحمي المؤسسة دون أن تعطل التنفيذ."],["Why EY, and what will you bring to consulting?","Delivery · Clients · Impact","I have spent years leading complex transformation from the delivery side. EY would let me apply that experience across clients and industries, combining architecture strategy with practical execution. I bring public-sector and healthcare experience, leadership of large technical teams, and a focus on measurable results. I am comfortable working with senior stakeholders and translating complex technology into business decisions.","لدي خبرة طويلة في تنفيذ التحول الرقمي داخل مؤسسات معقدة، وأريد توظيفها مع عملاء وقطاعات متعددة في EY. سأضيف خبرة عملية في القطاع الحكومي والصحي، وقيادة فرق كبيرة، وربط القرارات المعمارية بنتائج قابلة للقياس. أستطيع تحويل التعقيد التقني إلى خيارات واضحة للإدارة."]];const root=document.getElementById('grid');data.forEach((x,i)=>{const c=document.createElement('article');c.className='card';const n=document.createElement('div');n.className='num';n.textContent='سؤال '+(i+1);const q=document.createElement('h2');q.className='question';q.textContent=x[0];const a=document.createElement('p');a.className='answer';a.textContent=x[3];const k=document.createElement('div');k.className='keywords';k.textContent=x[1];const b=document.createElement('button');b.className='toggle';b.textContent='Show English answer';b.setAttribute('aria-expanded','false');const e=document.createElement('div');e.className='english';e.textContent=x[2];b.onclick=()=>{const on=e.classList.toggle('show');b.setAttribute('aria-expanded',String(on));b.textContent=on?'Hide English answer':'Show English answer'};c.append(n,q,a,k,b,e);root.appendChild(c)});</script></body></html>
