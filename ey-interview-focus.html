<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EY | Director Interview Focus · Updated</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17253b;font-family:Arial,sans-serif}header{background:#17253b;color:white;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:19px;margin:0}small{color:#d8e1ef}main{max-width:1250px;margin:auto;padding:14px}.top{font-size:12px;color:#64748b;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.q{background:white;border:1px solid #dce3ec;border-left:4px solid #f4c400;border-radius:10px;min-height:80px;padding:12px;text-align:left;cursor:pointer;font-weight:700;font-size:15px;line-height:1.35;color:#17253b}.q:hover{background:#fff9dc}.n{color:#8995a8;font-size:11px;margin-right:8px}.overlay{position:fixed;inset:0;background:#101d31b8;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{background:white;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modal h2{font-size:22px}.keys{display:inline-block;background:#fff3bc;border-radius:8px;padding:9px;font-weight:bold}.answer{font-size:17px;line-height:1.6}.actions{display:flex;justify-content:space-between;margin-top:18px}button.action{background:#17253b;color:white;border:0;border-radius:8px;padding:10px 15px}.q:focus-visible,.close:focus-visible,.action:focus-visible{outline:3px solid #2563eb;outline-offset:2px}.close{float:right;border:0;background:#eef2f7;border-radius:8px;font-size:22px;padding:4px 12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.q{font-size:12px;min-height:86px;padding:10px}header h1{font-size:16px}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}.modal small{color:#53637a}</style></head><body><header><div><h1>EY · Enterprise Architecture</h1><small>Director Technical Interview | Focus Study</small></div><small>Technical interview practice</small></header><main><div class="top">39 rigorously reviewed questions · Real examples + consulting scenarios · EN + AR</div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><button class="close" onclick="closeQ()">×</button><small id="count"></small><h2 id="question"></h2><div class="keys" id="keys"></div><p class="answer" id="answer"></p><div class="actions"><button class="action" onclick="openQ(current-1)">← Previous</button><button class="action" onclick="openQ(current+1)">Next →</button></div></div></div><script>const data=[
  [
    "Tell me about yourself and your architecture experience",
    "Strategy · Architecture · Delivery",
    "I’m a technology and digital transformation leader with over 18 years in enterprise technology. At UPA, I lead a team of 54+ engineers and work across architecture, integration and delivery. MedIQ is a good example: I can walk you through how we connected a national healthcare workflow to SAP, the decisions I owned, and how we measured the improvement in order cycle time. At EY, I’d bring that delivery experience into client assessments, target-state design and implementation governance."
  ],
  [
    "How would you establish Enterprise Architecture for a government client?",
    "Strategy · Capabilities · Roadmap",
    "I use ADM to structure decisions. I establish the mandate and principles, agree the architecture vision, and model the business, information systems and technology domains at the depth the engagement needs. I translate gaps into work packages and migration waves, then use implementation governance and change management to keep the roadmap current. Requirements management runs throughout."
  ],
  [
    "Explain TOGAF ADM and how you apply it",
    "ADM · Governance · Migration",
    "I’d give the CIO a capability heatmap and investment roadmap. Delivery teams would get target views, integration contracts and a transition architecture. Security and governance would get data flows, control mappings and decision records. I’d link each artifact to the decision it supports and assign an owner to keep it current."
  ],
  [
    "What architecture artifacts would you deliver?",
    "Maps · Decisions · Roadmap",
    "I’d set a charter with decision rights, review thresholds and turnaround times. For higher-risk designs, the board would review options, data flows, non-functional requirements and control evidence. I’d record the decision, owner and conditions. Exceptions would have a risk owner, compensating controls and an expiry date, with remediation tracked at the next gate."
  ],
  [
    "How do you establish an Architecture Review Board?",
    "Principles · Reviews · Exceptions",
    "I’d start with the stakeholder’s question. For example, to assess the impact of replacing an order application, I’d model the business process it serves, the application services and data it relies on, and the technology dependencies underneath. I’d use those relationships to identify what must migrate together and where a transition interface can reduce risk."
  ],
  [
    "What do you know about NORA and Saudi DGA?",
    "NORA · DGA · Alignment",
    "I’d turn a strategic goal into a measurable outcome, then map it to the capabilities that influence it. For shorter order cycle time, I’d examine approval, fulfilment and status visibility, establish a baseline, and compare changes against their expected effect. Each roadmap item would have a business owner, a dependency and a measure we can track after rollout."
  ],
  [
    "How do you model architecture with ArchiMate?",
    "Layers · Dependencies · Views",
    "In week one I’d agree the sponsor’s decisions, scope and evidence needs. In weeks two and three I’d run workshops and validate current-state dependencies. In week four I’d compare target options, then use week five to agree transition waves and ownership. In week six I’d brief executives on the recommended architecture, investment decisions, risks and items that need deeper discovery."
  ],
  [
    "How do you translate strategy into architecture?",
    "Goals · Capabilities · Design",
    "For a Saudi government engagement, I’d confirm the applicable DGA requirements and NORA version with the client. I’d build a matrix mapping each applicable requirement to architecture evidence, gaps, owners and closure dates. I’d use that matrix in design assurance and reflect remediation in the roadmap. For experience questions, I’d describe my own government architecture work and clarify my level of direct NORA exposure."
  ],
  [
    "Walk me through MedIQ architecture and your contribution",
    "Business · Integration · Outcomes",
    "I’d agree with the sponsor on the public-service outcomes, scope and decision owners. Then I’d map capabilities and trace a priority service through its processes, applications, data and controls. I’d validate the baseline with business, IT and security leads and compare target options on value, risk, cost and feasibility. The deliverable would be a target state and phased roadmap with owners, dependencies and measurable outcomes."
  ],
  [
    "How would you integrate SAP with government systems?",
    "Contracts · Security · Reliability",
    "MedIQ is my example of translating a national healthcare workflow into technology delivery. I’d explain the order journey before and after integration, the SAP boundary, who owned the key records, and one trade-off I personally helped resolve. I’d distinguish my decisions from the team’s implementation and close with the order-cycle result, including the measurement window and scope."
  ],
  [
    "Microservices or modular monolith?",
    "Boundaries · Consistency · Complexity",
    "I’m interested in EY’s TST practice because the role connects advisory to implementation. My public-sector experience gives me examples of translating operational constraints into architecture decisions and taking those decisions through delivery. I’d like to apply that experience to assessments, roadmaps and governance for MENA clients."
  ],
  [
    "How do you modernize a legacy system?",
    "Assess · Strangler · Migrate",
    "I’d align with the engagement lead on client outcomes and EY’s delivery approach. In the first month I’d learn the context and take ownership of a defined deliverable. By day 60 I’d aim to validate a baseline or facilitate a decision workshop. By day 90 I’d aim to deliver a client-ready recommendation with a roadmap, owners and evidence."
  ],
  [
    "How do you choose cloud, hybrid, or on-premises?",
    "Workload · Security · Cost",
    "I assess data sensitivity, regulations, integration, availability, latency, skills, and total cost. Then I recommend the architecture that best fits business needs."
  ],
  [
    "How do you design for high availability and DR?",
    "SLA · RTO/RPO · Test",
    "I agree on service targets, identify failure points, design redundancy and recovery, and validate the solution with monitoring, failover tests, and disaster recovery exercises."
  ],
  [
    "A CIO needs a target architecture in six weeks. What do you do?",
    "Scope · Evidence · Roadmap",
    "I’d map dependencies and rank capabilities by business value and migration risk. I’d start with a bounded workflow, introduce a stable interface and move traffic in stages. I’d define data reconciliation, rollback criteria and ownership before cutover, then retire the old component after usage and controls have been verified."
  ],
  [
    "How do you handle disagreement with a senior stakeholder?",
    "Listen · Trade-offs · Decide",
    "I’d start with domain boundaries and operating capacity. Independent deployment or materially different scaling needs can justify splitting a capability into a service if the team can support observability, versioned contracts and failure handling. Where releases and data consistency are tightly coupled, I’d favour clear module boundaries in a single deployment and extract services when the evidence supports it."
  ],
  [
    "Why EY and why Technology Consulting?",
    "Clients · Architecture · Impact",
    "I’d assess each workload against residency, latency, recovery, security controls, integration and operating cost. I’d agree which constraints are mandatory, then score viable options and test the riskiest assumption with a small proof of concept. A hybrid option needs a clear rationale for how the data and operational responsibilities are split."
  ],
  [
    "What would you deliver in your first 90 days?",
    "Understand · Assess · Deliver",
    "I would learn EY's delivery standards and client priorities, support architecture assessments, build stakeholder trust, and deliver actionable recommendations and roadmaps."
  ],
  [
    "How would you rationalize a portfolio of 120 applications?",
    "Evidence · Disposition · Dependencies",
    "I’d inventory owners, costs, users, capability coverage, lifecycle and dependencies. I’d score business fit and technical health, then propose retain, invest, consolidate, migrate or retire. I’d validate those choices with business owners and sequence migrations around dependencies and continuity risk."
  ],
  [
    "How would you recommend a vendor when two solutions meet the brief?",
    "Mandatory controls · TCO · Proof of concept",
    "I’d agree the scoring criteria before reviewing bids. I’d test mandatory controls first, then score integration, total cost, delivery risk and exit options. A proof of concept should test the highest-risk workflow with agreed success criteria. I’d present the recommendation and any contract conditions needed to manage the residual risk."
  ],
  [
    "A client wants to go live with a design exception. How do you advise?",
    "Severity · Compensating controls · Ownership",
    "I’d identify the requirement and impact, then separate release blockers from risks an authorized owner can accept. For an eligible exception, I’d agree compensating controls, monitoring, an expiry date and a remediation owner. I’d escalate material residual risk through the client’s governance process."
  ]
];let current=0;let previousFocus=null;const grid=document.getElementById('grid'),overlay=document.getElementById('overlay');data.forEach((x,i)=>{let b=document.createElement('button');b.className='q';b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span>';let s=document.createElement('span');s.textContent=x[0];b.appendChild(s);b.onclick=()=>openQ(i);grid.appendChild(b)});function openQ(i){current=(i+data.length)%data.length;let x=data[current];document.getElementById('count').textContent='QUESTION '+(current+1)+' / '+data.length;document.getElementById('question').textContent=x[0];document.getElementById('keys').textContent=x[1];document.getElementById('answer').textContent=x[2];if(!overlay.classList.contains('show'))previousFocus=document.activeElement;overlay.classList.add('show');document.querySelector('.close').focus()}function closeQ(){overlay.classList.remove('show');if(previousFocus)previousFocus.focus()}overlay.onclick=e=>{if(e.target===overlay)closeQ()};document.onkeydown=e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeQ();if(overlay.classList.contains('show')&&e.key==='ArrowRight')openQ(current+1);if(overlay.classList.contains('show')&&e.key==='ArrowLeft')openQ(current-1);if(overlay.classList.contains('show')&&e.key==='Tab'){const focusable=[...overlay.querySelectorAll('button:not([disabled])')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}</script></body></html>
