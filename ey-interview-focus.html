<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EY | Interview Focus</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#18263d;font-family:Arial,Segoe UI,Tahoma,sans-serif}header{background:#17253b;color:#fff;padding:20px}header>div,main{max-width:1080px;margin:auto}h1{font-size:23px;margin:0 0 6px}header p{margin:0;color:#dbe5f3;font-size:13px}main{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.q{border:1px solid #dbe2eb;border-left:4px solid #e6c028;border-radius:11px;background:white;padding:15px;text-align:left;cursor:pointer;color:#18263d;font:600 15px/1.45 Arial,sans-serif;min-height:78px}.q:hover,.q:focus-visible{background:#fff9e8;outline:2px solid #e6c028}.q small{display:block;color:#65748a;font-size:11px;margin-bottom:6px}.overlay{position:fixed;inset:0;background:#0b1830ba;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}.overlay.show{display:flex}.modal{background:white;border-radius:16px;max-width:790px;width:100%;max-height:94dvh;overflow:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.top h2{font-size:21px;line-height:1.4;margin:7px 0 12px}.count{color:#66758b;font-size:12px}.close{border:0;background:#eef1f6;border-radius:8px;padding:5px 12px;font-size:23px;cursor:pointer}.keys{display:inline-block;background:#fff1bc;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:bold}.label{font-size:12px;font-weight:700;color:#5c6d84;letter-spacing:.04em;margin:16px 0 7px}.en{font-size:16px;line-height:1.75;white-space:pre-wrap}.ar{direction:rtl;text-align:right;font-family:Tahoma,Segoe UI,Arial,sans-serif;font-size:15px;line-height:1.95;background:#f3f6fb;border-right:4px solid #e6c028;padding:13px;border-radius:9px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.action{background:#17253b;color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}@media(max-width:680px){.grid{grid-template-columns:1fr}.modal{padding:16px}.top h2{font-size:18px}.en{font-size:15px}}@media print{.overlay{position:static;display:block;background:white}.modal{max-height:none}.actions,.close,header,main{display:none}}</style></head><body><header><div><h1>EY · Interview Focus</h1><p>20 essential questions · English first · Arabic immediately below</p></div></header><main><div id="grid" class="grid"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="question"><section class="modal"><div class="top"><div><span class="count" id="count"></span><h2 id="question"></h2></div><button class="close" id="close" aria-label="Close">×</button></div><span class="keys" id="keys"></span><div class="label">ENGLISH ANSWER</div><div class="en" id="english"></div><div class="label">الإجابة بالعربية</div><div class="ar" id="arabic"></div><div class="actions"><button class="action" id="prev">← Previous</button><button class="action" id="next">Next →</button></div></section></div><script>const data=[["Tell me about yourself","18 years · Leadership · MedIQ","I have over 18 years of experience in IT leadership, enterprise systems, and digital transformation. At Egypt’s Unified Procurement Authority, I lead a team of more than 54 people, with nine direct reports, and oversee an annual IT budget of around EGP 150 million. I have led major healthcare technology initiatives, including MedIQ. My strength is connecting business goals with architecture, governance, and delivery. I want to bring that practical experience to EY’s clients.","أنا قائد تكنولوجيا وتحول رقمي بخبرة أكثر من 18 سنة في الحكومة والرعاية الصحية والخليج. حاليًا أقود إدارة نظم المعلومات والتحول الرقمي في هيئة الشراء الموحد، بفريق يتجاوز 54 متخصصًا و9 مديرين مباشرين، وميزانية تقنية نحو 150 مليون جنيه سنويًا. قدت مبادرات كبيرة مثل MedIQ، وأتميز بربط احتياجات الأعمال بالمعمارية والتنفيذ والحوكمة."],["What is Enterprise Architecture?","Business · Four domains · Value","Enterprise Architecture connects business strategy with technology decisions. I assess business capabilities, data, applications, and technology, then define a target state and a practical roadmap. The objective is not to produce diagrams; it is to reduce complexity, manage risk, and deliver measurable business value.","معمارية المؤسسة هي ربط استراتيجية الجهة بأنظمتها وبياناتها وتقنياتها. أدرس أربعة جوانب: الأعمال والبيانات والتطبيقات والبنية التقنية، ثم أحدد الوضع المستهدف وخارطة الانتقال. الهدف تقليل التعقيد والمخاطر وتحقيق نتائج أعمال قابلة للقياس."],["How would you run an EA engagement?","Assess · Design · Roadmap","I start with business objectives and stakeholder interviews. Then I assess the current state, including applications, data, integrations, infrastructure, and risks. I define the target architecture, analyse gaps, prioritise transition initiatives, and establish decision governance. I make sure every roadmap item has an owner and measurable outcome.","أبدأ بفهم أهداف الجهة ومقابلة أصحاب المصلحة، ثم أحلل الوضع الحالي للأنظمة والبيانات والتكاملات والمخاطر. بعد ذلك أصمم الوضع المستهدف، وأحدد الفجوات والأولويات وخارطة الانتقال، مع حوكمة واضحة ومسؤول عن كل مبادرة ومؤشر لقياس نجاحها."],["Explain TOGAF ADM and your experience","ADM · Tailoring · Governance","TOGAF ADM provides a structured, iterative method for developing enterprise architecture. It covers the preliminary setup, architecture vision, business, information systems and technology architectures, opportunities, migration planning, implementation governance, and change management, with requirements managed throughout. I apply these principles pragmatically in transformation programmes; I do not claim a formal TOGAF certification.","TOGAF إطار لتنظيم معمارية المؤسسة، وADM منهجية دورية تبدأ بالتهيئة والرؤية، ثم معمارية الأعمال والبيانات والتطبيقات والتكنولوجيا، يليها تحديد فرص التنفيذ وخطة الانتقال وحوكمة التطبيق وإدارة التغيير. إدارة المتطلبات مستمرة في جميع المراحل. أطبق هذا التسلسل عمليًا بحسب احتياجات المؤسسة، دون أن أزعم امتلاك شهادة TOGAF."],["Tell me about MedIQ and its business impact","Problem · Delivery · Results","MedIQ is a major healthcare technology transformation initiative at UPA. My role has been to lead technology delivery and architecture governance across complex procurement and supply-chain workflows. The programme achieved an 80% reduction in order cycle time, a 60% reduction in delivery cycle time, and a 70% reduction in manual work. For me, these outcomes show why architecture must be linked to operational results.","MedIQ من أهم مبادرات التحول الصحي التي قدتها في هيئة الشراء الموحد. توليت قيادة التنفيذ التقني وحوكمة المعمارية لعمليات المشتريات وسلاسل الإمداد. حققنا خفضًا بنحو 80% في دورة الطلبات، و60% في دورة التسليم، و70% في العمل اليدوي. الأهم عندي أن تُترجم القرارات التقنية إلى أثر تشغيلي واضح."],["How do you design a Target Architecture and Migration Roadmap?","Baseline · Gaps · Waves","I start with the business objectives and current-state assessment. Then I define target capabilities, applications, data flows, integrations, security and infrastructure. I identify gaps and dependencies, prioritise initiatives by value and risk, and create transition architectures and migration waves with owners and measurable milestones.","أبدأ بأهداف الأعمال والوضع الحالي، ثم أحدد القدرات والأنظمة والبيانات والتكاملات المطلوبة في الوضع المستهدف. أحلل الفجوات والتبعيات، وأرتب المبادرات حسب القيمة والمخاطر، وأقسم التنفيذ لمراحل انتقالية واضحة بمسؤوليات ومؤشرات نجاح."],["How do you integrate MedIQ with SAP?","Contracts · Reliability · Reconciliation","I start by defining which system owns each data element, the integration contract, field mappings, validation, and security controls. I then consider transaction identifiers, failure handling, monitoring, and reconciliation between the systems. In our enterprise environment, MedIQ and SAP integration supports procurement and financial workflows. My focus is reliable end-to-end business processing, not simply moving data between applications.","في تكامل MedIQ مع SAP أبدأ بتحديد النظام المسؤول عن كل بيان، ثم عقود التكامل وخرائط الحقول والتحقق من البيانات والصلاحيات. أهتم أيضًا بمعرّفات المعاملات ومعالجة الأخطاء والمراقبة والمطابقة بين النظامين؛ لأن نجاح التكامل يعني سلامة دورة المشتريات والعمليات المالية، وليس مجرد نقل البيانات."],["REST vs SOAP; API Gateway vs ESB?","Protocol · Access · Integration","REST is an architectural style, commonly using HTTP and JSON; SOAP is an XML-based messaging protocol with formal contracts such as WSDL. An API Gateway controls API access, authentication, routing, and traffic policies. An ESB, or Enterprise Service Bus, supports enterprise integration, including message routing, transformation, and protocol mediation. I choose based on existing systems, security, and operational complexity, not fashion.","REST أسلوب لبناء واجهات تكامل، ويستخدم غالبًا HTTP وJSON، بينما SOAP بروتوكول رسائل يعتمد على XML وعقود رسمية مثل WSDL. أما API Gateway فيدير الوصول والأمان وتوجيه الطلبات، وESB اختصار Enterprise Service Bus، وهو وسيط يربط الأنظمة ويحوّل البيانات والبروتوكولات. أختار حسب احتياجات الأنظمة والأمان والتعقيد."],["What if SAP is down or a transaction is duplicated?","Retry · Idempotency · Recovery","I first define the business requirement: does the user need an immediate response, or can processing be asynchronous? For temporary failures, I use controlled retries and monitoring; where suitable, a queue can buffer work. Unique transaction IDs and idempotency prevent duplicate business transactions. Failed messages need a recovery path and reconciliation so both systems reach a consistent business state.","إذا تعطل SAP أحدد أولًا هل العملية تحتاج ردًا فوريًا أم يمكن تنفيذها لاحقًا. أستخدم إعادة المحاولة بضوابط، والمراقبة، وطابور رسائل عند الحاجة. وأمنع التكرار باستخدام رقم معاملة فريد وIdempotency، مع آلية لاستعادة المعاملات الفاشلة ومطابقة البيانات بين النظامين."],["Microservices or modular monolith?","Boundaries · Teams · Trade-offs","I do not automatically choose microservices. A modular monolith can be simpler when the domain and team are tightly coupled. Microservices make sense when there are clear business boundaries, independent deployment or scaling needs, and teams capable of handling distributed-system complexity. I consider cost, observability, security, and data consistency before deciding.","لا أختار Microservices تلقائيًا. إذا كانت الوظائف مترابطة والفريق محدودًا فقد يكون Modular Monolith أبسط. أختار Microservices عندما توجد حدود أعمال واضحة وحاجة لنشر أو توسع مستقل، بشرط قدرة الفريق على إدارة المراقبة والأمان والأعطال واتساق البيانات."],["How do you modernise a legacy platform?","Assess · Strangler · Continuity","I assess business criticality, dependencies, technical risks, and data ownership first. Then I compare options such as retaining, refactoring, replacing, or retiring components. Where appropriate, I use incremental migration and the Strangler Pattern to reduce cutover risk. Every migration step needs testing, rollback criteria, and data reconciliation.","أبدأ بتقييم أهمية النظام القديم وتبعياته ومخاطره وملكية بياناته. بعدها أقرر ما الذي سيبقى أو يُطوَّر أو يُستبدل أو يُلغى. أفضل الانتقال التدريجي، مثل Strangler Pattern عندما يناسب الحالة، مع اختبارات وخطة تراجع ومطابقة بيانات لتجنب تعطيل العمل."],["How do you ensure cybersecurity, availability and disaster recovery?","Risk · RTO/RPO · Test","I classify systems and data by business criticality, then define access controls, encryption, logging and security reviews. For availability, I agree on service targets and identify single points of failure. For disaster recovery, I define RTO and RPO, backup and failover procedures, and test the recovery plan regularly. A documented plan alone is not enough.","أصنف الأنظمة والبيانات حسب حساسيتها وأهميتها، وأطبق ضوابط الوصول والتشفير والتسجيل والمراجعة الأمنية. أحدد متطلبات الإتاحة ونقاط الفشل الفردية. وفي التعافي من الكوارث أتفق على RTO وRPO، وأضع إجراءات النسخ الاحتياطي والتحويل وأختبرها؛ فالخطة غير المختبرة لا تكفي."],["How do you approach Data Architecture and Governance?","Ownership · Quality · Access","I define data domains, owners and systems of record. Then I establish data quality rules, access permissions, integration standards, metadata and auditability. I use a central data platform for reporting where appropriate, but preserve clear ownership of source data. At UPA, data governance and analytics are important parts of our transformation work.","أحدد مجالات البيانات وملاكها ومصدر الحقيقة لكل بيان، ثم أضع قواعد الجودة والصلاحيات والتكامل والتوثيق والتدقيق. أستخدم مستودع بيانات مركزيًا للتحليلات عند الحاجة، مع الحفاظ على ملكية البيانات في أنظمتها الأصلية. طبقت هذه المبادئ في أعمال البيانات والتحليلات بالهيئة."],["How do you assess and rationalise an application portfolio?","Inventory · Value · Risk","I build an application inventory covering business owner, purpose, cost, technical health, dependencies, data sensitivity and usage. I assess business value and risk, then recommend which applications to retain, modernise, consolidate, replace or retire. I sequence changes to avoid disruption and measure cost and complexity reduction.","أبدأ بحصر التطبيقات وملاكها وتكلفتها واستخدامها وحالتها الفنية وتبعياتها. أقيم القيمة التجارية والمخاطر، ثم أحدد ما يُحتفظ به أو يُحدَّث أو يُدمج أو يُستبدل أو يُلغى. أنفذ تدريجيًا لتقليل التعطيل والتكلفة والتعقيد."],["How do you handle architecture governance and stakeholder conflict?","Options · Risk · Decision","I establish clear principles, decision ownership, design reviews, and exception handling. When stakeholders disagree, I listen to the business priority, present options with cost, risk, and delivery trade-offs, and recommend a decision. I document the rationale and use the agreed escalation route when necessary. Governance should protect the organisation without slowing every decision.","أحدد مبادئ معمارية وصلاحيات اتخاذ القرار وآلية لمراجعة التصميم والاستثناءات. عند الخلاف أفهم أولوية الأعمال، ثم أعرض البدائل مع التكلفة والمخاطر والمدة وأوصي بحل واضح. أوثق القرار وأصعّد عند الحاجة. الحوكمة تحمي المؤسسة دون أن تعطل التنفيذ."],["How do you deal with a difficult client or senior stakeholder?","Listen · Options · Agreement","I first listen to understand the client's business concern and decision constraints. I separate facts from assumptions, then present realistic options with costs, risks and delivery impact. I agree on a decision and document responsibilities. If the risk is unacceptable, I escalate transparently rather than making an unrealistic promise.","أفهم أولًا سبب اعتراض العميل وأولوياته، وأفصل الحقائق عن الافتراضات. أعرض بدائل واضحة مع التكلفة والمخاطر والمدة، ثم نتفق على قرار ومسؤوليات محددة. وإذا كان الخطر غير مقبول أصعّده بوضوح بدل إعطاء وعد غير واقعي."],["How do you manage architecture trade-offs under tight deadlines?","Risk · Options · Decision","I identify the non-negotiable controls first, especially security, data integrity and business continuity. Then I present a minimum viable architecture and a phased improvement plan. I document accepted risks, owners and deadlines. This allows delivery to move quickly without hiding technical debt or compromising critical controls.","أحدد أولًا ما لا يمكن التنازل عنه مثل الأمان وسلامة البيانات واستمرارية العمل. بعدها أقدم تصميمًا عمليًا قابلًا للتنفيذ وخطة تحسين تدريجية. أوثق المخاطر المقبولة والمسؤول عنها وموعد معالجتها؛ وبذلك أوازن بين سرعة التسليم والجودة."],["How do you manage a large technical team and delivery risks?","Priorities · Delegation · Governance","I align the team around measurable priorities, assign clear ownership and use regular delivery and risk reviews. At UPA I lead more than 54 people with nine direct reports, so delegation and escalation are essential. I focus on dependencies, quality gates, stakeholder communication and removing blockers before they affect delivery.","أربط الفريق بأولويات ومؤشرات واضحة، وأوزع المسؤوليات وأراجع التقدم والمخاطر بانتظام. في الهيئة أقود أكثر من 54 متخصصًا و9 مديرين مباشرين، لذلك أعتمد على التفويض والتصعيد المبكر وبوابات الجودة ومتابعة التبعيات قبل أن تتحول لمشكلات."],["Why EY, and what will you bring to consulting?","Delivery · Clients · Impact","I have spent years leading complex transformation from the delivery side. EY would let me apply that experience across clients and industries, combining architecture strategy with practical execution. I bring public-sector and healthcare experience, leadership of large technical teams, and a focus on measurable results. I am comfortable working with senior stakeholders and translating complex technology into business decisions.","لدي خبرة طويلة في تنفيذ التحول الرقمي داخل مؤسسات معقدة، وأريد توظيفها مع عملاء وقطاعات متعددة في EY. سأضيف خبرة عملية في القطاع الحكومي والصحي، وقيادة فرق كبيرة، وربط القرارات المعمارية بنتائج قابلة للقياس. أستطيع تحويل التعقيد التقني إلى خيارات واضحة للإدارة."],["What would you deliver in your first 90 days at EY?","Learn · Contribute · Own","In the first month I would understand the client context, EY delivery methods and team expectations. In the second month I would contribute to assessments, architecture workshops and recommendations. By day 90 I would aim to own clear deliverables, build stakeholder trust and demonstrate practical value.","في أول 30 يوم أفهم العميل ومنهجيات EY والفريق. في الشهر الثاني أشارك في تقييمات المعمارية وورش العمل والتوصيات. وبنهاية 90 يوم أكون مسؤولًا عن مخرجات واضحة، وبنيت ثقة أصحاب المصلحة، وقدمت قيمة عملية."]];let current=0,previousFocus=null;const grid=document.getElementById('grid'),overlay=document.getElementById('overlay');data.forEach((x,i)=>{const b=document.createElement('button');b.className='q';const s=document.createElement('small');s.textContent=String(i+1).padStart(2,'0')+' · '+x[1];b.append(s,document.createTextNode(x[0]));b.onclick=()=>openQ(i);grid.appendChild(b)});function openQ(i){current=(i+data.length)%data.length;const x=data[current];document.getElementById('count').textContent='QUESTION '+(current+1)+' / '+data.length;document.getElementById('question').textContent=x[0];document.getElementById('keys').textContent=x[1];document.getElementById('english').textContent=x[2];document.getElementById('arabic').textContent=x[3];if(!overlay.classList.contains('show'))previousFocus=document.activeElement;overlay.classList.add('show');document.getElementById('close').focus()}function closeQ(){overlay.classList.remove('show');previousFocus?.focus()}document.getElementById('close').onclick=closeQ;document.getElementById('prev').onclick=()=>openQ(current-1);document.getElementById('next').onclick=()=>openQ(current+1);overlay.onclick=e=>{if(e.target===overlay)closeQ()};document.onkeydown=e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeQ();if(overlay.classList.contains('show')&&e.key==='ArrowRight')openQ(current+1);if(overlay.classList.contains('show')&&e.key==='ArrowLeft')openQ(current-1);if(e.key==='Tab'&&overlay.classList.contains('show')){const controls=[...overlay.querySelectorAll('button')];const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};</script></body></html>
