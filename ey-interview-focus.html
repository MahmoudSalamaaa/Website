<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EY | Interview Focus</title><style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#1b2940;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#17253b;color:white;padding:20px max(18px,calc((100vw - 960px)/2))}h1{margin:0 0 5px;font-size:23px}header p{margin:0;color:#dbe4f0;font-size:13px}main{max-width:960px;margin:auto;padding:18px}.note{background:#fff9e5;border-left:4px solid #e6bd22;padding:12px 15px;border-radius:8px;font-size:13px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.q{background:#fff;border:1px solid #dbe2eb;border-left:4px solid #e8c322;border-radius:11px;text-align:left;padding:15px;cursor:pointer;color:#17253b;font:600 15px/1.45 inherit;min-height:85px}.q:hover,.q:focus-visible{background:#fff9e7;outline:2px solid #e8c322}.q small{display:block;font-size:11px;color:#6a788a;margin-bottom:5px}.overlay{position:fixed;inset:0;background:#0e1b30b8;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}.overlay.show{display:flex}.modal{background:#fff;width:100%;max-width:760px;max-height:94dvh;overflow:auto;border-radius:16px;padding:24px}.top{display:flex;justify-content:space-between;align-items:start;gap:12px}.top h2{font-size:21px;line-height:1.4;margin:8px 0 12px}.count{font-size:12px;color:#66758b}.keys{display:inline-block;background:#fff0ba;padding:8px 12px;border-radius:8px;font-weight:700;margin-bottom:14px}.label{font-size:11px;font-weight:700;color:#68758a;text-transform:uppercase;letter-spacing:.08em;margin:13px 0 6px}.answer{font-size:17px;line-height:1.7;white-space:pre-wrap}.ar{direction:rtl;text-align:right;background:#f4f7fb;border-right:4px solid #e8c322;padding:12px;border-radius:8px;line-height:1.8}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}button.action{background:#17253b;color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.close{border:0;background:#edf1f6;padding:7px 13px;border-radius:8px;font-size:22px;cursor:pointer}@media(max-width:620px){.grid{grid-template-columns:1fr}.modal{padding:17px}.answer{font-size:16px}header{padding:18px}}</style></head><body><header><h1>EY · Enterprise Architecture</h1><p>12 essential questions · Simple English answers · Arabic memory cues</p></header><main><div class="note">Focus on the first 5 questions, then SAP integration and reliability. Answers are interview scripts; adjust any implementation details to your actual experience.</div><div id="grid" class="grid"></div></main><div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="question"><section class="modal"><div class="top"><div><span class="count" id="count"></span><h2 id="question"></h2></div><button class="close" onclick="closeQ()" aria-label="Close">×</button></div><div class="keys" id="keys"></div><div class="label">English answer</div><div class="answer" id="answer"></div><div class="label">بالعربي — مفتاح الحفظ</div><div class="ar" id="ar"></div><div class="actions"><button class="action" onclick="openQ(current-1)">← Previous</button><button class="action" onclick="openQ(current+1)">Next →</button></div></section></div><script>const data=[["Tell me about yourself","18 years · Leadership · MedIQ","I have over 18 years of experience in IT leadership, enterprise systems, and digital transformation. At Egypt’s Unified Procurement Authority, I lead a team of more than 54 people, with nine direct reports, and oversee an annual IT budget of around EGP 150 million. I have led major healthcare technology initiatives, including MedIQ. My strength is connecting business goals with architecture, governance, and delivery. I want to bring that practical experience to EY’s clients.","خبرة 18+ سنة، فريق 54+، 9 مديرين مباشرين، ميزانية 150 مليون جنيه، وMedIQ. اربط الاستراتيجية بالتنفيذ."],["What is Enterprise Architecture?","Business · Four domains · Value","Enterprise Architecture connects business strategy with technology decisions. I assess business capabilities, data, applications, and technology, then define a target state and a practical roadmap. The objective is not to produce diagrams; it is to reduce complexity, manage risk, and deliver measurable business value.","أربع طبقات: Business / Data / Application / Technology. القيمة أهم من الرسومات."],["How would you run an EA engagement?","Assess · Design · Roadmap","I start with business objectives and stakeholder interviews. Then I assess the current state, including applications, data, integrations, infrastructure, and risks. I define the target architecture, analyse gaps, prioritise transition initiatives, and establish decision governance. I make sure every roadmap item has an owner and measurable outcome.","Business Goals → Current State → Target State → Gap → Roadmap → Governance."],["Explain TOGAF ADM and your experience","ADM · Tailoring · Governance","TOGAF ADM provides a structured, iterative method for developing enterprise architecture. It covers the preliminary setup, architecture vision, business, information systems and technology architectures, opportunities, migration planning, implementation governance, and change management, with requirements managed throughout. I apply these principles pragmatically in transformation programmes; I do not claim a formal TOGAF certification.","افهم مراحل ADM، ووضح إنك تطبق المبادئ عمليًا دون ادعاء شهادة."],["Tell me about MedIQ and its business impact","Problem · Delivery · Results","MedIQ is a major healthcare technology transformation initiative at UPA. My role has been to lead technology delivery and architecture governance across complex procurement and supply-chain workflows. The programme achieved an 80% reduction in order cycle time, a 60% reduction in delivery cycle time, and a 70% reduction in manual work. For me, these outcomes show why architecture must be linked to operational results.","احفظ الأرقام: 80% دورة الطلب، 60% دورة التسليم، 70% العمل اليدوي. وضح دورك الحقيقي."],["How do you integrate MedIQ with SAP?","Contracts · Reliability · Reconciliation","I start by defining which system owns each data element, the integration contract, field mappings, validation, and security controls. I then consider transaction identifiers, failure handling, monitoring, and reconciliation between the systems. In our enterprise environment, MedIQ and SAP integration supports procurement and financial workflows. My focus is reliable end-to-end business processing, not simply moving data between applications.","Data Ownership → Mapping → Security → Errors → Reconciliation. لا تدّعي أداة ESB معينة."],["REST vs SOAP; API Gateway vs ESB?","Protocol · Access · Integration","REST is an architectural style, commonly using HTTP and JSON; SOAP is an XML-based messaging protocol with formal contracts such as WSDL. An API Gateway controls API access, authentication, routing, and traffic policies. An ESB, or Enterprise Service Bus, supports enterprise integration, including message routing, transformation, and protocol mediation. I choose based on existing systems, security, and operational complexity, not fashion.","REST غالبًا JSON؛ SOAP XML. Gateway للتحكم في API؛ ESB للتحويل والتكامل."],["What if SAP is down or a transaction is duplicated?","Retry · Idempotency · Recovery","I first define the business requirement: does the user need an immediate response, or can processing be asynchronous? For temporary failures, I use controlled retries and monitoring; where suitable, a queue can buffer work. Unique transaction IDs and idempotency prevent duplicate business transactions. Failed messages need a recovery path and reconciliation so both systems reach a consistent business state.","Controlled Retry + Queue عند الحاجة + Idempotency + Reconciliation."],["Microservices or modular monolith?","Boundaries · Teams · Trade-offs","I do not automatically choose microservices. A modular monolith can be simpler when the domain and team are tightly coupled. Microservices make sense when there are clear business boundaries, independent deployment or scaling needs, and teams capable of handling distributed-system complexity. I consider cost, observability, security, and data consistency before deciding.","اختيار حسب Business Boundaries وTeam Maturity، مش موضة تقنية."],["How do you modernise a legacy platform?","Assess · Strangler · Continuity","I assess business criticality, dependencies, technical risks, and data ownership first. Then I compare options such as retaining, refactoring, replacing, or retiring components. Where appropriate, I use incremental migration and the Strangler Pattern to reduce cutover risk. Every migration step needs testing, rollback criteria, and data reconciliation.","Assess → Incremental Migration → Test → Rollback."],["How do you handle architecture governance and stakeholder conflict?","Options · Risk · Decision","I establish clear principles, decision ownership, design reviews, and exception handling. When stakeholders disagree, I listen to the business priority, present options with cost, risk, and delivery trade-offs, and recommend a decision. I document the rationale and use the agreed escalation route when necessary. Governance should protect the organisation without slowing every decision.","Architecture Principles + Options + Trade-offs + Decision Log."],["Why EY, and what will you bring to consulting?","Delivery · Clients · Impact","I have spent years leading complex transformation from the delivery side. EY would let me apply that experience across clients and industries, combining architecture strategy with practical execution. I bring public-sector and healthcare experience, leadership of large technical teams, and a focus on measurable results. I am comfortable working with senior stakeholders and translating complex technology into business decisions.","EY فرصة لتوسيع أثر خبرتك. أنت تجيب خبرة تنفيذ حقيقية للاستشارات."]];let current=0,previousFocus=null;const grid=document.getElementById('grid'),overlay=document.getElementById('overlay');data.forEach((x,i)=>{const b=document.createElement('button');b.className='q';const s=document.createElement('small');s.textContent=String(i+1).padStart(2,'0')+' · '+x[1];b.append(s,document.createTextNode(x[0]));b.onclick=()=>openQ(i);grid.appendChild(b)});function openQ(i){current=(i+data.length)%data.length;const x=data[current];document.getElementById('count').textContent='QUESTION '+(current+1)+' / '+data.length;document.getElementById('question').textContent=x[0];document.getElementById('keys').textContent=x[1];document.getElementById('answer').textContent=x[2];document.getElementById('ar').textContent=x[3];if(!overlay.classList.contains('show'))previousFocus=document.activeElement;overlay.classList.add('show');overlay.querySelector('.close').focus()}function closeQ(){overlay.classList.remove('show');previousFocus?.focus()}overlay.onclick=e=>{if(e.target===overlay)closeQ()};document.onkeydown=e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeQ();if(overlay.classList.contains('show')&&e.key==='ArrowRight')openQ(current+1);if(overlay.classList.contains('show')&&e.key==='ArrowLeft')openQ(current-1)};</script></body></html>
