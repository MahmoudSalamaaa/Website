let current=0;
let previousFocus=null;
const grid=document.getElementById('grid');
const overlay=document.getElementById('overlay');

data.forEach((x,i)=>{
  let b=document.createElement('button');
  b.className='q';
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span>';
  let s=document.createElement('span');
  s.textContent=x[0];
  b.appendChild(s);
  let tag=document.createElement('span');
  tag.className='tag '+(TAG_CLASS[x[4]]||'tag-ea');
  tag.textContent=TAG_NAMES[x[4]]||'EA';
  b.appendChild(document.createElement('br'));
  b.appendChild(tag);
  b.onclick=()=>openQ(i);
  grid.appendChild(b);
});

function openQ(i){
  current=(i+data.length)%data.length;
  let x=data[current];
  document.getElementById('count').textContent='QUESTION '+(current+1)+' / '+data.length;
  document.getElementById('question').textContent=x[0];
  document.getElementById('keys').textContent=x[1];
  document.getElementById('answer').textContent=x[2];
  document.getElementById('answer-ar').textContent=x[3];
  if(!overlay.classList.contains('show'))previousFocus=document.activeElement;
  overlay.classList.add('show');
  document.querySelector('.close').focus();
}

function closeQ(){
  overlay.classList.remove('show');
  if(previousFocus)previousFocus.focus();
}

overlay.onclick=e=>{if(e.target===overlay)closeQ()};

document.onkeydown=e=>{
  if(e.key==='Escape'&&overlay.classList.contains('show'))closeQ();
  if(overlay.classList.contains('show')&&e.key==='ArrowRight')openQ(current+1);
  if(overlay.classList.contains('show')&&e.key==='ArrowLeft')openQ(current-1);
  if(overlay.classList.contains('show')&&e.key==='Tab'){
    const focusable=[...overlay.querySelectorAll('button:not([disabled])')];
    const first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
};
</script>
