<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Photo Gallery | Mahmoud Salama</title>
<meta name="description" content="Selected professional gallery moments from national programs, executive engagements, team leadership, and digital-health initiatives."/>
<link href="assets/images/favicon.ico" rel="icon"/>
<link href="assets/css/font.css" rel="stylesheet"/>
<link href="site-main.css" rel="stylesheet"/>
<style>
body{margin:0;background:#f7fbff;color:#172033;font-family:"Josefin Sans","Segoe UI",Arial,sans-serif}
.gallery-page{padding:56px 18px 72px}
.gallery-shell{width:min(1160px,100%);margin:auto}
.gallery-top{text-align:center;margin-bottom:34px}
.gallery-kicker{display:inline-block;color:#00bcd4;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-bottom:10px}
.gallery-top h1{margin:0;color:#111827;font-size:clamp(34px,6vw,64px);line-height:1.05}
.gallery-top p{max-width:760px;margin:16px auto 0;color:#68717d;font-size:18px;line-height:1.7}
.gallery-grid-page{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.gallery-card{position:relative;min-height:280px;border:0;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 18px 45px rgba(15,23,42,.12);padding:0;cursor:pointer}
.gallery-card img{width:100%;height:100%;min-height:280px;object-fit:cover;display:block;transition:transform .25s ease}
.gallery-card:hover img{transform:scale(1.035)}
.gallery-card span{position:absolute;left:16px;bottom:16px;right:16px;background:rgba(15,23,42,.78);color:#fff;border-radius:14px;padding:11px 13px;font-weight:700;line-height:1.35}
.gallery-actions{display:flex;justify-content:center;margin-top:34px}
.gallery-actions .portfolio_btn{background:#00c8da}
@media(max-width:900px){.gallery-grid-page{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.gallery-page{padding-top:36px}.gallery-grid-page{grid-template-columns:1fr}.gallery-card,.gallery-card img{min-height:245px}.gallery-actions .portfolio_btn{width:min(100%,340px);min-width:0}}
</style>
</head>
<body>
<main class="gallery-page">
<div class="gallery-shell">
<header class="gallery-top">
<span class="gallery-kicker">Photo Gallery</span>
<h1>Selected Leadership Moments</h1>
<p>Selected moments from national programs, executive engagements, team leadership, and digital-health initiatives.</p>
</header>
<section class="gallery-grid-page" aria-label="Photo gallery">
<button class="gallery-card" type="button"><img alt="Digital health program pavilion at Africa Health ExCon" src="assets/images/gallery/excon3.webp"/><span>Africa Health ExCon Digital Health Pavilion</span></button>
<button class="gallery-card" type="button"><img alt="Regional health leadership event" src="assets/images/gallery/manama.webp"/><span>Manama Health Congress Executive Session</span></button>
<button class="gallery-card" type="button"><img alt="MedIQ national procurement and medical supply ecosystem event" src="assets/images/gallery/medIq.webp"/><span>MedIQ National Ecosystem Launch</span></button>
<button class="gallery-card" type="button"><img alt="Executive governance and stakeholder meeting" src="assets/images/gallery/leadership-meeting.webp"/><span>Executive Governance Meeting</span></button>
<button class="gallery-card" type="button"><img alt="Cross-functional technology team alignment session" src="assets/images/gallery/team-alignment.webp"/><span>Cross-functional Team Alignment</span></button>
<button class="gallery-card" type="button"><img alt="Healthcare technology exhibition and program showcase" src="assets/images/gallery/exhibition.webp"/><span>Healthcare Technology Exhibition</span></button>
</section>
<div class="gallery-actions"><a class="portfolio_btn btn_cyan" href="index.html#gallery"><span class="first_text">Back Home</span><span class="second_text">Gallery</span></a></div>
</div>
</main>
</body>
</html>
