<div class="wrap" style="padding-top:34px"><div class="card"><small>COMMON THREAD</small><h3>Technology decisions become institutional commitments.</h3><p>Across these roles, the recurring responsibility is to make technology governable: clarify ownership, protect data integrity, align stakeholders and create mechanisms that survive beyond a single project or implementation.</p></div></div></section>
