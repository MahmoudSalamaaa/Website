<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Mahmoud Salama</title>
  <style>
    html,body{height:100%;margin:0;background:#0e0f21;color:#fff;font-family:Arial,sans-serif}
    .restore-status{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
    .restore-status b{display:block;font-size:22px;margin-bottom:8px}
    .restore-status span{color:#aeb4c7}
  </style>
</head>
<body>
  <div class="restore-status" id="restoreStatus">
    <div><b>Loading original portfolio…</b><span>Restoring the classic design.</span></div>
  </div>

  <script>
  (async function restoreOriginalPortfolio(){
    const status = document.getElementById('restoreStatus');
    try {
      const response = await fetch('/index(1).html', { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);

      const html = await response.text();

      // Guard: do not silently load the wrong file.
      const signatures = [
        'port_sidebar_wrapper',
        'ms-intro',
        'Tech-OS',
        'port_bannerbg_wrapper'
      ];
      const matches = signatures.filter(s => html.includes(s)).length;
      if (matches < 3) throw new Error('Original-design signature check failed');

      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      console.error('Old-design restore failed:', err);
      status.innerHTML =
        '<div><b>Original design file could not be loaded.</b>' +
        '<span>Confirm that <code>index(1).html</code> exists in the repository root and is not blocked by .vercelignore.</span></div>';
    }
  })();
  </script>
</body>
</html>
