<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSF WaCA — Final 24</title><style>body{font:16px/1.6 system-ui;margin:0;background:#fffaf2;color:#173248}.w{max-width:1050px;margin:auto;padding:20px}.hero,.card,details{background:#fff;border:2px solid #173248;border-radius:20px;padding:22px;margin:12px 0}h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1}.bar,.kw{display:flex;gap:7px;flex-wrap:wrap}.bar{margin:14px 0}.bar input{flex:1;min-width:210px}button,input,.k{border:2px solid #173248;border-radius:11px;padding:8px;background:#fff;font:inherit}.k{background:#d8f2df;font-size:.82rem;font-weight:800}.a{display:none;white-space:pre-line;background:#fff6ce;border:2px solid #173248;border-radius:13px;padding:15px;margin:12px 0}.a.on{display:block}.f{color:#52697a;font-size:.9rem;margin:10px 0}.nav{display:flex;justify-content:space-between;margin-top:18px}.list{display:none}.list.on{display:block}.card.off{display:none}.da{white-space:pre-line;margin-top:10px}</style></head><body><main class="w"><section class="hero"><b>FINAL · Minimum Complete Set</b><h1>MSF WaCA · 24 Core Questions</h1><p>Q1 is detailed. Q2–Q24 are short, speakable answers. Keywords and follow-ups preserve the wider technical, management and field coverage.</p></section><div class="bar"><input id="s" placeholder="Search leadership, M365, DR, SAP…"><button id="cards">Cards</button><button id="all">All 24</button><button id="stop">Stop audio</button></div><article class="card" id="card"><small id="m"></small><h2 id="q"></h2><div class="kw" id="kw"></div><div class="f" id="f"></div><div class="a" id="a"></div><button id="reveal">Reveal</button><div id="tools" style="display:none"><button id="copy">Copy</button><button id="listen">Listen</button></div><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></article><section class="list" id="list"></section></main><script>const Q=[
['Tell us about yourself.','18+ years|54 people|7 directs|Healthcare IT|Oman|Private Cloud|DR','Career journey · current scope · healthcare · international · MSF relevance',`Thank you for the opportunity. I am an information systems and digital transformation leader with more than 18 years of experience across healthcare, government, education and enterprise technology.

I started in software engineering and progressed through architecture, solution delivery, project and program leadership, and enterprise technology management. I also spent more than four years working in Oman on national education digital platforms, giving me direct international delivery experience.

Today I am Head of the Central Administration for Information Systems and Digital Transformation at the Egyptian Authority for Unified Procurement. I lead a 54-person technology organization with seven direct reports. My scope covers enterprise applications, technical support and IT service delivery, Private Cloud infrastructure, information security governance, integrations, data, quality, vendors, and business continuity and disaster recovery.

Healthcare technology is a major part of my experience. My current scope includes MedIQ, procurement and e-Tendering, inventory and logistics, e-Pharmacy and dispensing, medical assets, data and analytics, and integrations with SAP-based Strategic Medical Warehouses and Microsoft Dynamics 365. I have also coordinated a real MedIQ disaster-recovery failover.

What is most relevant to MSF is that I see technology as an operational service. Reliability, support, ownership, security, resilience, documentation and user adoption matter as much as technology design.

I am also transparent about the gaps. I do not claim direct MSF humanitarian-field experience or deep hands-on AWS administration. I would listen first, learn WaCA's systems and field reality, and then apply my experience carefully.`],
['Why MSF WaCA, this role, and why move from your current senior position?','Mission|Role fit|Healthcare|International|Humility','Why MSF? · why IS Manager? · why leave senior title?',`The role matches much of what I manage today: systems, support, infrastructure, security, integrations, resilience, vendors and people. I want to apply that experience in a humanitarian and international environment. The move is about mission and scope, not title.`],
['How will you adapt without direct humanitarian-field experience?','Listen first|Transferable skills|Field reality|Adaptability|Oman','Humanitarian gap · pressure · multicultural environment',`I would not pretend government healthcare and humanitarian operations are the same. My critical-systems, healthcare, resilience, support, security and leadership experience transfers, but the context must be learned. I would listen to field teams and understand MSF standards before changing anything.`],
['What would you do in your first 90 days and how would you prioritize?','People|Inventory|Criticality|Risk|Quick wins|Roadmap','Competing priorities · incomplete information',`I would start with people and operational needs, then map systems, owners, dependencies, criticality and risks. I would review support, security, recovery, vendors and documentation. Priorities would follow operational impact, urgency, security risk and available workarounds.`],
['Describe your leadership style and delegation approach.','Clear|Supportive|Accountable|Ownership|Check-ins|54/7','Micromanagement · disagreement · key-person dependency',`My style is clear, supportive and accountable. I define outcomes and decision boundaries, delegate real ownership and use planned check-ins instead of micromanagement. Leading 54 people with seven direct reports requires trust, strong managers and knowledge transfer.`],
['How do you manage feedback, poor performance and upward feedback?','SBI|Feedforward|Private|Support|HR process','Difficult feedback · receiving feedback · persistent performance',`I use facts: Situation, Behavior and Impact, then agree what should happen next. I listen to upward feedback without becoming defensive. Performance gaps get clear expectations, support and follow-up; persistent issues use the formal HR process.`],
['How do you handle misconduct, harassment or safeguarding concerns?','Safety|Confidentiality|Safeguarding|No informal investigation|No retaliation','Misconduct · reporting · confidentiality',`I take the report seriously, protect immediate safety and confidentiality, and use the proper safeguarding or HR mechanism. I would not run my own informal investigation or promise absolute secrecy. Good-faith reporters must be protected from retaliation.`],
['How do you manage multicultural teams, conflict and difficult stakeholders?','Listen|Respect|Clarity|Evidence|Diplomacy|Alignment','Technical disagreement · cross-cultural communication',`I use clear language, listen carefully and separate facts from personalities. I welcome professional disagreement and change my decision when stronger evidence supports it. Once a decision is made, I expect professional alignment unless a serious risk still requires escalation.`],
['How would you support a remote field mission with poor connectivity?','Critical services|Local focal point|Backup link|Offline|Simple support','Poor internet · limited skills · field exception',`I identify critical services and continuity options first. I keep support simple with local focal points, clear escalation and practical documentation. Where needed I use backup connectivity, lightweight or offline-capable processes and controlled exceptions.`],
['How do you manage IT service delivery and major incidents?','Incident owner|Impact|Restore first|Communication|RCA|SLA','Support model · recurring incidents · metrics',`I treat support as a managed service with ownership, priorities, escalation and service expectations. In a major incident I confirm impact, assign one owner, restore the safest critical service first and communicate clearly. After recovery I run RCA and track corrective actions.`],
['Tell us about your real DR experience, including RTO, RPO and backups.','Real failover|Alternate DC|Replication|RTO|RPO|Restore test','BC · failed restore · recovery testing',`MedIQ has operated from our alternate disaster-recovery data-center environment. I coordinated application, infrastructure, database, support and operational stakeholders and confirmed safe service availability. DR should connect criticality with RTO, RPO, replication, backups, tested recovery and clear ownership.`],
['How do you approach cybersecurity and sensitive data?','Risk|Least privilege|RBAC|Authentication|Logging|Encryption','Phishing · stolen device · access review',`My role is technology leadership and security governance, not penetration testing or SOC specialization. I focus on risk, least privilege, RBAC, strong authentication, secure integration, logging, patching, encryption where appropriate and recovery. For incidents, contain first, assess exposure and escalate correctly.`],
['What is your experience with Windows Server, identity and access management?','Windows ecosystem|AD concepts|IAM|Least privilege|RBAC|Joiner-mover-leaver','AD · permissions · privileged access',`My experience is strongest at architecture, governance and operational leadership level rather than daily Windows administration. I understand identity lifecycle, role-based access, least privilege, privileged access, authentication and access review. I would first learn MSF's exact Windows and directory architecture before making changes.`],
['What is your Microsoft 365 / Office 365 experience?','M365|Collaboration|Identity|Security|Governance|Learning boundary','Exchange · Teams · SharePoint · Entra',`I use and govern Microsoft enterprise technologies, but I would not claim deep hands-on Microsoft 365 tenant administration without evidence. My approach is to understand the tenant, identity model, security controls, licensing, support and collaboration requirements, then work within MSF standards.`],
['What is your Azure and AWS cloud experience?','Private Cloud|Azure awareness|AWS awareness|Shared responsibility|IAM|DR','Public-cloud gap · AWS model · cloud security',`My direct production experience is mainly Private Cloud and secured data centers, not deep hands-on Azure or AWS administration. The transferable principles are IAM, network security, availability, monitoring, backup, DR, capacity and operational ownership. I understand shared responsibility and would learn MSF's specific cloud architecture rather than overstate my experience.`],
['How would you manage laptops, mobiles and MDM across distributed teams?','MDM|Inventory|Policies|Encryption|Remote wipe|Lifecycle','Lost device · BYOD · patching',`I would manage endpoints as assets through enrollment, ownership, security baseline, patching, encryption, inventory and lifecycle controls. MDM should support policy enforcement, visibility and remote actions such as lock or wipe where appropriate. The design must remain practical for field connectivity.`],
['What do you know about MSF systems such as UniField, eHealth and SITS?','Learn first|UniField|eHealth|SITS|Dependencies|Support','No direct MSF-system experience · integration',`I would not claim direct hands-on experience with MSF-specific platforms. I would learn their workflows, architecture, ownership, support model, integrations and field dependencies. My ERP, healthcare-platform, integration and support background gives me a strong base to learn them quickly.`],
['Tell us about your SAP and complex integration experience.','SAP integration|Bi-directional|Master data|API|Reconciliation|UAT','Dynamics 365 · failed interfaces · ownership',`My SAP experience is integration and architecture, not SAP module configuration. I led the UPA-side bi-directional integration between MedIQ and SAP-based Strategic Medical Warehouses across requirements, mappings, security, UAT, reconciliation and go-live. Integrations need visible, recoverable and owned failures.`],
['Describe your healthcare systems experience, including e-Tendering and e-Pharmacy.','MedIQ|e-Tendering|e-Pharmacy|Inventory|Logistics|Assets','Procurement · dispensing · earlier healthcare systems',`MedIQ covers procurement and e-Tendering, inventory and stocktaking, logistics, e-Pharmacy and dispensing, medical assets, analytics, mobile services and integrations. Earlier I also contributed to healthcare platforms including Yashfeen and the Kasr Al Ainy Liver Tumor Unit system. My role is technology leadership, not clinical practice.`],
['How do you manage application lifecycle, documentation and compliance?','Lifecycle|Owner|Architecture|Runbook|Change|Decommission','Documentation · standards · technical debt',`Every important system should have an owner, lifecycle status, architecture and support documentation, dependencies and change history. I want controlled releases, supportability and periodic review, including when to upgrade or retire a system. Documentation must remain operational, not become a forgotten archive.`],
['How do you manage licensing, vendors, contracts and SLAs?','Licensing|SLA|Acceptance|Escalation|Security|Exit path','Renewals · vendor failure · cost governance',`I define ownership, measurable service expectations, acceptance criteria, security requirements, licensing responsibilities, reporting and escalation. Repeated failure requires corrective action and risk escalation. For critical services I also want renewal visibility and a realistic alternative or exit path.`],
['How do you use monitoring, data and reporting to manage IT?','Availability|Incidents|Backups|Security events|PostgreSQL|BI','KPIs · Power BI · Superset · operational decisions',`I focus on measures that drive action: availability, incident trends, resolution time, backup results, support demand, security events and service performance. I also have data-platform and BI program experience with PostgreSQL, Power BI and Apache Superset. My role is architecture, governance and decision support.`],
['How do you manage resistance, adoption and major technology change?','Listen|Workflow|Training|Feedback|Adoption|Stakeholders','Resistance · training · rollout',`I first understand whether resistance comes from workflow impact, usability, skills, workload, trust or communication. I involve users, provide role-based support, collect feedback and fix genuine process problems. Adoption is an operational outcome, not just training attendance.`],
['Why should we choose you?','Engineering depth|Healthcare|Leadership|DR|Integration|Honest gaps','Closing · strengths · differentiation',`I bring engineering depth, healthcare systems experience, international delivery and enterprise leadership. My strongest evidence includes leading 54 people with seven direct reports, Private Cloud operations, real DR failover, SAP and Dynamics integrations, e-Tendering, e-Pharmacy, support, security governance and vendors. I would bring that breadth while being transparent about the MSF-specific and public-cloud areas I still need to learn.`]
];let V=[...Q],i=0,$=x=>document.querySelector(x);function r(){let x=V[i];$('#m').textContent=`Question ${i+1} of ${V.length}`;$('#q').textContent=x?x[0]:'No matches';$('#kw').innerHTML=x?x[1].split('|').map(k=>`<span class="k">${k}</span>`).join(''):'';$('#f').textContent=x?'Likely follow-ups: '+x[2]:'';$('#a').textContent=x?x[3]:'';$('#a').classList.remove('on');$('#tools').style.display='none';$('#reveal').style.display=x?'block':'none'}function l(){$('#list').innerHTML=V.map((x,j)=>`<details><summary>${j+1}. ${x[0]}</summary><div class="kw">${x[1].split('|').map(k=>`<span class="k">${k}</span>`).join('')}</div><div class="f">Likely follow-ups: ${x[2]}</div><div class="da">${x[3]}</div></details>`).join('')}$('#s').oninput=()=>{let z=$('#s').value.toLowerCase();V=Q.filter(x=>x.join(' ').toLowerCase().includes(z));i=0;r();l()};$('#reveal').onclick=()=>{$('#a').classList.add('on');$('#tools').style.display='block';$('#reveal').style.display='none'};$('#copy').onclick=()=>navigator.clipboard.writeText(V[i][3]);$('#listen').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(V[i][3]);u.rate=.88;u.lang='en-US';speechSynthesis.speak(u)};$('#stop').onclick=()=>speechSynthesis.cancel();$('#prev').onclick=()=>{if(i){i--;r()}};$('#next').onclick=()=>{if(i<V.length-1){i++;r()}};$('#cards').onclick=()=>{$('#card').classList.remove('off');$('#list').classList.remove('on')};$('#all').onclick=()=>{$('#card').classList.add('off');$('#list').classList.add('on')};r();l();</script></body></html>
