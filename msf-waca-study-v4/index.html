<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSF WaCA — 40 Flashcards</title><style>*{box-sizing:border-box}body{font:17px/1.6 system-ui;margin:0;background:#fffaf2;color:#17324a}.w{max-width:820px;margin:auto;padding:18px}.hero,.card{background:#fff;border:2px solid #17324a;border-radius:22px;padding:22px;margin-bottom:14px}.hero h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.05;margin:.3em 0}.bar{height:14px;background:#e7edf0;border-radius:99px;overflow:hidden;border:1px solid #17324a}.bar i{display:block;height:100%;background:#9dddb2;width:0;transition:.25s}.meta{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin:10px 0}.qno{font-size:.9rem;font-weight:900;color:#52697a}.question{font-size:clamp(1.35rem,5vw,2rem);line-height:1.25;margin:8px 0 16px}.keys{margin:10px 0}.k{display:inline-block;border:2px solid #17324a;border-radius:12px;padding:5px 8px;margin:3px;background:#d9f4e2;font-size:.78rem;font-weight:800}.answer{display:none;margin-top:18px;padding-top:16px;border-top:1px dashed #789;white-space:pre-line;font-size:1.03rem}.answer.show{display:block}.answer-tools{display:none;margin-top:10px}.answer-tools.show{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{border:2px solid #17324a;border-radius:14px;padding:13px 10px;background:#fff;font:inherit;font-weight:900;color:#17324a;cursor:pointer}.reveal{background:#ffe68a}.copy{background:#dcecff;width:100%}.done{background:#bceac9}.done.completed{background:#17324a;color:#fff}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.reset{margin-top:12px;width:100%;background:#fff}.priority{display:inline-block;background:#ffd6cf;border:2px solid #17324a;border-radius:10px;padding:3px 8px;font-size:.75rem;font-weight:900}</style></head><body><main class="w"><section class="hero"><h1>MSF WaCA · Flashcards</h1><div class="meta"><span id="count">0 / 40 Done</span><span id="pct">0%</span></div><div class="bar"><i id="progress"></i></div></section><section class="card"><div class="qno" id="qno"></div><h2 class="question" id="question"></h2><div id="priority"></div><div class="keys" id="keys"></div><button class="reveal" id="reveal">Show Answer</button><div class="answer" id="answer"></div><div class="answer-tools" id="answerTools"><button class="copy" id="copy">Copy Answer</button></div><div class="actions"><button class="done" id="done">Done ✓</button><button id="next">Next →</button></div><div class="nav"><button id="prev">← Previous</button><button id="random">Random</button></div></section><button class="reset" id="reset">Reset Progress</button></main><script>const Q=[["Tell us about yourself.","18+ years|54 people|7 directs|Healthcare IT|Oman|Private Cloud|Real DR","I have more than 18 years of experience in information systems and digital transformation. I started as a software engineer and moved into architecture, project delivery and technology leadership. I also worked for more than four years in Oman on national education systems.\n\nToday, I am Head of Information Systems and Digital Transformation at the Egyptian Authority for Unified Procurement. I lead a technology team of 54 people, with seven direct reports. My scope includes applications, IT support, Private Cloud infrastructure, security, integrations, data, quality, vendors and business continuity.\n\nI have strong healthcare technology experience through MedIQ. This includes procurement, e-Tendering, inventory, logistics, e-Pharmacy, medical assets, analytics, SAP integration and Microsoft Dynamics 365 integration. I also have real disaster recovery experience, where MedIQ operated from our backup data-center environment.\n\nFor me, technology is a service. It must be reliable, secure, well supported and easy for people to use. I am also honest about what I still need to learn. I have not worked directly with MSF before, so I would first listen, understand the field needs and MSF systems, and then use my experience to support the team."],["Why MSF WaCA, this role, and this move?","Mission|Role fit|Healthcare|International|Not title","This role is very close to what I manage today: systems, support, infrastructure, security, integrations, business continuity, vendors and teams. I also have a personal connection to MSF because my wife works with MSF in Egypt. Through her experience, I became more familiar with MSF, its humanitarian mission and its principles, and I developed real respect for the organization and the way it works. So for me, this opportunity brings together two things: my professional experience and an organization whose mission and values I genuinely respect. This move is about the mission and the work, not the job title."],["What do you know about the history of MSF?","1971|Paris|Biafra|Doctors & journalists|Nobel 1999","MSF was founded in Paris in 1971 by doctors and journalists after the war and famine in Biafra, Nigeria. They wanted an independent organization that could provide emergency medical help quickly and without discrimination. MSF started with about 300 volunteers. Over time, it grew into a global medical humanitarian movement. In 1999, MSF received the Nobel Peace Prize."],["What are the main MSF principles?","Impartiality|Independence|Neutrality|Medical ethics|Speaking out","The three core MSF principles are impartiality, independence and neutrality, together with strong medical ethics. Impartiality means helping people based on need, without discrimination. Independence means decisions are based on medical and humanitarian needs, not political, economic or religious interests. Neutrality means MSF does not take sides in a conflict. Medical ethics means putting patients first, protecting confidentiality and doing no harm. MSF may also speak out when its teams witness serious suffering or barriers to medical care."],["What do you know about MSF WaCA?","West & Central Africa|Operational association|Proximity|Innovation|Digital transformation","MSF WaCA means West and Central Africa. It is an operational association within the MSF movement, created to strengthen leadership and decision-making from West and Central Africa. Its approach focuses on being close to patients and communities, inclusion, innovation and digital transformation. For me, this is important because the Information Systems Manager role directly supports reliable and secure operations in that mission."],["What do you know about MSF and its work?","Medical humanitarian work|Emergency care|Independent|Need|Speaking out","MSF is an international medical humanitarian organization. It provides medical care to people affected by conflict, disasters, disease outbreaks and other crises. It works based on people's needs and aims to stay independent from political, economic and religious interests. MSF can also speak out when its teams witness serious suffering or barriers to medical care."],["How will you adapt without direct humanitarian experience?","Transferable|Listen first|Field reality|Oman","I know that government healthcare and humanitarian work are different. But many skills are transferable, such as running critical systems, support, security, disaster recovery, integrations and team leadership. I also worked internationally in Oman. I would listen first, learn how MSF works in the field and then apply my experience in the right way."],["Why should we choose you?","Engineering|Healthcare|Leadership|DR|Integration|Honest gaps","I bring a strong mix of technical experience, healthcare systems, international work and team leadership. I lead 54 people with seven direct reports, and I have experience with Private Cloud, real disaster recovery, complex integrations, healthcare platforms, security, IT support and vendors. I am also honest about what I still need to learn, including MSF-specific systems and deeper public-cloud administration."],["What are your main strengths for this role?","Leadership|Healthcare IT|Critical systems|DR|Integrations|Learning","My main strengths are technology leadership, healthcare systems and running critical services. I lead a large technology team and have real experience with disaster recovery, integrations, IT support, security and vendors. I also learn quickly and I am honest when I need to build deeper knowledge in a new area."],["What is one area you need to improve?","MSF systems|Public cloud|Honest|Learn quickly","One area I want to develop is deeper hands-on knowledge of MSF-specific systems and public-cloud administration. My main production background is Private Cloud and secured data centers. I already understand the main principles, and I would learn the MSF tools and environment quickly with the team."],["Describe your leadership and delegation style.","I Ensure|I Involve|I Develop|Ownership|Check-ins","My leadership style is clear and supportive. I set the direction and standards, involve the right people and help them grow. When I delegate, I explain the expected result and who can make which decisions. Then I follow up at agreed times without micromanaging."],["How do you manage multiple priorities and pressure?","Impact|Urgency|Risk|Critical services|Communication","I prioritize work by impact, urgency and risk. Critical services come first. I give each issue a clear owner and communicate what we are doing and why. Under pressure, I stay calm, keep the work structured and restore the safest critical service first."],["Tell us about a difficult situation or failure and what you learned.","STAR|Critical service|Ownership|Communication|RCA|Learning","One difficult situation was when a critical service needed recovery and several technical teams had to work together under pressure. My role was to keep ownership clear, coordinate the application, infrastructure, database and support teams, and keep stakeholders informed. We restored the service safely, then reviewed the root cause and corrective actions. The main lesson for me was that clear ownership, communication and tested recovery procedures are as important as the technology itself."],["How do you manage the MSF feedback and development cycle?","Direction Setting|Continuous Feedback|Feedforward|Reflection|Check-ins","I start by setting a few clear priorities. Then I have regular check-ins and give feedback about what happened and feedforward about what we can do better next time. At the end of the cycle, we review results, lessons learned and development needs. The employee should always know how they are doing and what they need to improve."],["How do you give feedback, manage poor performance and receive upward feedback?","SBI|Private|Feedforward|Support|Upward feedback|HR","I give feedback in private and focus on the situation, the person’s behavior and its impact. Then we agree on what should change next. If performance is weak, I set clear expectations, provide support and follow up. If the problem continues, I use the formal HR process. I also listen to feedback from my team and use it to improve my own management."],["What if someone reports harassment, misconduct or safeguarding concerns?","Safety|Confidentiality|Safeguarding|No punishment|Formal channel","I listen carefully and first check if anyone is in immediate danger. I keep the information confidential and use the correct safeguarding or HR process. I do not investigate the case by myself, and I do not promise complete secrecy because I may need to report it to the right people. Anyone who reports a concern in good faith should not be punished for speaking up."],["How do you manage multicultural teams, conflict and key-person dependency?","Respect|Evidence|Documentation|Cross-training|Handover","I communicate clearly, listen and make sure everyone understands. I respect different cultures, but I keep work expectations clear and fair. If there is a disagreement, I focus on facts and possible solutions. I also use documentation, handover and cross-training so important knowledge is not held by only one person."],["What would you do in your first 90 days?","People|Inventory|Criticality|Risk|Quick wins|Roadmap","First, I would understand the people, operations and critical systems. I would map system owners, dependencies and main risks. Then I would review incidents, access, security, backups, recovery, vendors and documentation. After that, I would fix urgent issues, identify quick wins and agree on a clear roadmap."],["How do you manage IT governance, risk and system ownership?","Governance|Risk register|Owners|Standards|Exceptions|Roadmap","Every critical system should have a clear business owner and technical owner. We should know its risks, dependencies and who can make decisions. I keep a risk register and roadmap, follow agreed standards and document any important exception."],["How do you manage IT service delivery and a major incident?","Incident owner|Restore first|Communication|RCA|SLA","I manage support with clear priorities, ownership, escalation and service targets. During a major incident, I confirm the impact, assign one incident owner and restore the safest critical service first. I keep users and management informed. After recovery, I find the root cause and make sure corrective actions are completed."],["How do you manage change versus incident versus problem management?","Incident|Problem|Change|Restore|Root cause|Controlled release","Incident management is about restoring the service quickly. Problem management is about finding and fixing the root cause so the issue does not keep happening. Change management is about making system changes safely through review, approval, testing, communication and a rollback plan."],["Tell us about your real DR experience, RTO, RPO and backups.","Real failover|Alternate DC|RTO|RPO|Replication|Restore test","I have real disaster recovery experience with MedIQ. The system has operated from our alternate data-center environment. I coordinated the application, infrastructure, database, support and business teams. I connect each critical service to its RTO and RPO, then make sure replication, backups, recovery tests, ownership and communication support those targets."],["Explain the 3-2-1 rule, immutable backup and a failed backup scenario.","3-2-1|Immutable|Offsite|Restore test|Escalation","The 3-2-1 rule means keeping three copies of the data, on two different types of storage, with one copy offsite or isolated. An immutable or offline backup helps protect against ransomware. If a backup fails, I escalate it, understand the risk, fix the backup process, confirm the next backup works and test that we can restore the data."],["How do you approach cybersecurity and sensitive humanitarian data?","Risk|Least privilege|RBAC|MFA|Logging|Need-to-know","My role is technology leadership and security governance, not penetration testing. I focus on practical controls such as least privilege, role-based access, MFA, secure integrations, logging, patching, encryption, backups and recovery. Sensitive information should only be available to people who really need it for their work."],["What would you do after phishing, ransomware or a lost device?","Contain|Revoke|Isolate|Logs|Escalate|Recover","First, I contain the incident. I secure the user account and sessions and isolate affected devices if needed. Then I check what was affected, review the available logs, report the incident through the correct process and recover safely. Finally, I fix the root cause and improve the controls to reduce the chance of it happening again."],["How would you support a remote mission with poor connectivity?","Critical services|Local focal point|Backup link|Offline","First, I identify the most critical services and what must keep working. I use simple support procedures, local IT contacts and clear escalation. For connectivity, I protect important traffic and use backup connections when possible. I also use lightweight or offline options when they make sense."],["How do you manage an IT project from requirements to handover?","Scope|Stakeholders|Risk|UAT|Pilot|Handover","I start with the business goal, scope, stakeholders, risks and clear acceptance criteria. I control changes and involve users in User Acceptance Testing. If useful, I start with a pilot. Before go-live, I prepare support, documentation and training. After go-live, I complete the handover and review lessons learned."],["Tell us about your integrations and healthcare systems experience.","SAP|Dynamics|MedIQ|e-Tendering|e-Pharmacy|Reconciliation","I have strong experience with healthcare systems and integrations. I led the UPA side of the two-way integration between MedIQ and SAP-based Strategic Medical Warehouses. I also work with Microsoft Dynamics 365 integration. MedIQ covers e-Tendering, inventory, logistics, e-Pharmacy, medical assets, analytics and mobile services. My SAP role is integration and architecture, not SAP module configuration."],["What do you know about SITS, UniField and eHealth?","SITS|UniField|eHealth|Learn first|Support model","I have not worked directly with MSF systems such as SITS, UniField or eHealth, so I would not pretend that I have. I would learn what each system does, who owns it, how it is supported and what other systems it depends on. My experience with healthcare systems, ERP, integrations and IT support gives me a good base to learn them quickly."],["What is your Microsoft 365 and Entra ID approach?","M365|Entra ID|MFA|Conditional Access|JML|Least privilege","I see identity as an important security control. I focus on correct access when people join, move roles or leave, together with least privilege, MFA, access reviews and Conditional Access. I understand Microsoft 365 and Entra ID governance and support, but I do not claim to be a daily tenant administrator."],["How would you investigate a suspicious Microsoft 365 login?","Sign-in logs|Location|Device|MFA|Revoke sessions|Risk","I would check the sign-in logs, user, location, device, MFA status and related activity. If I think the account is compromised, I would revoke active sessions, secure the account, check what the attacker may have accessed and follow the security incident process."],["What is your experience with Windows Server and Active Directory?","Windows Server|AD|GPO|DNS|DHCP|Private Cloud","My strongest production experience is managing enterprise infrastructure and Private Cloud environments that support critical systems. I understand Windows Server and Active Directory, including users and access, Group Policy, DNS, DHCP, patching, monitoring, availability and recovery. I am also clear that I have not been a daily Active Directory administrator in my current role."],["How would you troubleshoot AD login or GPO problems?","Account|DNS|DC|OU|Inheritance|gpresult","For a login problem, I would check the user account, lockout status, password, network connection, DNS and domain controller availability. For a Group Policy problem, I would check the correct OU, inheritance, filtering and replication. Then I would use tools such as gpresult or gpupdate to confirm what policy is being applied."],["How would you manage MDM, BYOD and a stolen device?","MDM|BYOD|Inventory|Compliance|Encryption|Remote wipe","I would keep a clear device inventory and define simple rules for managed devices and BYOD. Devices should be encrypted, patched and have only the access they need. If a device is stolen, I would block access, revoke active sessions, remotely lock or wipe it when possible, check what data may be exposed and report the incident."],["What is your Azure and AWS cloud experience?","Private Cloud|Azure|AWS|Shared Responsibility|IAM","My direct production experience is mainly with Private Cloud and secured data centers. I do not claim deep hands-on Azure or AWS administration. However, the main principles are familiar to me: identity and access, network security, availability, monitoring, backup, disaster recovery and operational ownership. I would learn the specific MSF cloud setup and tools quickly."],["How do you manage application lifecycle, technical debt and rationalization?","Lifecycle|EOL|Technical debt|Rationalization|Roadmap","For every critical application, I want to know the owner, support status, dependencies and future plan. If a system is unsupported, insecure, duplicated or no longer useful, we need a clear decision about it. I prioritize technical debt based on business and security risk and remove unnecessary applications when possible."],["How do you manage documentation, policies and compliance?","Architecture|Permissions|Recovery|Processes|Evidence","Documentation should be practical and easy to use. For critical systems, I document the architecture, owners, dependencies, access, configuration, integrations, backup and recovery and support contacts. Policies explain what must be done, while procedures explain how to do it. I also update documentation after major changes."],["How do you manage licensing, vendors, support contracts and SLAs?","Licensing|SLA|Vendor|Renewal|Security|Exit path","I track licenses, support contracts, renewal dates, service targets, security requirements and escalation contacts. I review vendor performance and act when service is repeatedly below the agreed level. For critical systems, I also want a backup option or exit plan if the vendor cannot continue to support us."],["What do MSF principles mean to you as an IS Manager?","Impartiality|Neutrality|Independence|Medical ethics|Mission","IT must support the medical and humanitarian mission. I would respect MSF principles, protect sensitive information and make technology decisions based on real operational needs. Technology should help the mission, not make the work more difficult."],["Do you have any questions for us?","Priorities|Team|Field operations|First 6 months","Yes. I would like to understand the main priorities for the Information Systems Manager during the first six months. I would also like to know more about the team structure and the main challenges they are facing today. Finally, I would like to understand how the WaCA information systems team works with field operations and the wider MSF movement."]];let i=+(localStorage.msfCardIndex||0);if(i<0||i>=Q.length)i=0;let done=new Set(JSON.parse(localStorage.msfDone||'[]'));const $=id=>document.getElementById(id);function save(){localStorage.msfCardIndex=i;localStorage.msfDone=JSON.stringify([...done])}function stats(){let n=done.size,p=Math.round(n/Q.length*100);$('count').textContent=`${n} / ${Q.length} Done`;$('pct').textContent=p+'%';$('progress').style.width=p+'%'}function render(){let q=Q[i];$('qno').textContent=`Question ${i+1} of ${Q.length}`;$('question').textContent=q[0];$('keys').innerHTML=q[1].split('|').map(k=>`<span class="k">${k}</span>`).join('');$('priority').innerHTML=i<15?'<span class="priority">PRIORITY</span>':'';$('answer').textContent=q[2];$('answer').classList.remove('show');$('answerTools').classList.remove('show');$('reveal').textContent='Show Answer';$('copy').textContent='Copy Answer';$('done').classList.toggle('completed',done.has(i));stats();save();scrollTo({top:0,behavior:'smooth'})}$('reveal').onclick=()=>{let a=$('answer'),show=!a.classList.contains('show');a.classList.toggle('show');$('answerTools').classList.toggle('show',show);$('reveal').textContent=show?'Hide Answer':'Show Answer'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(Q[i][2]);$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy Answer',1200)}catch(e){let t=document.createElement('textarea');t.value=Q[i][2];document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy Answer',1200)}};$('done').onclick=()=>{done.has(i)?done.delete(i):done.add(i);save();render()};$('next').onclick=()=>{i=(i+1)%Q.length;render()};$('prev').onclick=()=>{i=(i-1+Q.length)%Q.length;render()};$('random').onclick=()=>{i=Math.floor(Math.random()*Q.length);render()};$('reset').onclick=()=>{if(confirm('Reset all Done progress?')){done.clear();i=0;save();render()}};render();</script></body></html>
