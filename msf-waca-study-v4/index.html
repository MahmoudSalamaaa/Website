<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSF WaCA Final Review</title><style>body{font:17px/1.6 system-ui;margin:0;background:#fffaf2;color:#17324a}.w{max-width:1000px;margin:auto;padding:22px}.hero,.q{background:#fff;border:2px solid #17324a;border-radius:20px;padding:22px;margin-bottom:14px}.chip,.k{display:inline-block;border:2px solid #17324a;border-radius:12px;padding:6px 9px;margin:3px;font-weight:800}.chip{background:#ffe68a}.k{background:#d9f4e2;font-size:.82rem}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.05}details summary{font-weight:850;font-size:1.08rem;cursor:pointer}.a{margin-top:12px;padding-top:12px;border-top:1px dashed #789;white-space:pre-line}.f{color:#52697a;font-size:.9rem;margin-top:8px}</style></head><body><main class="w"><section class="hero"><span class="chip">FINAL · Minimum Complete Set</span><h1>MSF WaCA · 25 Core Questions</h1><p>Q1 detailed. Q2–Q25 concise. Management, MSF field context, Microsoft stack, MDM, lifecycle, security, DR, integrations and healthcare evidence are all covered.</p></section><div id="x"></div></main><script>const Q=[
['Tell us about yourself.','18+ years|54 people|7 directs|Healthcare IT|Oman|Private Cloud|Real DR',`I am an information systems and digital transformation leader with more than 18 years of experience across healthcare, government, education and enterprise technology. I started in software engineering and progressed through architecture, delivery, program leadership and enterprise technology management. I also spent more than four years working in Oman on national education digital platforms.

Today I am Head of the Central Administration for Information Systems and Digital Transformation at the Egyptian Authority for Unified Procurement. I lead a 54-person technology organization with seven direct reports, covering applications, technical support, Private Cloud infrastructure, security governance, integrations, data, quality, vendors and business continuity.

My healthcare technology experience includes MedIQ, procurement and e-Tendering, inventory and logistics, e-Pharmacy and dispensing, medical assets, analytics, SAP-based Strategic Medical Warehouse integration and Microsoft Dynamics 365 integration. I also have direct experience with a real MedIQ disaster-recovery failover to an alternate data-center environment.

I see technology as an operational service: reliability, support, ownership, security, resilience, documentation and adoption matter as much as technical design. I am also transparent about what is new for me. I do not claim direct MSF humanitarian-field experience or deep hands-on public-cloud administration. I would listen first, understand WaCA operations and systems, and then apply my experience carefully.`],
['Why MSF WaCA, this role, and this move?','Mission|Role fit|Healthcare|International|Not title','The role matches systems, support, infrastructure, security, integrations, resilience, vendors and people that I manage today. I want to apply that experience in an international humanitarian environment. The move is about mission and scope, not title.'],
['How will you adapt without direct humanitarian experience?','Transferable|Listen first|Field reality|Oman','I would not pretend government healthcare and humanitarian operations are the same. Critical systems, resilience, support, security, integration and leadership are transferable, and I have more than four years of international delivery in Oman. I would learn MSF field reality and standards first.'],
['What would you do in your first 90 days and how would you prioritize?','People|Inventory|Criticality|Risk|Quick wins','I would start with people and operations, map systems, owners, dependencies and risks, then review incidents, access, security, recovery, vendors and documentation. Priorities follow operational impact, urgency and risk. Then I would deliver safe quick wins and agree a roadmap.'],
['Describe your leadership style and delegation approach.','Clear|Supportive|Accountable|Ownership|Check-ins','My style is clear, supportive and accountable. I define outcomes and decision boundaries, delegate real ownership, remove blockers and use planned check-ins rather than micromanagement. Leading 54 people with seven direct reports requires trust in managers and specialists.'],
['How do you manage feedback, poor performance and upward feedback?','SBI|Feedforward|Private|Support|HR','I use Situation, Behavior and Impact, then agree what should happen next. Performance gaps get clear expectations, support and follow-up; persistent problems use the formal HR process. I also expect upward feedback and listen without becoming defensive.'],
['What if someone reports harassment, misconduct or safeguarding concerns?','Safety|Confidentiality|Safeguarding|No retaliation','I listen carefully, consider immediate safety, protect confidentiality and use the proper safeguarding or HR mechanism. I do not run my own informal investigation or promise absolute secrecy. Good-faith reporting must be protected from retaliation.'],
['How do you manage multicultural teams, disagreement and key-person dependency?','Respect|Evidence|Documentation|Cross-training','I use clear communication and check understanding while keeping expectations consistent. Professional disagreement is welcome when it brings evidence and alternatives. I reduce key-person risk through documentation, shared ownership, handovers and cross-training.'],
['How would you support a remote mission with poor connectivity?','Critical services|Local focal point|Backup link|Offline','I identify critical services and continuity options first. I keep support simple with local focal points, clear escalation and practical documentation. I protect critical traffic and use backup connectivity or lightweight and offline-capable processes where practical.'],
['How do you manage IT service delivery and a major incident?','Incident owner|Restore first|Communication|RCA|SLA','I manage support with clear ownership, priorities, escalation and service expectations. During a major incident I confirm impact, assign one owner, restore the safest critical service first and communicate clearly. After recovery I run root-cause analysis and track corrective actions.'],
['Tell us about your real DR experience, including RTO, RPO and backups.','Real failover|Alternate DC|RTO|RPO|Replication','MedIQ has actually operated from our alternate DR data-center environment. I coordinated application, infrastructure, database, support and operational stakeholders. My approach connects business criticality to RTO, RPO, replication, backups, tested recovery, ownership and communication.'],
['How do you approach cybersecurity and sensitive data?','Risk|Least privilege|RBAC|Authentication|Logging','My role is technology leadership and security governance, not penetration testing or SOC specialization. I focus on risk, least privilege, RBAC, strong authentication, secure integration, logging, monitoring, patching, encryption where appropriate and recovery.'],
['What is your experience with Windows Server and enterprise infrastructure?','Windows Server|Private Cloud|Monitoring|Patching|Recovery','My strongest production experience is enterprise infrastructure and Private Cloud supporting critical systems. I understand Windows Server operational requirements such as secure configuration, access, patching, monitoring, availability and recovery. I separate leadership responsibility from tasks I did not personally administer day to day.'],
['What is your Microsoft 365 / O365 experience?','M365|O365|Identity|Collaboration|Governance','I understand the governance, identity, access, collaboration, security and support concerns around Microsoft 365. I would not overstate deep tenant-administration work unless supported by my direct evidence. I can manage the service and specialists while building MSF-specific administration depth.'],
['What is your Azure and AWS cloud experience?','Private Cloud|Azure|AWS|Shared responsibility','My direct production baseline is mainly Private Cloud and secured data centers, not deep hands-on public-cloud administration. The transferable principles include IAM, network security, availability, monitoring, backup, DR and operational ownership. I would learn MSF Azure and AWS architecture and standards rather than overstate my experience.'],
['How would you manage Mobile Device Management?','MDM|Enrollment|Compliance|Encryption|Remote wipe','I would use clear enrollment, configuration and compliance policies, least-privilege access, encryption, patching and device inventory. Lost or compromised devices need rapid containment and remote actions where supported. I would first learn MSF chosen MDM platform and policies.'],
['What do you know about SITS, UniField and eHealth?','SITS|UniField|eHealth|Learn first','I would not claim direct hands-on MSF platform experience. I would learn each system workflow, architecture, ownership, support model and dependencies, including how local systems align with global SITS platforms. My ERP, healthcare, integration and support background gives me a strong base.'],
['How do you manage system lifecycle, documentation, processes and compliance?','Lifecycle|Documentation|Upgrade|EOL|Compliance','Every critical system should have an owner, documentation, dependencies, support status and lifecycle plan. I review upgrades, end-of-life risk, security, continuity and business value, then maintain usable policies, procedures and evidence. Documentation must work during support and recovery, not only audits.'],
['How do you manage licensing, support contracts, vendors and SLAs?','Licensing|SLA|Vendor|Renewal|Exit path','I track ownership, license and support status, renewal risk, measurable service expectations, security requirements and escalation. Repeated vendor failure requires corrective action and risk escalation. For critical systems I also want a realistic alternative or exit path.'],
['Tell us about your SAP and complex integration experience.','SAP|Bi-directional|Master data|API|UAT|Reconciliation','My SAP experience is integration and architecture, not SAP module configuration. I led the UPA-side bi-directional integration between MedIQ and SAP-based Strategic Medical Warehouses, including requirements, master-data mapping, security, UAT, reconciliation and go-live.'],
['Describe your healthcare systems experience, including e-Tendering and e-Pharmacy.','MedIQ|e-Tendering|e-Pharmacy|Inventory|Logistics','MedIQ covers procurement and e-Tendering, inventory and stocktaking, logistics, e-Pharmacy and dispensing, medical assets, analytics, mobile services and integrations. Earlier I also contributed to Yashfeen and the Kasr Al Ainy Liver Tumor Unit system. My role is technology leadership, not clinical practice.'],
['How do you use data, monitoring and reporting to manage systems?','Availability|Incidents|Backup|Security events|BI','I focus on measures that drive action: availability, incidents, resolution time, backup results, support demand, security events and service performance. I also have data-platform and BI program experience with PostgreSQL, Power BI and Apache Superset.'],
['How do you manage resistance, training and adoption?','Listen|Workflow|Training|Feedback|Adoption','I first understand whether resistance comes from workflow, usability, skills, workload, trust or communication. I involve users, provide role-based training and support, collect feedback and fix genuine problems. Adoption is an operational outcome, not an attendance number.'],
['How do you make difficult decisions with incomplete information or urgent exceptions?','Risk|Reversible|Assumptions|Compensating controls','I separate what is known, uncertain and time-critical. I prefer the safest reversible decision and update it when better information arrives. If an urgent exception is necessary, I preserve essential controls through approval, compensating controls, ownership and a review point.'],
['Why should we choose you?','Engineering|Healthcare|Leadership|DR|Integration|Honest gaps','I bring engineering depth, healthcare systems experience, international delivery and enterprise leadership. My strongest evidence includes leading 54 people with seven direct reports, Private Cloud, real DR failover, SAP and Dynamics integrations, e-Tendering, e-Pharmacy, security governance, support and vendors. I also stay transparent about MSF-specific systems and public-cloud depth that I still need to learn.']
];document.querySelector('#x').innerHTML=Q.map((q,i)=>`<details class="q" ${i===0?'open':''}><summary>${i+1}. ${q[0]}</summary><div>${q[1].split('|').map(k=>`<span class="k">${k}</span>`).join('')}</div><div class="a">${q[2]}</div></details>`).join('');</script></body></html>
