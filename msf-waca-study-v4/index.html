<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSF WaCA — 32 Flashcards</title><style>*{box-sizing:border-box}body{font:17px/1.6 system-ui;margin:0;background:#fffaf2;color:#17324a}.w{max-width:820px;margin:auto;padding:18px}.hero,.card{background:#fff;border:2px solid #17324a;border-radius:22px;padding:22px;margin-bottom:14px}.hero h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.05;margin:.3em 0}.bar{height:14px;background:#e7edf0;border-radius:99px;overflow:hidden;border:1px solid #17324a}.bar i{display:block;height:100%;background:#9dddb2;width:0;transition:.25s}.meta{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin:10px 0}.qno{font-size:.9rem;font-weight:900;color:#52697a}.question{font-size:clamp(1.35rem,5vw,2rem);line-height:1.25;margin:8px 0 16px}.keys{margin:10px 0}.k{display:inline-block;border:2px solid #17324a;border-radius:12px;padding:5px 8px;margin:3px;background:#d9f4e2;font-size:.78rem;font-weight:800}.answer{display:none;margin-top:18px;padding-top:16px;border-top:1px dashed #789;white-space:pre-line;font-size:1.03rem}.answer.show{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{border:2px solid #17324a;border-radius:14px;padding:13px 10px;background:#fff;font:inherit;font-weight:900;color:#17324a;cursor:pointer}.reveal{background:#ffe68a}.done{background:#bceac9}.done.completed{background:#17324a;color:#fff}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.small{font-size:.88rem;color:#52697a}.reset{margin-top:12px;width:100%;background:#fff}.finished{text-align:center;padding:20px 0}.finished b{font-size:2rem}.priority{display:inline-block;background:#ffd6cf;border:2px solid #17324a;border-radius:10px;padding:3px 8px;font-size:.75rem;font-weight:900}</style></head><body><main class="w"><section class="hero"><h1>MSF WaCA · Flashcards</h1><p>سؤال واحد في كل مرة. اقرأ السؤال، جاوب بصوتك، ثم افتح الإجابة. اضغط <b>Done ✓</b> عندما تكون قادرًا على الإجابة. التقدم محفوظ على نفس الجهاز.</p><div class="meta"><span id="count">0 / 32 Done</span><span id="pct">0%</span></div><div class="bar"><i id="progress"></i></div></section><section class="card" id="card"><div class="qno" id="qno"></div><h2 class="question" id="question"></h2><div id="priority"></div><div class="keys" id="keys"></div><button class="reveal" id="reveal">Show Answer</button><div class="answer" id="answer"></div><div class="actions"><button class="done" id="done">Done ✓</button><button id="next">Next →</button></div><div class="nav"><button id="prev">← Previous</button><button id="random">Random</button></div></section><button class="reset" id="reset">Reset Progress</button></main><script>const Q=[['Tell us about yourself.','18+ years|54 people|7 directs|Healthcare IT|Oman|Private Cloud|Real DR',`I am an information systems and digital transformation leader with more than 18 years of experience across healthcare, government, education and enterprise technology. I started in software engineering and progressed through architecture, delivery, program leadership and enterprise technology management. I also spent more than four years working in Oman on national education digital platforms.\n\nToday I am Head of the Central Administration for Information Systems and Digital Transformation at the Egyptian Authority for Unified Procurement. I lead a 54-person technology organization with seven direct reports, covering applications, technical support, Private Cloud infrastructure, security governance, integrations, data, quality, vendors and business continuity.\n\nMy healthcare technology experience includes MedIQ, procurement and e-Tendering, inventory and logistics, e-Pharmacy and dispensing, medical assets, analytics, SAP-based Strategic Medical Warehouse integration and Microsoft Dynamics 365 integration. I also have direct experience with a real MedIQ disaster-recovery failover to an alternate data-center environment.\n\nI see technology as an operational service: reliability, support, ownership, security, resilience, documentation and adoption matter as much as technical design. I am transparent about what is new for me. I do not claim direct MSF humanitarian-field experience or deep hands-on public-cloud administration. I would listen first, understand WaCA operations and systems, and then apply my experience carefully.`],['Why MSF WaCA, this role, and this move?','Mission|Role fit|Healthcare|International|Not title','The role matches systems, support, infrastructure, security, integrations, resilience, vendors and people that I manage today. I want to apply that experience in an international humanitarian environment. The move is about mission and scope, not title.'],['What do MSF principles mean to you as an IS Manager?','Impartiality|Neutrality|Independence|Medical ethics|Mission','Technology must support the humanitarian medical mission. I would respect impartiality, neutrality and independence, protect sensitive information, and make technology decisions around operational and medical-support needs rather than technology for its own sake.'],['How will you adapt without direct humanitarian experience?','Transferable|Listen first|Field reality|Oman','I would not pretend government healthcare and humanitarian operations are the same. Critical systems, resilience, support, security, integration and leadership are transferable, and I have more than four years of international delivery in Oman. I would learn MSF field reality and standards first.'],['What would you do in your first 90 days?','People|Inventory|Criticality|Risk|Quick wins|Roadmap','I would start with people and operations, map systems, owners, dependencies and risks, then review incidents, access, security, recovery, vendors and documentation. I would prioritize by operational impact, urgency and risk, deliver safe quick wins and agree a roadmap.'],['How do you manage multiple priorities and pressure?','Impact|Urgency|Risk|Critical services|Communication','I separate critical operational issues from important but deferrable work. I prioritize by impact, urgency, security and dependency, assign clear ownership and communicate trade-offs. Under pressure I stay structured and restore the most critical safe service first.'],['Describe your leadership and delegation style.','I Ensure|I Involve|I Develop|Ownership|Check-ins','My style is clear, supportive and accountable: I ensure direction and standards, involve the right people and develop ownership and capability. I define outcomes and decision boundaries, remove blockers and use planned check-ins rather than micromanagement.'],['How do you manage the MSF feedback and development cycle?','Direction Setting|Continuous Feedback|Feedforward|Reflection|Check-ins','I set a small number of clear priorities early, then use regular check-ins and continuous feedback and feedforward rather than waiting for an annual review. At the end of the cycle I reflect on results, learning and development needs. The process should create clarity and growth, not surprises.'],['How do you give feedback, manage poor performance and receive upward feedback?','SBI|Private|Feedforward|Support|Upward feedback|HR','I use Situation, Behavior and Impact in private, then agree what should happen next. Performance gaps get clear expectations, support and follow-up; persistent problems use the formal HR process. I also actively receive upward feedback without becoming defensive.'],['What if someone reports harassment, misconduct or safeguarding concerns?','Safety|Confidentiality|Safeguarding|No retaliation|Formal channel','I listen carefully, consider immediate safety, protect confidentiality and use the proper safeguarding or HR mechanism. I do not run my own informal investigation or promise absolute secrecy. Good-faith reporting must be protected from retaliation.'],['How do you manage multicultural teams, conflict and key-person dependency?','Respect|Evidence|Documentation|Cross-training|Handover','I communicate clearly and check understanding while keeping expectations consistent. I welcome professional disagreement supported by evidence and alternatives. I reduce key-person risk through documentation, shared ownership, handovers and cross-training.'],['How do you manage IT governance, risk and system ownership?','Governance|Risk register|Owners|Standards|Exceptions|Roadmap','Every critical service should have clear business and technical ownership, known risks, dependencies and decision rights. I maintain a risk register and roadmap, use standards as the default and document justified exceptions and compensating controls.'],['How do you manage an IT project from requirements to handover?','Scope|Stakeholders|Risk|UAT|Pilot|Handover','I define outcome, scope, stakeholders, risks, dependencies and acceptance criteria first. I control changes, involve users in UAT, use a pilot where useful, prepare deployment and support, then complete documentation, training, handover and lessons learned.'],['How do you manage change versus incident versus problem management?','Incident|Problem|Change|Restore|Root cause|Controlled release','An incident is about restoring service quickly. Problem management finds and removes the underlying cause of recurring incidents. Change management introduces modifications in a controlled way with assessment, approval, testing, communication and rollback planning.'],['How would you support a remote mission with poor connectivity?','Critical services|Local focal point|Backup link|Offline','I identify critical services and continuity options first. I keep support simple with local focal points, clear escalation and practical documentation. I protect critical traffic and use backup connectivity or lightweight and offline-capable processes where practical.'],['How do you manage IT service delivery and a major incident?','Incident owner|Restore first|Communication|RCA|SLA','I manage support with clear ownership, priorities, escalation and service expectations. During a major incident I confirm impact, assign one incident owner, restore the safest critical service first and communicate clearly. After recovery I run root-cause analysis and track corrective actions.'],['Tell us about your real DR experience, RTO, RPO and backups.','Real failover|Alternate DC|RTO|RPO|Replication|Restore test','MedIQ has actually operated from our alternate DR data-center environment. I coordinated application, infrastructure, database, support and operational stakeholders. My approach connects business criticality to RTO, RPO, replication, backups, tested recovery, ownership and communication.'],['Explain the 3-2-1 rule, immutable backup and a failed backup scenario.','3-2-1|Immutable|Offsite|Restore test|Escalation','3-2-1 means three copies of data, on two different media, with one copy offsite or isolated. Immutable or offline copies reduce ransomware risk. If backups fail, I escalate immediately, assess exposure, restore backup operation, verify success and perform a restore test.'],['How do you approach cybersecurity and sensitive humanitarian data?','Risk|Least privilege|RBAC|MFA|Logging|Need-to-know','My role is technology leadership and security governance, not penetration testing or SOC specialization. I focus on risk, least privilege, RBAC, strong authentication, secure integration, logging, patching, encryption and recovery. Sensitive information is shared only on a need-to-know basis.'],['What would you do after phishing, ransomware or a lost device?','Contain|Revoke|Isolate|Logs|Escalate|Recover','I contain first: secure identities and sessions, isolate affected devices where needed and preserve useful evidence. Then I assess exposure, escalate correctly, recover safely and address root cause through controls, patching, awareness or device policy.'],['What is your experience with Windows Server and Active Directory?','Windows Server|AD|GPO|DNS|DHCP|Private Cloud','My strongest production experience is enterprise infrastructure and Private Cloud supporting critical systems. I understand Windows Server and Active Directory operations including identity, Group Policy, DNS, DHCP, access, patching, monitoring, availability and recovery. I do not claim daily administration I did not personally perform.'],['How would you troubleshoot AD login or GPO problems?','Account|DNS|DC|OU|Inheritance|gpresult','For login failure I would check account status and lockout, credentials, network and DNS connectivity and domain-controller availability. For GPO I would check the correct OU, inheritance and filtering, replication, then use tools such as gpresult or gpupdate through the appropriate administrator.'],['What is your Microsoft 365 and Entra ID approach?','M365|Entra ID|MFA|Conditional Access|JML|Least privilege','I treat identity as a core security control: joiner-mover-leaver processes, least privilege, MFA, access review and appropriate Conditional Access. I understand Microsoft 365 and Entra governance and support while remaining transparent that I am not claiming deep daily tenant administration.'],['How would you investigate a suspicious Microsoft 365 login?','Sign-in logs|Location|Device|MFA|Revoke sessions|Risk','I would review sign-in and risk information, user, location and device context, MFA status and related activity. If compromise is suspected I would revoke sessions, secure credentials and access, investigate impact and follow the security incident process.'],['What is your Azure and AWS cloud experience?','Private Cloud|Azure|AWS|Shared Responsibility|IAM','My direct production baseline is mainly Private Cloud and secured data centers, not deep hands-on public-cloud administration. Transferable principles include IAM, network security, availability, monitoring, backup, DR and operational ownership. I understand shared responsibility and would learn MSF-specific cloud architecture.'],['How would you manage MDM, BYOD and a stolen device?','MDM|BYOD|Inventory|Compliance|Encryption|Remote wipe','I would maintain device inventory and clear enrollment, compliance and BYOD rules, with encryption, patching and least-privilege access. For a stolen device I would block access, revoke sessions, use remote containment or wipe where supported, assess exposure and report the incident.'],['What do you know about SITS, UniField and eHealth?','SITS|UniField|eHealth|Learn first|Support model','I would not claim direct hands-on MSF platform experience. I would learn each system workflow, architecture, ownership, support model and dependencies, including how local systems align with global SITS platforms. My ERP, healthcare, integration and support background gives me a strong base.'],['How do you manage application lifecycle, technical debt and rationalization?','Lifecycle|EOL|Technical debt|Rationalization|Roadmap','I maintain an owner, support status, dependencies and lifecycle plan for each critical system. Unsupported, insecure, duplicated or poor-value applications become roadmap decisions. I prioritize technical debt by operational and security risk and rationalize unnecessary applications rather than carrying them forever.'],['How do you manage documentation, policies and compliance?','Architecture|Permissions|Recovery|Processes|Evidence','Documentation should include architecture, ownership, dependencies, access, configurations, integrations, backup and recovery and support contacts. Policies define expected controls; procedures make them executable. I keep evidence and review documents after major changes so they remain operationally useful.'],['How do you manage licensing, vendors, support contracts and SLAs?','Licensing|SLA|Vendor|Renewal|Security|Exit path','I track ownership, license and support status, renewal risk, measurable service expectations, security requirements and escalation. Repeated vendor failure requires corrective action and risk escalation. For critical systems I also want a realistic alternative or exit path.'],['Tell us about your integrations and healthcare systems experience.','SAP|Dynamics|MedIQ|e-Tendering|e-Pharmacy|Reconciliation','My SAP experience is integration and architecture, not module configuration. I led the UPA-side bi-directional MedIQ integration with SAP-based Strategic Medical Warehouses and also work with Dynamics 365 integration. MedIQ includes e-Tendering, inventory, logistics, e-Pharmacy, assets, analytics and mobile services.'],['Why should we choose you?','Engineering|Healthcare|Leadership|DR|Integration|Honest gaps','I bring engineering depth, healthcare systems experience, international delivery and enterprise leadership. My evidence includes leading 54 people with seven direct reports, Private Cloud, real DR failover, complex integrations, healthcare platforms, security governance, support and vendors. I also stay transparent about MSF-specific systems and public-cloud depth that I still need to learn.']];let i=+(localStorage.msfCardIndex||0);if(i<0||i>=Q.length)i=0;let done=new Set(JSON.parse(localStorage.msfDone||'[]'));const $=id=>document.getElementById(id);function save(){localStorage.msfCardIndex=i;localStorage.msfDone=JSON.stringify([...done])}function stats(){let n=done.size,p=Math.round(n/Q.length*100);$('count').textContent=`${n} / ${Q.length} Done`;$('pct').textContent=p+'%';$('progress').style.width=p+'%'}function render(){let q=Q[i];$('qno').textContent=`Question ${i+1} of ${Q.length}`;$('question').textContent=q[0];$('keys').innerHTML=q[1].split('|').map(k=>`<span class="k">${k}</span>`).join('');$('priority').innerHTML=i<15?'<span class="priority">PRIORITY</span>':'';$('answer').textContent=q[2];$('answer').classList.remove('show');$('reveal').textContent='Show Answer';$('done').classList.toggle('completed',done.has(i));$('done').textContent=done.has(i)?'Done ✓':'Done ✓';stats();save();scrollTo({top:0,behavior:'smooth'})}$('reveal').onclick=()=>{let a=$('answer');a.classList.toggle('show');$('reveal').textContent=a.classList.contains('show')?'Hide Answer':'Show Answer'};$('done').onclick=()=>{done.has(i)?done.delete(i):done.add(i);save();render()};$('next').onclick=()=>{i=(i+1)%Q.length;render()};$('prev').onclick=()=>{i=(i-1+Q.length)%Q.length;render()};$('random').onclick=()=>{i=Math.floor(Math.random()*Q.length);render()};$('reset').onclick=()=>{if(confirm('Reset all Done progress?')){done.clear();i=0;save();render()}};render();</script></body></html>
