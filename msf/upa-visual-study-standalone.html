<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081522"><title>WACA Visual Study Library</title>
<style>
:root{
  --bg:#081522;--panel:#0e2031;--card:#10273a;--card2:#0b1b2a;--line:#244057;
  --text:#edf7ff;--muted:#9fb6c8;--cyan:#4ed9e7;--green:#69dda2;--amber:#ffc970;
  --red:#ff8f91;--purple:#c5a7ff;--shadow:0 16px 55px rgba(0,0,0,.22);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(160deg,#07121c,#0a1b29 55%,#081522);color:var(--text);font:15px/1.65 Inter,Segoe UI,Arial,sans-serif}
a{color:inherit}.shell{max-width:1450px;margin:auto;padding:26px}.hero{border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#0d273a,#0b1d2b);padding:30px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(78,217,231,.18),transparent 67%);right:-100px;top:-180px}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:900;color:var(--cyan)}h1{font-size:clamp(32px,5vw,66px);line-height:1.03;margin:10px 0 14px;max-width:1000px}.hero p{max-width:950px;color:#c2d5e4;font-size:17px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid var(--line);background:#123047;color:var(--text);padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:var(--cyan);color:#06202a;border-color:transparent}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:28px;line-height:1}.stat span{color:var(--muted);font-size:12px}.stat.direct b{color:var(--green)}.stat.adjacent b{color:var(--amber)}.stat.conceptual b{color:var(--purple)}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(8,21,34,.93);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px;margin:18px 0;display:grid;grid-template-columns:minmax(260px,2fr) repeat(3,minmax(150px,1fr)) auto auto;gap:9px}
input,select{width:100%;background:#0b1e2d;color:var(--text);border:1px solid var(--line);padding:11px 12px;border-radius:10px}.question-list{display:grid;gap:13px}.e-card{border:1px solid var(--line);border-radius:18px;background:var(--card2);overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.12)}.e-card.grade-direct{border-left:4px solid var(--green)}.e-card.grade-adjacent{border-left:4px solid var(--amber)}.e-card.grade-conceptual{border-left:4px solid var(--purple)}
.e-head{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:18px;display:grid;grid-template-columns:64px 1fr auto;gap:15px;cursor:pointer}.rank{display:grid;place-items:center;border-right:1px solid var(--line)}.rank b{font-size:17px}.rank span{font-size:11px;color:var(--muted)}.question{font-weight:850;font-size:17px}.question-ar{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#b9cfdf;margin-top:4px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{font-size:10px;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);padding:3px 7px;border-radius:999px;color:#bdd1df}.pill.grade{color:var(--cyan)}.chev{font-size:22px;transition:.2s}.e-card.open .chev{transform:rotate(180deg)}.e-body{display:none;border-top:1px solid var(--line);padding:18px}.e-card.open .e-body{display:block}
.boundary{background:#0f2a3d;border:1px solid #31546b;border-radius:13px;padding:13px}.boundary b{color:var(--cyan)}.boundary p{margin:5px 0 0;color:#c3d7e6}
.answer,.experience,.arabic{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#10283b}.answer.quick{background:#0d2534}.answer.primary{border-color:#2b6470}.answer h4,.arabic h4{margin:0 0 8px;font-size:11px;letter-spacing:.09em;color:var(--cyan)}.answer p,.experience p,.arabic p{white-space:pre-line;margin:0}.experience{background:#102c29;border-color:#2d5a51}.section-title{display:flex;justify-content:space-between;gap:15px;margin-bottom:9px}.section-title span{font-size:11px;letter-spacing:.09em;font-weight:900;color:var(--green)}.section-title b{font-size:11px;color:var(--amber)}.experience ul{margin:12px 0;padding-left:22px}.sources{display:flex;gap:7px;flex-wrap:wrap}.source-badge{font-size:10px;border:1px solid #41695f;background:#0c231f;padding:4px 7px;border-radius:8px}
.arabic{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#241f31;border-color:#4c405e}.arabic .section-title span{color:#d8c4ff}.arabic h4{color:#d8c4ff}
.evidence-flow{display:flex;gap:6px;align-items:stretch;margin:14px 0;overflow:auto}.flow-step{min-width:150px;flex:1;border:1px solid var(--line);background:#0d2232;border-radius:12px;padding:11px;display:flex;gap:8px;align-items:center}.flow-step span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#163b50;color:var(--cyan);font-size:10px;font-weight:900}.flow-step b{font-size:11px}.evidence-flow i{font-style:normal;align-self:center;color:var(--cyan)}
.coach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.coach-grid>div{border:1px solid var(--line);background:#0b1e2d;border-radius:12px;padding:12px}.coach-grid b{font-size:11px;color:var(--cyan)}.coach-grid p{font-size:12px;color:#c1d4e2}.coach-grid .danger{border-color:#633b42}.coach-grid .danger b{color:var(--red)}
.status-actions{display:flex;gap:8px;margin-top:14px}.status-actions button{border:1px solid var(--line);background:#0d2232;color:var(--muted);padding:7px 10px;border-radius:9px;cursor:pointer}.status-actions button.active{border-color:var(--cyan);color:var(--text)}
.empty{text-align:center;padding:50px;color:var(--muted)}
.atlas{max-width:1280px;margin:auto;padding:28px}.atlas h2{font-size:28px;margin-bottom:6px}.atlas .lead{color:var(--muted);max-width:900px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.metric-card,.diagram-card,.source-card,.chart-card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px}.metric-card b{font-size:38px;color:var(--cyan);display:block}.metric-card span{color:var(--muted)}.section{margin-top:28px}.flow-wide{display:flex;align-items:stretch;gap:7px;overflow:auto;margin-top:14px}.node{min-width:145px;flex:1;background:#0d2638;border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center}.node b{display:block;color:var(--cyan)}.arrow{align-self:center;color:var(--cyan);font-size:20px}.bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:12px 0}.bar-bg{height:15px;border-radius:999px;background:#081521;overflow:hidden;border:1px solid var(--line)}.bar-fill{height:100%;background:linear-gradient(90deg,#235875,#4ed9e7)}.bar-row b{text-align:right}.note{font-size:12px;color:var(--muted)}.source-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.source-card b{display:block;color:var(--cyan)}.source-card small{color:var(--muted)}.safe{border-left:4px solid var(--green);padding-left:14px}.warning{border-left:4px solid var(--amber);padding-left:14px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.coach-grid,.grid3,.source-list{grid-template-columns:1fr}.bar-row{grid-template-columns:120px 1fr 70px}}
@media(max-width:650px){.shell,.atlas{padding:12px}.hero{padding:20px}.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr;position:static}.e-head{grid-template-columns:48px 1fr auto;padding:13px}.question{font-size:15px}.question-ar{font-size:13px}.evidence-flow{display:grid}.evidence-flow i{display:none}.flow-wide{display:grid}.arrow{display:none}.bar-row{grid-template-columns:1fr}.bar-row b{text-align:left}}
@media print{body{background:#fff;color:#111}.toolbar,.hero-actions,.status-actions{display:none!important}.e-card{break-inside:avoid;background:#fff;border-color:#ccc}.e-body{display:block!important}.answer,.experience,.arabic,.coach-grid>div,.boundary{background:#fff!important;color:#111!important}.question-ar,.note,.hero p{color:#444}.source-badge{background:#fff;color:#111}}

.real-case{margin-top:14px;padding:17px;border:1px solid #38697a;border-radius:15px;background:linear-gradient(135deg,#0d2638,#0f3038)}
.real-case h3{margin:0 0 8px;font-size:18px}
.real-case p{white-space:pre-line;margin:0;color:#d4e4ef}
.case-visual{display:block;width:100%;max-height:390px;object-fit:contain;margin:15px 0;border-radius:14px;border:1px solid #2d5368;background:#081522}
.star-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.star-grid>div{padding:10px;border-radius:10px;background:#0a1d2b;border:1px solid #28485d;font-size:11px}
.transfer{margin-top:12px;padding:12px;border-radius:11px;background:#102c29;border-left:4px solid #69dda2}
.transfer b{color:#69dda2;font-size:11px;letter-spacing:.05em}
.visual-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.visual-gallery figure{margin:0;background:#0d2131;border:1px solid var(--line);border-radius:16px;padding:12px}
.visual-gallery img{width:100%;border-radius:11px;display:block}
.visual-gallery figcaption{color:var(--muted);font-size:12px;margin-top:7px}
@media(max-width:1000px){.star-grid{grid-template-columns:1fr 1fr}.visual-gallery{grid-template-columns:1fr}}
@media(max-width:650px){.star-grid{grid-template-columns:1fr}}
@media print{.real-case,.transfer,.star-grid>div{background:#fff!important;color:#111!important}.case-visual{max-height:260px}}

.coverage-panel{margin:18px 0;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);display:grid;grid-template-columns:minmax(250px,.75fr) 1.25fr;gap:24px;align-items:start}.coverage-panel h2{margin:5px 0;font-size:22px}.coverage-panel p{color:var(--muted);margin:0}.coverage-chart{display:grid;gap:7px}.coverage-row{display:grid;grid-template-columns:145px 1fr 34px;gap:9px;align-items:center;font-size:11px}.coverage-row>div{height:10px;border-radius:999px;background:#081521;border:1px solid var(--line);overflow:hidden}.coverage-row i{display:block;height:100%;background:#4ed9e7;border-radius:999px}.coverage-row b{text-align:right}@media(max-width:850px){.coverage-panel{grid-template-columns:1fr}.coverage-row{grid-template-columns:120px 1fr 28px}}

</style></head>
