<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Role Evidence Matcher | Mahmoud Salama</title><link rel="stylesheet" href="/assets/global-footer.css"><style>body{margin:0;font-family:Inter,system-ui;background:#f4f8f8;color:#10263b}.wrap{width:min(1050px,92vw);margin:auto;padding:60px 0}h1{font-size:clamp(2.5rem,7vw,5rem);letter-spacing:-.055em;line-height:.95}textarea{width:100%;min-height:230px;padding:18px;border:1px solid #cad8dc;border-radius:18px;font:inherit;box-sizing:border-box}button{margin:14px 0;padding:12px 18px;border:0;border-radius:999px;background:#10263b;color:#fff;font-weight:850}.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#fff;border:1px solid #dce5e7;border-radius:18px;padding:18px}.yes{color:#087c76;font-weight:850}.gap{color:#9a4f27;font-weight:850}.note{color:#617682}</style></head><body><main class="wrap"><p><b>EVIDENCE-FIRST ROLE MATCHER</b></p><h1>Paste a job description.<br>See verified evidence.</h1><p class="note">This deliberately avoids invented match percentages. It maps detected requirements to verified career evidence and flags unsupported areas as gaps.</p><textarea id="jd" placeholder="Paste the job description here…"></textarea><button id="go">Map requirements</button><div class="result" id="out"></div></main><script>const E=[["team|leadership|people|manage","Leadership scale","54+ engineers; 9 direct reports"],["budget|financial|tco|cost","Financial governance","EGP 150M annual IT budget; Business Case; TCO; Budget vs Actual; Committed Cost; Financial Impact of Change"],["health|healthcare|hospital","Healthcare transformation","MedIQ: 38K+ users; 5,900+ government healthcare entities; 2,000+ suppliers"],["architect|integration|api","Enterprise architecture","Enterprise architecture, APIs/integration, data and platform governance"],["program|project|delivery|pmo","Program delivery","Multi-workstream delivery, vendors, UAT, cutover, adoption and stabilization"],["cloud|infrastructure|platform","Platforms / private cloud","Private-cloud style compute, storage and network provisioning/resource pooling"],["ai|rag|llm|governance","AI","Scoped experience in RAG, LLMOps and AI Governance"],["security|risk|cyber","Security governance","Security-risk and assurance governance within executive IT scope"],["procurement|supply","Procurement transformation","MedIQ procurement cycle-time reduction 60%; APPM pooled-procurement platform delivery"],["oman|gcc","Oman","20-person development team; 15+ government/enterprise platforms; National Educational Portal ~1M users"]];document.querySelector("#go").onclick=()=>{let t=document.querySelector("#jd").value.toLowerCase(),o=document.querySelector("#out");if(!t.trim()){o.innerHTML='<article class="card gap">Paste a job description first.</article>';return}let found=E.filter(x=>new RegExp(x[0],"i").test(t));o.innerHTML=found.map(x=>'<article class="card"><div class="yes">VERIFIED EVIDENCE</div><h2>'+x[1]+'</h2><p>'+x[2]+'</p></article>').join("")+'<article class="card"><div class="gap">REVIEW REQUIRED</div><h2>Unmapped requirements</h2><p>Requirements not represented above should be treated as not evidenced here — not silently inferred.</p></article>'};</script><script src="/assets/global-footer.js"></script></body></html>
