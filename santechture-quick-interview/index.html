<title>SANTECHTURE — Quick Interview Keywords</title>
<style>
:root{--bg:#f6fbff;--ink:#16324a;--muted:#60788b;--line:#c8dfec;--gold:#ffd447;--cyan:#6bd9ec;--coral:#ff7868;--green:#79dba2;--shadow:0 12px 0 rgba(21,73,103,.08),0 20px 45px rgba(28,83,113,.10)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 3%,rgba(107,217,236,.25),transparent 25rem),radial-gradient(circle at 94% 8%,rgba(255,212,71,.25),transparent 24rem),var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(1100px,100%);margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:950}.brand small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:.7rem}.badge{background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:7px 12px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}.hero{background:#fff;border:2px solid var(--ink);border-radius:24px;padding:clamp(24px,5vw,48px);box-shadow:var(--shadow);margin-bottom:18px}h1{font-size:clamp(2rem,6vw,4.4rem);line-height:.98;letter-spacing:-.055em;margin:0 0 14px}.hero p{color:var(--muted);max-width:760px}.controls{display:flex;gap:10px;margin:18px 0;position:sticky;top:8px;z-index:5;background:rgba(246,251,255,.94);padding:8px;border-radius:16px;backdrop-filter:blur(10px)}input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:12px;padding:11px 13px;font:inherit;background:#fff}.btn{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--gold);font-weight:900;cursor:pointer}.grid{display:grid;gap:14px}.card{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:20px;box-shadow:5px 5px 0 rgba(22,50,74,.12)}.num{display:inline-block;background:var(--cyan);border:1.5px solid var(--ink);border-radius:999px;padding:3px 8px;font-size:.75rem;font-weight:900}.q{font-size:1.18rem;font-weight:900;margin:10px 0}.keywords{display:flex;flex-wrap:wrap;gap:7px}.kw{background:#eef8fc;border:1px solid #94c8da;border-radius:999px;padding:5px 9px;font-size:.86rem;font-weight:800}.answer{margin:13px 0 0;padding:12px 14px;border-left:4px solid var(--coral);background:#fff8e1;border-radius:0 12px 12px 0;color:#334f63}.copy{margin-top:12px;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:7px 10px;font-weight:800;cursor:pointer}.priority{border-color:var(--coral)}.priority .num{background:#ffe2dd}.empty{text-align:center;color:var(--muted);padding:40px}@media(max-width:600px){.shell{padding:12px}.controls{flex-direction:column}.hero{padding:24px 20px}.card{padding:17px}.q{font-size:1.08rem}}
</style></head><body><main class="shell"><header class="top"><div class="brand">Mahmoud Salama<small>SANTECHTURE CEO Interview</small></div><span class="badge">Quick Recall</span></header><section class="hero"><h1>Short answers.<br>Strong keywords.</h1><p>Director of Solutions Architecture — rapid pre-interview review. Each answer is deliberately compact: remember the keywords, then speak naturally around them.</p></section><div class="controls"><input id="search" type="search" placeholder="Search question or keyword…"><button class="btn" id="priority">Top questions</button></div><section class="grid" id="grid"></section></main><script>
const data=[
["Tell me about yourself and why SANTECHTURE?",["17+ years","national healthtech","architecture + delivery","RCM learning","business outcomes"],"I bring 17+ years across software, architecture and digital transformation, including national-scale healthcare platforms. SANTECHTURE is attractive because the role connects architecture directly to healthcare revenue-cycle outcomes and regional scale.",1],
["Why Director of Solutions Architecture?",["strategy to execution","cross-functional","standards","customer outcomes","scale"],"My strength is translating business strategy into executable architecture, aligning Product, Engineering and customers, and creating standards that let the platform scale without losing delivery speed.",1],
["You are not an RCM expert. How will you lead experts?",["domain humility","listen first","experts own depth","architecture leadership","fast learning"],"I would not pretend to replace deep RCM expertise. I lead the architecture system: learn the domain quickly, use experts for domain depth, ask the right questions, and turn that knowledge into scalable technical decisions.",1],
["What would you do in your first 90 days?",["listen","baseline","risks","quick wins","roadmap","ownership"],"First understand people, product, customers and architecture. Then baseline risks and ownership gaps, deliver a few high-value improvements, and align a measurable architecture roadmap with leadership.",1],
["What will you deliver in the first two weeks?",["architecture map","critical flows","top risks","stakeholders","decision log"],"A concise current-state architecture map, critical dependency and transaction flows, top risks, key ownership gaps, and an agreed list of immediate decisions or quick wins."],
["How do you scale to hundreds of hospitals?",["strong core","configuration","rules","adapters","extension points","no forks"],"Keep one strong product core and push variation to configuration, governed rules, adapters and defined extension points. Avoid customer-specific forks and standardize onboarding, testing and observability.",1],
["How should hospital 100 differ from hospital 10?",["faster onboarding","reuse","automation","templates","metrics"],"Hospital 100 should be easier than hospital 10: more reusable mappings, automated tests, standard connectors, configuration templates and measurable reductions in onboarding effort and defects.",1],
["How do you manage millions of rules and regulatory change?",["governed assets","owner","version","effective date","scope","tests","audit","rollback"],"Treat rules as governed product assets, not scattered code. Every rule needs ownership, versioning, effective dates, scope, test coverage, audit history and rollback, with regression testing for high-impact changes.",1],
["How do you design reliable integrations?",["API contract","authentication","validation","versioning","mapping","timeouts","retries","reconciliation"],"Start with a clear API contract, then define security, validation, versioning, mappings and error behavior. Design dependencies for failure using timeouts, controlled retries, queues where appropriate, monitoring and reconciliation."],
["What if an external payer API is unreliable?",["isolation","timeouts","controlled retries","queue","circuit breaker","state","reconciliation"],"Protect the core product from the dependency: isolate it, use timeouts and controlled retries, queue safely where appropriate, preserve transaction state, monitor failures and reconcile once the external service recovers."],
["How do you handle a major production incident?",["impact","severity","incident owner","communication","restore","RCA","corrective actions"],"Confirm impact and severity, assign one incident owner, communicate clearly, restore the safest critical service or workaround first, then complete root-cause analysis and track corrective actions.",1],
["APIs are green but customers are losing revenue. What next?",["business observability","end-to-end journey","queues","rules","reconciliation","financial KPIs"],"I would move beyond technical uptime and trace the end-to-end business transaction: rules, queues, payer responses, reconciliation and financial outcome metrics. Green infrastructure does not prove a healthy business flow."],
["How do you prevent duplicate financial transactions during replay?",["idempotency","unique keys","transaction state","deduplication","audit","reconciliation"],"Use idempotency keys, durable transaction state, duplicate detection and auditable replay controls. Reconciliation must confirm that retrying cannot create a second financial event."],
["How do you balance standardization and customer customization?",["core vs edge","configuration first","strategic value","TCO","no permanent forks"],"Standardize the product core and allow controlled variation at the edge. Prefer configuration over code; accept customization only when its strategic value justifies lifecycle cost and it does not create a permanent fork.",1],
["A major customer demands a custom workflow in six weeks. What do you do?",["clarify outcome","reuse","configuration","risk","phased option","no blind yes/no"],"Clarify the business outcome first, test whether existing configuration or extension points can solve it, quantify risk and cost, then offer the fastest safe option—often phased—rather than a blind yes or no.",1],
["Sales wants an immediate yes before Engineering validates. What do you say?",["support revenue","conditional commitment","fast validation","options","risk transparency"],"I support the commercial objective without making an unsafe promise. I would give a conditional commitment, run rapid technical validation, and return quickly with viable options, trade-offs and a credible date."],
["Would you accept architecture debt for a strategic account?",["deliberate debt","time-bound","owner","exit plan","measured risk"],"Yes, sometimes—if it is deliberate, measured and reversible. The debt needs an owner, explicit risk, a time limit and a funded exit plan; otherwise a temporary exception becomes permanent architecture."],
["How do you prioritize an architecture roadmap?",["business value","risk","reliability","scale","cost of delay","capacity"],"Prioritize using business value, customer impact, operational risk, scalability and cost of delay. Protect explicit capacity for reliability and architecture debt instead of allowing urgent feature work to consume everything."],
["Where should Solutions Architecture have decision authority?",["guardrails","cross-domain design","integration standards","Product owns what","Engineering owns how","escalation"],"Solutions Architecture should own cross-domain architectural guardrails, integration patterns and major design coherence. Product owns business priorities; Engineering owns implementation detail within agreed guardrails, with clear escalation for material trade-offs."],
["How do you prevent architects becoming a bottleneck?",["guardrails","reference patterns","self-service","risk-based review","automation"],"Replace approval-heavy governance with clear guardrails, reference architectures, reusable patterns and automated checks. Reserve human architecture review for high-risk or irreversible decisions."],
["What metrics prove architecture is scaling?",["onboarding lead time","change failure rate","integration reuse","MTTR","availability","cost per customer"],"I would track onboarding lead time, reuse of standard integrations, change failure rate, MTTR, critical-flow availability and cost-to-serve. Architecture success must show up in delivery and customer outcomes."],
["How do you work with Product and Engineering when they disagree?",["shared outcome","facts","trade-offs","decision rights","document decision"],"Bring everyone back to the shared outcome, make constraints and trade-offs explicit, use evidence rather than hierarchy, apply agreed decision rights, and document the decision and assumptions."],
["How do you approach security in healthcare architecture?",["least privilege","IAM","encryption","auditability","segmentation","privacy by design"],"Security is architectural, not an afterthought: least privilege and strong IAM, encryption in transit and at rest, auditability, segmentation, secure APIs and privacy-by-design controls proportional to data sensitivity."],
["How do you define RTO and RPO?",["RTO = restore time","RPO = acceptable data loss","business criticality","tested recovery"],"RTO is how quickly a service must be restored; RPO is how much data loss the business can tolerate. I set both from business criticality, then design and test recovery controls against them."],
["What is your leadership style?",["clarity","ownership","empower experts","accountability","remove blockers"],"I create clarity on outcomes and decision rights, empower strong experts to own their domains, remove blockers and hold teams accountable through measurable outcomes rather than micromanagement."],
["What is the biggest risk in hiring you?",["RCM depth","transparent gap","fast ramp-up","transferable healthtech scale"],"My deepest experience is broader healthtech and national digital platforms rather than years inside one RCM product. I address that transparently with an aggressive domain-learning plan while bringing architecture and scale experience that transfers immediately.",1],
["What will you personally change in six months?",["decision clarity","architecture governance","integration reuse","reliability","onboarding speed"],"I would aim for clearer architecture decision rights, stronger reusable integration patterns, measurable reliability and observability, and a faster, more repeatable customer onboarding model.",1],
["Why should we hire you?",["architecture + execution","healthcare scale","leadership","business translation","regional growth"],"Because I combine architecture depth with delivery leadership and healthcare-scale execution. I can translate CEO-level growth goals into technical standards, operating mechanisms and measurable delivery outcomes without losing speed.",1]
];
const grid=document.getElementById('grid'),search=document.getElementById('search'),btn=document.getElementById('priority');let onlyTop=false;function render(){const q=search.value.toLowerCase().trim();const rows=data.filter(x=>(!onlyTop||x[3])&&(!q||(x[0]+' '+x[1].join(' ')+' '+x[2]).toLowerCase().includes(q)));grid.innerHTML=rows.length?rows.map((x,i)=>`<article class="card ${x[3]?'priority':''}"><span class="num">${x[3]?'HIGH PRIORITY':'Q&A'}</span><div class="q">${x[0]}</div><div class="keywords">${x[1].map(k=>`<span class="kw">${k}</span>`).join('')}</div><div class="answer">${x[2]}</div><button class="copy" onclick="navigator.clipboard.writeText(${JSON.stringify(x[2])});this.textContent='Copied ✓';setTimeout(()=>this.textContent='Copy answer',1200)">Copy answer</button></article>`).join(''):'<div class="empty">No matching questions.</div>'}search.addEventListener('input',render);btn.onclick=()=>{onlyTop=!onlyTop;btn.textContent=onlyTop?'Show all':'Top questions';render()};render();
</script></body></html>
