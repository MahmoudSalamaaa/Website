<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WaCA Interview Live — FINAL</title><style>:root{--ink:#101828;--muted:#667085;--blue:#174ea6;--bluebg:#eaf2ff;--green:#067647;--greenbg:#ecfdf3;--red:#b42318;--redbg:#fff1f0;--line:#d0d9e6;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:14px 18px 80px}.hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 22px}.hero h1{font-size:28px;margin:4px 0}.hero p{margin:5px 0;color:var(--muted)}.home{color:var(--blue);font-weight:800;text-decoration:none}.bar{position:sticky;top:0;z-index:9;background:#f4f7fbf2;backdrop-filter:blur(8px);padding:10px 0;display:grid;grid-template-columns:1fr auto auto;gap:8px}.bar input,.bar select,.bar button{font:inherit;font-size:17px;border:1px solid #b9c5d5;background:#fff;border-radius:11px;padding:12px}.bar button{font-weight:900;cursor:pointer}.stats{font-size:14px;color:var(--muted);margin:2px 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px 23px;margin-bottom:13px;box-shadow:0 4px 14px #10182808}.top{display:flex;justify-content:space-between;align-items:center}.cat{font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);background:var(--bluebg);padding:5px 9px;border-radius:999px}.q{font-size:25px;line-height:1.22;font-weight:950;margin:11px 0}.trigger{font-size:17px;line-height:1.35;font-weight:950;background:#f0f4fa;border-left:6px solid var(--blue);padding:10px 12px;border-radius:8px;margin-bottom:13px}.answer{font-size:20px;line-height:1.52;white-space:pre-line}.answer .lead{font-weight:900}.evidence,.boundary{font-size:14px;line-height:1.4;padding:9px 11px;border-radius:9px;margin-top:10px}.evidence{background:var(--greenbg);color:#075f3b}.boundary{background:var(--redbg);color:#8f1f17}.actions{display:flex;gap:8px;margin-top:11px}.actions button{border:0;border-radius:9px;padding:8px 11px;font-weight:900;cursor:pointer}.copy{background:var(--blue);color:#fff}.hide{background:#edf1f6}.focus .evidence,.focus .boundary{display:none}.focus .answer{font-size:22px;line-height:1.55}.focus .q{font-size:28px}.collapsed .answer,.collapsed .evidence,.collapsed .boundary{display:none}.collapsed .trigger{margin-bottom:0}@media(max-width:650px){.wrap{padding:8px}.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}.q{font-size:22px}.answer{font-size:18px}.focus .answer{font-size:19px}.card{padding:17px}}</style></head><body><div class="wrap" id="wrap"><section class="hero"><a class="home" href="/waca/">← WaCA Home</a><h1>Interview Live — FINAL</h1><p><b>Delivery:</b> Direct answer → one strong proof → WaCA relevance only if needed → STOP.</p><p>Answers are optimized for fast reading and ~30–60 second delivery.</p></section><div class="bar"><input id="search" autofocus placeholder="Search: DR / AWS / incident / offline / UniField…"><select id="cat"><option value="">All topics</option></select><button id="focus">Focus mode</button></div><div id="stats" class="stats"></div><main id="list"></main></div><script>const D=[
['Background','⭐⭐⭐','Tell us about yourself.','NOW → UPA → OMAN → ENGINEERING → WHY RELEVANT',`I’m an Information Systems and Digital Transformation leader with more than 18 years of experience.\n\nCurrently, I head Information Systems and Digital Transformation at Egypt’s Unified Procurement Authority, leading a 54-person technology organization across enterprise applications, integration, infrastructure and security oversight, technical support and digital transformation.\n\nI joined UPA in 2020, and before that I spent more than four years in Oman as a Development Team Leader and Senior Full-Stack Developer on government platforms, including a national educational portal serving around one million users.\n\nSo I bring both an engineering foundation and senior leadership experience in mission-critical information systems, which is directly relevant to this role.`,`18+ years · 54-person organization · Oman · ~1M-user government portal`,`Current cloud/infrastructure/security work = leadership and governance, not daily administration.`],
['Motivation','⭐⭐⭐','Why MSF WaCA?','HEALTHCARE → OPERATIONAL IMPACT → FIELD REALITY',`MSF WaCA brings together healthcare, technology and direct operational impact. My current work already involves mission-critical healthcare information systems at national scale. What makes WaCA especially attractive is the field dimension, where reliable systems directly support humanitarian operations.\n\nI can bring strong experience in continuity, integration, security governance and large-scale support, while adapting those disciplines to MSF’s operational reality.`,`National-scale healthcare systems · continuity · integration · security governance`,`No prior humanitarian employment claim.`],
['Motivation','⭐⭐⭐','Why move from your current senior position?','SCOPE + IMPACT + MISSION — NOT TITLE',`I evaluate opportunities by scope and impact, not title alone. This role combines enterprise systems, security, cloud, continuity, international collaboration and field operations. Combined with MSF’s humanitarian mission, that makes it a meaningful professional step for me.`,`Senior enterprise leadership + international government experience`,`Do not frame the move as a title step.`],
['Role','⭐⭐⭐','What is your understanding of the Information System Manager role?','SYSTEM HEALTH + LIFECYCLE + COORDINATION',`I see the role as accountable for the health and lifecycle of WaCA’s enterprise systems: security, availability, performance, backup and disaster recovery, integrations, licensing, vendors and documentation.\n\nIt also requires clear coordination with Support, Security, SITS, business owners and field teams so ownership and escalation are always clear.`,`Matches the role themes: systems, security, DR, lifecycle, vendors, integrations`,`Do not reduce the role to help desk/support.`],
['Leadership','⭐⭐⭐','What would your first 90 days look like?','UNDERSTAND → BASELINE → PRIORITIZE → ROADMAP',`First, I would understand before changing. I would map critical systems, owners, dependencies, contracts, recurring incidents and field needs.\n\nThen I would establish a baseline across availability, security, recovery, lifecycle and support risks. By day 90, I would agree a prioritized roadmap with clear ownership, measurable improvements and a small number of realistic quick wins.`,`Existing governance experience: ownership, criticality, dependencies, risk, roadmap`,`No major architecture change before understanding WaCA.`],
['Incident','⭐⭐⭐','A critical system is down. What do you do?','IMPACT → OWNER → COMMUNICATE → RESTORE → VALIDATE → RCA',`First, I confirm business impact and severity, establish one clear incident owner and communicate. Then I restore the safest critical service or approved workaround first.\n\nAfter recovery, I validate the service, monitor stability, perform root-cause analysis and track corrective actions to closure.`,`Major-incident and service-operations oversight`,`Do not invent recovery times or incident metrics.`],
['DR','⭐⭐⭐','Explain RTO and RPO.','RTO = RESTORATION TIME · RPO = ACCEPTABLE DATA LOSS',`RTO is the maximum acceptable time to restore a service. RPO is the maximum acceptable amount of data loss, measured in time.\n\nI derive both from business impact and system criticality, then design the recovery controls to meet those targets.`,`DR governance + real MedIQ failover experience`,`No invented MedIQ RTO/RPO values.`],
['DR','⭐⭐⭐','How do you approach Backup and Disaster Recovery?','CRITICALITY → RTO/RPO → CONTROLS → TEST',`I start with system criticality, dependencies, RTO and RPO, then design the backup, redundancy and recovery controls around those targets. The critical point is to test recovery, not just monitor successful backup jobs.\n\nFor MedIQ, we implemented an alternate disaster-recovery data-center arrangement and successfully executed an actual failover, with the platform operating from the alternate environment.\n\nBackup success is not recovery assurance.`,`Actual alternate-site DR + successful MedIQ failover`,`No unverified RTO/RPO numbers.`],
['MSF Apps','⭐⭐⭐','What do you know about UniField?','FINANCE + SUPPLY → SYSTEM RELIABILITY',`I understand UniField supports important MSF finance and supply processes. From the Information Systems side, my focus would be availability, access control, backup and recovery, patching, data integrity, interfaces, supportability and escalation.\n\nBefore proposing changes, I would first understand WaCA’s actual configuration, dependencies and ownership model.`,`Transferable procurement/supply, continuity and integration experience`,`Do not assume WaCA topology, version or offline behavior.`],
['MSF Apps','⭐⭐','What do you know about eHealth?','INFRA + CONNECTIVITY + SECURE SUPPORT + ESCALATION',`From the Information Systems side, I would focus on eHealth infrastructure and connectivity, secure configuration, documented troubleshooting and correct escalation.\n\nBecause it is a clinical application environment, I would avoid unsupported changes and work through the defined application-support process.`,`Healthcare systems + infrastructure/security/escalation governance`,`Do not invent clinical functionality or WaCA topology.`],
['SITS','⭐⭐⭐','How would you work with SITS?','CATALOGUE → OWNERSHIP → REUSE → GAP → COLLABORATE',`I would first understand the SITS service catalogue, ownership boundaries and escalation paths. If an appropriate shared capability already exists, I would use it rather than create unnecessary local duplication.\n\nIf WaCA has a genuine operational gap, I would document the requirement and work with SITS toward the appropriate solution.`,`Cross-team and shared-service stakeholder coordination`,`SITS is shared IT services/capability, not an application.`],
['AWS','⭐⭐⭐','Explain the AWS Shared Responsibility Model.','SECURITY OF CLOUD / SECURITY IN CLOUD',`AWS is responsible for security of the cloud, while the customer is responsible for security in the cloud, with the exact boundary depending on the service.\n\nOn the customer side, I would focus on identity and access, data protection, secure configuration, logging and monitoring, application security and patching where applicable.`,`AWS was an actual recruitment/interview topic`,`Do not imply WaCA runs AWS or claim daily AWS administration.`],
['AWS','⭐⭐⭐','How would you approach AWS security and monitoring?','IAM → LOGS → ALERT → OWNER → RESPOND',`I would start with strong identity and least privilege, then make logging centralized, protected, searchable and actionable. I would monitor meaningful account, infrastructure and application signals and alert on risks that require action.\n\nEvery alert needs ownership, retention and a defined incident-response path; collecting logs without action is not enough.`,`IAM/RBAC/least privilege + MFA + logging/monitoring governance`,`Do not claim specific AWS services from current environment.`],
['AWS','⭐⭐⭐','How would you design AWS Disaster Recovery?','RTO/RPO → REDUNDANCY → BACKUP → TEST',`I would start with business-defined RTO and RPO, then select the architecture required to meet them. For critical workloads, that can include protected backups, multiple Availability Zones and, when business impact justifies it, a wider disaster-recovery architecture.\n\nThe design is only credible when recovery is tested.`,`Transferable proof: successful MedIQ alternate-site failover`,`Do not imply MedIQ DR was AWS-based.`],
['Microsoft','⭐⭐⭐','How would you manage Microsoft 365, Azure and privileged access?','IDENTITY FIRST → MFA → LEAST PRIVILEGE → RBAC → REVIEW',`I use an identity-first approach: MFA, least privilege, role-based access, separate administrative accounts, secure configuration, logging and regular access reviews. Privileged access should be limited, auditable and time-bound where possible.\n\nMy current responsibility is leadership and governance rather than daily Azure administration. I oversee Azure and hybrid environments and stay technically close enough to review designs, incidents and risk decisions.`,`Azure/hybrid oversight + MedIQ OTP-based MFA rollout`,`Governance/oversight, not daily Azure administration.`],
['Windows','⭐⭐','How would you manage Windows Server environments?','INVENTORY → PATCH → PRIVILEGE → MONITOR → RECOVER',`I would start with inventory, ownership and criticality. My baseline would be secure configuration, controlled patching, privileged-access controls, monitoring, backup and tested recovery.\n\nFor critical servers, I also want dependencies and recovery procedures documented. My current responsibility is oversight and governance rather than daily Windows Server administration.`,`Infrastructure oversight + earlier hands-on engineering background`,`Do not present yourself as the daily Windows administrator.`],
['MDM','⭐⭐⭐','How would you manage MDM in field environments?','ENROLL → ENCRYPT → COMPLIANCE → APPS → WIPE → PRACTICALITY',`I would use MDM to enforce a practical baseline: enrollment, encryption, screen lock, compliance, controlled applications and remote wipe where appropriate.\n\nBut field controls must remain operational under real connectivity constraints. I prefer controlled, documented exceptions over weakening the baseline for everyone. My current responsibility is governance and oversight rather than daily MDM administration.`,`MedIQ Mobile provides real mobile/field operational context`,`Do not claim hands-on Intune/MDM administration.`],
['Integration','⭐⭐⭐','Tell us about a complex integration you led.','OWNERSHIP → DATA → SECURITY → UAT → GO-LIVE → RECONCILE',`A strong example is the bi-directional integration between UPA’s national procurement platform and the Strategic Medical Warehouses system. I led the UPA side from requirements and integration architecture through master-data harmonization, mappings, security, UAT, go-live and production reconciliation. It covered procurement-request and financial workflows.\n\nThe external platform was SAP-based, but my responsibility was enterprise integration, not SAP configuration. The key lesson is that integration is not only APIs; it is ownership, data governance, controls and reconciliation.`,`Bi-directional integration · master data · mappings · security · UAT · go-live · reconciliation`,`SAP is integration evidence only; no SAP configuration claim.`],
['Lifecycle','⭐⭐','How do you manage application lifecycle?','OWNER → RISK → DECIDE: MAINTAIN / UPGRADE / REPLACE / RETIRE',`Every critical application needs a clear owner, criticality and lifecycle plan. I track versions, dependencies, security exposure, vendor support, integrations and technical debt.\n\nThen I make the lifecycle decision explicit: maintain, upgrade, consolidate, replace or retire, based on operational value and risk.`,`MedIQ ecosystem governance, releases and change control`,`Keep decisions evidence-based.`],
['Leadership','⭐⭐⭐','How hands-on are you, and how do you lead technical teams?','CLARITY → OWNERSHIP → ACCOUNTABILITY → TECHNICAL DEPTH',`I currently lead a 54-person technology organization with seven direct reports. At that scale, my role is to create clear ownership and decision boundaries, not personally control every technical task.\n\nI still stay technically close to critical work: architecture, integration, security, recovery and major incidents. Earlier in my career I was hands-on as a Senior Full-Stack Developer and Development Team Leader in Oman, so I can move comfortably between executive and technical discussions.`,`54-person organization · 7 direct reports · hands-on Oman background`,`Do not imply you personally execute every admin/engineering task today.`],
['Field','⭐⭐⭐','How would you handle poor field connectivity?','CRITICAL PROCESS → OFFLINE/FALLBACK → SYNC → RECONCILE',`First, I identify which processes must continue during connectivity loss. I favor simple, supported offline or degraded operation, with a safe fallback and controlled synchronization and reconciliation after reconnection.\n\nI have directly relevant experience in MedIQ Mobile inventory workflows: transactions can be captured locally during connectivity loss and synchronized after reconnection, using an offline-first approach. I would still validate each MSF application’s supported behavior before applying that pattern.`,`MedIQ Mobile offline-first · local capture · reconnect/sync · delta synchronization`,`Do not assume UniField/eHealth behave the same way.`],
['Security','⭐⭐⭐','How do you balance security with an urgent operational need?','NEED → RISK → MINIMUM ACCESS → APPROVE → MONITOR → EXPIRE',`I treat both the operational need and the security exposure as real risks. I would provide the safest temporary option with the minimum necessary access, with clear approval, ownership, monitoring and an expiry or review point.\n\nThe principle is to support the operation without turning a temporary exception into a permanent security weakness.`,`Real security evidence: organization-wide OTP-based MFA rollout on MedIQ`,`No verified personal emergency-exception incident — do not invent one.`],
['Adoption','⭐⭐','How do you drive training and adoption at scale?','ROLE → TASK → TRAIN → SUPPORT → FEEDBACK → IMPROVE',`I treat adoption as an operational responsibility, not a one-time training event. MedIQ serves more than 38,000 users across more than 11,000 healthcare facilities and over 2,000 suppliers.\n\nI segment users by role and critical task, provide practical training and support, and use recurring user issues as feedback to improve training, process or system design. My organization also includes an approximately 20-person technical support and customer-service operation.`,`38,000+ users · 11,000+ facilities · 2,000+ suppliers · ~20 support/customer service`,`Use canonical scale only.`],
['Vendor','⭐⭐','How do you manage vendors, licenses and support contracts?','INVENTORY → SLA → PERFORMANCE → ESCALATION → EXIT',`I maintain visibility of applications, licenses, owners, renewals, support status, dependencies, utilization and SLAs. Before renewal, I challenge whether the capability is still required and whether a shared service already covers the need.\n\nFor vendors, I want measurable SLAs, clear escalation, recurring service reviews, corrective actions, knowledge transfer and an understood exit risk.`,`Direct coordination with implementation/integration vendors; UPA-side readiness, UAT, go-live and support`,`Do not claim personal negotiation of every commercial contract.`]
];const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const cat=document.getElementById('cat');[...new Set(D.map(x=>x[0]))].forEach(c=>cat.insertAdjacentHTML('beforeend',`<option>${c}</option>`));function render(){const q=search.value.toLowerCase().trim(),c=cat.value,rows=D.filter(x=>(!c||x[0]===c)&&(!q||x.join(' ').toLowerCase().includes(q)));stats.textContent=`${rows.length} question${rows.length===1?'':'s'} shown`;list.innerHTML=rows.map(x=>`<article class="card"><div class="top"><span class="cat">${x[0]}</span><span>${x[1]}</span></div><div class="q">${x[2]}</div><div class="trigger">${x[3]}</div><div class="answer">${esc(x[4])}</div><div class="evidence"><b>REAL PROOF:</b> ${x[5]}</div><div class="boundary"><b>DON'T OVERCLAIM:</b> ${x[6]}</div><div class="actions"><button class="copy" data-a="${encodeURIComponent(x[4])}">Copy</button><button class="hide">Hide details</button></div></article>`).join('');document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(decodeURIComponent(b.dataset.a));b.textContent='Copied ✓'});document.querySelectorAll('.hide').forEach(b=>b.onclick=()=>{let c=b.closest('.card');c.classList.toggle('collapsed');b.textContent=c.classList.contains('collapsed')?'Show answer':'Hide details'})}search.oninput=render;cat.onchange=render;focus.onclick=()=>{wrap.classList.toggle('focus');focus.textContent=wrap.classList.contains('focus')?'Full details':'Focus mode'};document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();search.focus()}if(e.key==='Escape'){search.value='';render()}});render();</script></body></html>
