<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#73699f"><title>WaCA Interview · Listen</title><style>*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#403b58;background:linear-gradient(145deg,#fff8fc,#f5f9ff 55%,#fffcef);min-height:100vh}.shell{width:min(820px,100%);margin:auto;padding:14px 14px 70px}.hero,.player,.list{background:#ffffffdf;border:3px solid #fff;box-shadow:0 16px 40px #675b8f20}.hero{padding:20px;border-radius:30px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{font-size:.72rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#d25f8d}.hero h1{margin:5px 0 7px;font-size:1.7rem}.hero p{margin:0;color:#756f8c;line-height:1.5}.back{text-decoration:none;background:#73699f;color:#fff;padding:10px 13px;border-radius:999px;font-weight:800;white-space:nowrap}.player{margin-top:14px;padding:18px;border-radius:30px}.status{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#776f91;font-weight:800;font-size:.83rem}.progress{height:8px;background:#eee9f8;border-radius:99px;margin:12px 0 18px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#f36f9c,#efa856,#6ca7df,#9877d0);transition:width .2s}.q{font-size:1.25rem;line-height:1.45;margin:0 0 14px}.a{font-size:1rem;line-height:1.65;color:#5f5974;margin:0;white-space:pre-wrap}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.btn,.select{border:0;border-radius:18px;padding:12px 8px;font:inherit;font-weight:850;background:#f2edff;color:#5e567b;min-width:0}.play{background:#73699f;color:#fff}.stop{background:#ffe2ea;color:#9a4f68}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.select{width:100%;background:#fff3c9}.list{margin-top:14px;padding:14px;border-radius:26px}.list h2{font-size:1rem;margin:2px 4px 11px}.item{width:100%;text-align:left;border:0;background:#f8f5ff;border-radius:17px;padding:11px 12px;margin:5px 0;font:inherit;color:#554f69}.item b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;margin-right:7px}.item.active{background:#e7ddff;color:#4f4675;font-weight:800}.loading{padding:28px;text-align:center;color:#77718d}iframe{display:none}@media(max-width:520px){.shell{padding:10px 10px 55px}.hero{padding:16px;border-radius:24px}.hero h1{font-size:1.4rem}.player{padding:15px;border-radius:24px}.controls{grid-template-columns:1fr 1fr}.play{grid-column:1/-1}.options{grid-template-columns:1fr}.q{font-size:1.13rem}.a{font-size:.96rem}}</style></head><body><div class="shell"><section class="hero"><div class="top"><div><div class="eyebrow">MSF WaCA · Interview prep</div><h1>🎧 Listening Mode</h1></div><a class="back" href="/waca/interview.html">Cards</a></div><p>Listen to the same Final Top 28 in order. Questions and answers stay synced with the main interview page.</p></section><section class="player"><div class="status"><span id="counter">Loading…</span><span id="state">Ready</span></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="q" class="q">Loading interview cards…</h2><p id="a" class="a"></p><div class="controls"><button id="prev" class="btn">⏮ Previous</button><button id="play" class="btn play">▶ Play</button><button id="next" class="btn">Next ⏭</button><button id="repeat" class="btn">↻ Repeat</button><button id="pause" class="btn">⏸ Pause</button><button id="stop" class="btn stop">■ Stop</button></div><div class="options"><select id="mode" class="select"><option value="qa">Question + Answer</option><option value="answer">Answer only</option><option value="question">Question only</option></select><select id="rate" class="select"><option value="0.82">Slow · 0.82×</option><option value="0.92" selected>Study · 0.92×</option><option value="1">Normal · 1×</option><option value="1.08">Fast · 1.08×</option></select></div></section><section class="list"><h2>Final Top 28</h2><div id="items" class="loading">Loading…</div></section></div><iframe id="source" src="/waca/interview.html" title="Interview source"></iframe><script>const source=document.getElementById('source'),qEl=document.getElementById('q'),aEl=document.getElementById('a'),counter=document.getElementById('counter'),bar=document.getElementById('bar'),state=document.getElementById('state'),items=document.getElementById('items'),playBtn=document.getElementById('play'),pauseBtn=document.getElementById('pause'),stopBtn=document.getElementById('stop'),mode=document.getElementById('mode'),rate=document.getElementById('rate');let cards=[],i=0,playing=false,token=0;function load(){try{const d=source.contentDocument,els=[...d.querySelectorAll('#grid .card')];if(!els.length)return setTimeout(load,250);cards=els.map((el,n)=>({n:n+1,q:el.querySelector('.q')?.textContent.trim()||'',a:el.querySelector('.answer p')?.textContent.trim()||''})).filter(x=>x.q&&x.a);items.className='';items.innerHTML=cards.map((x,n)=>`<button class="item" data-i="${n}"><b>${n+1}</b>${esc(x.q)}</button>`).join('');items.onclick=e=>{const b=e.target.closest('.item');if(!b)return;stopSpeech();i=+b.dataset.i;show();};show()}source.onload=()=>setTimeout(load,350);setTimeout(load,1200);function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function show(){if(!cards.length)return;const c=cards[i];qEl.textContent=c.q;aEl.textContent=c.a;counter.textContent=`${i+1} / ${cards.length}`;bar.style.width=`${((i+1)/cards.length)*100}%`;[...document.querySelectorAll('.item')].forEach((x,n)=>x.classList.toggle('active',n===i));document.querySelector('.item.active')?.scrollIntoView({block:'nearest',behavior:'smooth'})}function voice(){const vs=speechSynthesis.getVoices();return vs.find(v=>/^en-GB/i.test(v.lang))||vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}function utter(text,onend){const u=new SpeechSynthesisUtterance(text);u.lang=voice()?.lang||'en-US';u.voice=voice();u.rate=+rate.value;u.pitch=1;u.onend=onend;u.onerror=()=>{playing=false;state.textContent='Stopped';playBtn.textContent='▶ Play'};speechSynthesis.speak(u)}function speakCurrent(autoNext=true){if(!cards.length)return;stopSpeech(false);playing=true;state.textContent='Playing';playBtn.textContent='🔊 Playing';const my=++token,c=cards[i],m=mode.value;const done=()=>{if(my!==token)return;if(autoNext&&playing&&i<cards.length-1){i++;show();setTimeout(()=>{if(my===token)speakCurrent(true)},450)}else{playing=false;state.textContent=i===cards.length-1?'Finished':'Ready';playBtn.textContent='▶ Play'}};if(m==='question')utter(c.q,done);else if(m==='answer')utter(c.a,done);else utter('Question. '+c.q,()=>{if(my!==token)return;setTimeout(()=>{if(my===token)utter('Answer. '+c.a,done)},350)})}function stopSpeech(reset=true){token++;speechSynthesis.cancel();playing=false;state.textContent='Ready';playBtn.textContent='▶ Play';if(reset){} }playBtn.onclick=()=>{if(speechSynthesis.paused){speechSynthesis.resume();playing=true;state.textContent='Playing';playBtn.textContent='🔊 Playing'}else speakCurrent(true)};pauseBtn.onclick=()=>{if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();playing=false;state.textContent='Paused';playBtn.textContent='▶ Resume'}};stopBtn.onclick=()=>stopSpeech();document.getElementById('prev').onclick=()=>{stopSpeech();i=Math.max(0,i-1);show()};document.getElementById('next').onclick=()=>{stopSpeech();i=Math.min(cards.length-1,i+1);show()};document.getElementById('repeat').onclick=()=>speakCurrent(false);mode.onchange=()=>stopSpeech();rate.onchange=()=>{if(speechSynthesis.speaking){speakCurrent(true)}};window.addEventListener('beforeunload',()=>speechSynthesis.cancel());</script></body></html>
